      function logPortalAccess(name, unit) {
    // Audit write: sent once via ApiClient (never resent); a lost reply is ignored.
    // V2.8.1: once per person per browser tab/session. Recorded only after the
    // server confirms the row, so a lost send is retried on the next load.
    if (typeof ApiClient === 'undefined') return;
    var logKey = 'lakeIllawongPortalLogged_zonerep';
    try { if (sessionStorage.getItem(logKey) === (name || '')) return; } catch (e) {}
    ApiClient.call('https://script.google.com/macros/s/AKfycbzVF25ss7kEmhE42Sf-i_vpLIL1FpTe2AjNeb0b8MqP_eBXAxV9ghWcuwe25hdEuqBFjw/exec', 'logAccess', {
        type: 'Portal-Login',
        name: name || '',
        unit: unit || '',
        detail: 'Zone Rep Portal'
    }, { write: true, timeout: 15000 }).then(function(r) {
        if (r && r.success) { try { sessionStorage.setItem(logKey, name || ''); } catch (e) {} }
    }).catch(function() {});
}
