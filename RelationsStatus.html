<!--
=====================================================================
RelationsStatus.html - RESIDENT DISPUTE STATUS
=====================================================================
DOCUMENT INFORMATION:
  File Name:        RelationsStatus.html
  System:           Lake Illawong Management Central System
  Component Type:   Resident Module
  Frontend Version: V1.0.0
  Backend:          RelationsManager V1.0.10 -- getRelationsByUnit
  Status:           DEVELOPMENT
  Created:          Aug 2026

PURPOSE:
  Resident-facing, read-only lookup of the disputes logged against the
  verified resident's unit -- Relations equivalent of ComplaintStatus.html.
  Unlike ComplaintStatus.html (which queried ComplaintsManager and
  DisputesManager separately and rendered two sections), Relations is a
  single unified backend/sheet, so this is ONE list, sorted by LoggedAt
  desc (already sorted server-side by getRelationsByUnit).

FIELD SCOPE (deliberate, matches ComplaintStatus.html's own restraint):
  Shown:     Category, Logged, Review Due, Status, Dispute Type (once
             triaged), your role (Party A/Party B, Resident-to-Resident
             only), Desired Outcome, your own Description, Issue Detail
             (Resident-to-Resident only, once triaged), Process
             Statement, Resolution Summary / Closure Notes.
  Not shown: Location, Previous Actions, People Involved, Incident
             Date/Time -- internal triage aids, never surfaced on
             ComplaintStatus.html either. Add later only if asked.

PRIVACY RULE (from RelationsManager.js's own design, not invented here):
  Description is the submitter's raw, unfiltered account -- shown back
  to them only (unitRole === 'A', which getRelationsByUnit guarantees
  for Management-type disputes since Party B never exists there).
  NEVER shown to unitRole 'B'. IssueDetail is the Board-authored,
  blame-neutral version, sent to and shown to both parties once triaged
  as Resident-to-Resident.

VERSION HISTORY:
  V1.0.0 (Aug 2026): Initial build. Card structure, JSONP helper, and
    page shell adapted from ComplaintStatus_V1_3_4.html (collapsed on
    the two-source-list JSONP call design there, since Relations only
    needs one). Status pill / card left-border / dispute-type-badge
    colours and labels (rel-pill-*, status-*, card-dispute-type.mt-*,
    matterTypeLabel/matterTypeClass/partyALabel/statusDisplayLabel
    logic) ported verbatim from RelationsManager.html V1.0.17 -- the
    authoritative, already-tested source -- rather than from the older
    pre-unification Dispute Module Colour Schema in
    Unified_Design_System_v2_4.txt, which predates Relations and
    documents a status set (Referred to External Body, no Acknowledged)
    that no longer applies. Session key: lakeIllawongVerified, shared
    with the wider resident module family (DocumentLibrary,
    ResidentDirectory, ResidentDetailsUpdate, ComplaintForm,
    ComplaintStatus) -- deliberately NOT portalAdminVerified
    (RelationsForm.html's key), since this is pure resident self-
    service with no Board dimension, confirmed with Tony.

AUTHENTICATION:
  STANDALONE OTP within module.
  Session Key: lakeIllawongVerified
  smsOnly: false (email or mobile)

SYSTEM CONNECTIONS:
  Relations: RelationsManager V1.0.10 -- getRelationsByUnit
  Auth:      ManagementCentral (via VerificationModal)

PORTAL:
  Launched from ResidentPortal.html.
  Back button returns to ResidentPortal.html.

TECHNICAL:
  Technology:   HTML5 + CSS3 + Vanilla JavaScript
  API Protocol: JSONP
  Design:       Glass-morphism — Lake Illawong Unified Design System v2.4
  Hosting:      Netlify
=====================================================================
-->
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Disputes - Lake Illawong</title>
    <script src="VerificationModal_V1_0.js"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: linear-gradient(135deg, #1e40af 0%, #1e3a8a 100%);
            min-height: 100vh;
            color: white;
        }

        .container { max-width: 800px; margin: 0 auto; padding: 20px; }

        /* ── HEADER ─────────────────────────────────────────────── */
        .header { text-align: center; margin-bottom: 24px; }

        .header-content {
            display: flex; align-items: center;
            justify-content: center; gap: 20px; margin-bottom: 15px;
        }

        .logo-image {
            width: 110px; height: 110px;
            border-radius: 50%; object-fit: cover; flex-shrink: 0;
        }

        .header-text {
            display: flex; flex-direction: column;
            align-items: flex-start; justify-content: center;
        }

        .header-title {
            font-size: 2.2rem; font-weight: 700; color: white;
            margin: 0 0 5px 0; line-height: 1.1;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.3);
        }

        .header-subtitle { font-size: 1rem; color: rgba(255,255,255,0.9); font-weight: 500; }

        .header-divider {
            height: 2px;
            background: linear-gradient(90deg, transparent 0%, rgba(255,255,255,0.3) 10%,
                rgba(255,255,255,0.8) 50%, rgba(255,255,255,0.3) 90%, transparent 100%);
            border-radius: 2px; margin-top: 15px;
        }

        /* ── BACK / REFRESH BUTTONS ─────────────────────────────── */
        .portal-back-btn, .btn-refresh {
            background: rgba(255,255,255,0.15);
            border: 1px solid rgba(255,255,255,0.3);
            color: white; padding: 8px 18px; border-radius: 2px;
            font-size: 0.88rem; font-weight: 600; cursor: pointer;
            transition: background 0.2s;
        }
        .portal-back-btn:hover, .btn-refresh:hover { background: rgba(255,255,255,0.25); }
        .btn-refresh:disabled { opacity: 0.5; cursor: not-allowed; }

        .top-btn-row {
            display: flex; align-items: center; flex-wrap: wrap;
            gap: 8px; margin: 0 0 20px 0;
        }

        /* ── CARD -- structure + status colours ported verbatim from
               RelationsManager.html V1.0.17 (authoritative, tested) ── */
        .relations-card {
            background: rgba(255,255,255,0.08); border: 1px solid rgba(255,255,255,0.15);
            border-left: 4px solid rgba(13,148,136,0.5); backdrop-filter: blur(10px);
            border-radius: 2px; margin-bottom: 10px; overflow: hidden;
        }
        .relations-card.status-open              { border-left: 4px solid #0d9488; }
        .relations-card.status-acknowledged      { border-left: 4px solid #10b981; background: rgba(16,185,129,0.2);  backdrop-filter: none; }
        .relations-card.status-under-review      { border-left: 4px solid #f59e0b; background: rgba(245,158,11,0.12); backdrop-filter: none; }
        .relations-card.status-closed-resolved   { border-left: 4px solid #cbd5e1; background: rgba(203,213,225,0.25);backdrop-filter: none; }
        .relations-card.status-closed-unresolved { border-left: 4px solid #9ca3af; background: rgba(156,163,175,0.2); backdrop-filter: none; }

        .card-summary { padding: 13px 16px; display: flex; align-items: center; gap: 12px; cursor: pointer; user-select: none; flex-wrap: wrap; }
        .card-summary:hover { background: rgba(255,255,255,0.04); }
        .card-ref { font-family: monospace; font-size: 0.8rem; font-weight: 700; color: rgba(255,255,255,0.6); white-space: nowrap; }
        .card-title { font-size: 0.92rem; font-weight: 600; color: white; flex: 1; min-width: 100px; }
        .card-dispute-type {
            font-size: 0.68rem; font-weight: 700; text-transform: uppercase; letter-spacing: 0.4px;
            padding: 2px 8px; border-radius: 10px; white-space: nowrap;
        }
        .card-dispute-type.mt-management { background: rgba(59,130,246,0.3);  color: #bfdbfe; }
        .card-dispute-type.mt-resident   { background: rgba(13,148,136,0.3);  color: #99f6e4; }
        .card-dispute-type.mt-untriaged  { background: rgba(255,255,255,0.12);color: rgba(255,255,255,0.6); }
        .card-date { font-size: 0.78rem; color: rgba(255,255,255,0.45); white-space: nowrap; }
        .card-chevron { color: rgba(255,255,255,0.4); font-size: 0.85rem; transition: transform 0.2s; flex-shrink: 0; }
        .relations-card.expanded .card-chevron { transform: rotate(180deg); }

        /* ── STATUS PILLS -- teal palette, ported verbatim ─────────── */
        .status-pill {
            display: inline-block; padding: 3px 10px; border-radius: 20px;
            font-size: 0.72rem; font-weight: 700; text-transform: uppercase;
            letter-spacing: 0.4px; white-space: nowrap;
        }
        .rel-pill-open              { background: rgba(20,184,166,0.35); color: #99f6e4; border: 1px solid rgba(45,212,191,0.6); }
        .rel-pill-acknowledged      { background: rgba(16,185,129,0.3);  color: #6ee7b7; border: 1px solid rgba(52,211,153,0.6); }
        .rel-pill-under-review      { background: rgba(234,179,8,0.3);   color: #fef08a; border: 1px solid rgba(234,179,8,0.6); }
        .rel-pill-closed-resolved   { background: rgba(148,163,184,0.25);color: #cbd5e1; border: 1px solid rgba(148,163,184,0.5); }
        .rel-pill-closed-unresolved { background: rgba(107,114,128,0.3); color: #d1d5db; border: 1px solid rgba(107,114,128,0.6); }

        /* ── CARD DETAIL ─────────────────────────────────────────── */
        .card-detail { display: none; border-top: 1px solid rgba(255,255,255,0.1); padding: 14px 16px; }
        .relations-card.expanded .card-detail { display: block; }

        .detail-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px 20px; margin-bottom: 12px; }
        .detail-field.full-width { grid-column: 1 / -1; }
        .detail-label {
            font-size: 0.7rem; font-weight: 700; text-transform: uppercase;
            letter-spacing: 0.5px; color: rgba(255,255,255,0.4); margin-bottom: 3px;
        }
        .detail-value { font-size: 0.87rem; color: rgba(255,255,255,0.85); line-height: 1.5; white-space: pre-wrap; }

        .info-block {
            background: rgba(13,148,136,0.1); border: 1px solid rgba(13,148,136,0.25);
            border-radius: 2px; padding: 10px 12px; margin-top: 10px;
        }
        .info-block .detail-label { color: #5eead4; }
        .info-block .detail-value { white-space: pre-wrap; }

        /* ── STATES ──────────────────────────────────────────────── */
        .loading-state, .empty-state { text-align: center; padding: 36px 20px; }
        .spinner {
            width: 32px; height: 32px; border: 3px solid rgba(255,255,255,0.2);
            border-top-color: white; border-radius: 50%;
            animation: spin 0.8s linear infinite; margin: 0 auto 12px;
        }
        @keyframes spin { to { transform: rotate(360deg); } }
        .state-text { color: rgba(255,255,255,0.65); font-size: 0.88rem; }
        .state-icon { font-size: 2rem; margin-bottom: 8px; }

        @media (max-width: 600px) {
            .header-content { flex-direction: column; gap: 15px; }
            .header-text    { align-items: center; text-align: center; }
            .header-title   { font-size: 1.8rem; }
            .logo-image     { width: 70px; height: 70px; }
            .detail-grid    { grid-template-columns: 1fr; }
        }
    </style>
</head>
<body>
<div class="container">

    <!-- Header - system standard -->
    <div class="header">
        <div class="header-content">
            <div class="logo-container">
                <img src="logo.png" alt="Lake Illawong Logo" class="logo-image">
            </div>
            <div class="header-text">
                <h1 class="header-title">My Disputes</h1>
                <p class="header-subtitle">Lake Illawong Retirement Village</p>
            </div>
        </div>
        <div class="header-divider"></div>
    </div>

    <!-- Back button + Refresh -->
    <div class="top-btn-row">
        <button class="portal-back-btn" onclick="window.location.href='ResidentPortal.html'">
            &#8592; Back to Resident Portal
        </button>
        <button class="btn-refresh" id="btnRefresh" onclick="refreshList()">&#8635; Refresh</button>
    </div>

    <div id="disputeList">
        <div class="loading-state">
            <div class="spinner"></div>
            <div class="state-text">Loading your disputes...</div>
        </div>
    </div>

</div>
<script>
    const CONFIG = {
        BACKEND_URL: 'https://script.google.com/macros/s/AKfycbyTuaQ90JhsVxgzD7olxO_MicP5JNlcTiQk2gQd7cwi0prHSBtx8TVl2GZQTTFT7jVN-A/exec',
        SESSION_KEY: 'lakeIllawongVerified'
    };

    var currentUnit = '';

    // ── AUTH ──────────────────────────────────────────────────────────────

    document.addEventListener('DOMContentLoaded', function () {
        const alreadyVerified = VerificationModal.init({
            moduleName: 'My Disputes',
            moduleIcon: '&#9878;',
            sessionKey: CONFIG.SESSION_KEY,
            smsOnly:    false,
            onSuccess:  handleVerificationSuccess
        });
        if (!alreadyVerified) { VerificationModal.show(); }
    });

    function handleVerificationSuccess(userData) {
        currentUnit = (userData.unit || '').trim();
        if (!currentUnit) {
            showListError('No unit number found for your account. Please contact the Board.');
            return;
        }
        loadDisputes();
    }

    function refreshList() {
        const btn = document.getElementById('btnRefresh');
        if (btn) { btn.disabled = true; btn.textContent = '\u21bb Refreshing...'; }
        loadDisputes();
        setTimeout(function () {
            if (btn) { btn.disabled = false; btn.textContent = '\u21bb Refresh'; }
        }, 1200);
    }

    // ── JSONP HELPER ──────────────────────────────────────────────────────

    function jsonp(params, onSuccess, onError) {
        const callbackName = 'rs_cb_' + Date.now() + '_' + Math.random().toString(36).slice(2);
        const qs = Object.keys(params).map(function(k) {
            return encodeURIComponent(k) + '=' + encodeURIComponent(params[k]);
        }).join('&');
        const url = CONFIG.BACKEND_URL + '?' + qs + '&callback=' + callbackName;

        let settled = false;
        const s = document.createElement('script');

        function cleanup() {
            window[callbackName] = function () {};
            try { document.head.removeChild(s); } catch (e) {}
        }

        const timer = setTimeout(function () {
            if (settled) return;
            settled = true;
            cleanup();
            if (onError) onError('Server did not respond. Please try refreshing.');
        }, 15000);

        window[callbackName] = function (data) {
            if (settled) return;
            settled = true;
            clearTimeout(timer);
            cleanup();
            if (onSuccess) onSuccess(data);
        };

        s.onerror = function () {
            if (settled) return;
            settled = true;
            clearTimeout(timer);
            cleanup();
            if (onError) onError('Could not reach the server.');
        };
        s.src = url;
        document.head.appendChild(s);
    }

    // ── LOAD DISPUTES ────────────────────────────────────────────────────

    function loadDisputes() {
        jsonp(
            { action: 'getRelationsByUnit', unit: currentUnit },
            function(data) {
                if (!data.success) {
                    showListError(data.error || 'Could not load your disputes.');
                    return;
                }
                renderDisputes(data.relations || []);
            },
            function(err) { showListError(err); }
        );
    }

    function renderDisputes(relations) {
        const list = document.getElementById('disputeList');
        if (relations.length === 0) {
            list.innerHTML = '<div class="empty-state"><div class="state-icon">&#128203;</div><div class="state-text">No disputes found for your unit.</div></div>';
            return;
        }
        list.innerHTML = relations.map(function(r) { return buildCard(r); }).join('');
    }

    // ── LABEL / CLASS HELPERS -- ported verbatim from RelationsManager.html
    //    V1.0.17, the authoritative already-tested source. ────────────────

    function matterTypeLabel(r) {
        if (r.matterType === 'Management') return 'Resident-to-Management';
        if (r.matterType === 'Resident')   return 'Resident-to-Resident';
        return 'Untriaged';
    }
    function matterTypeClass(r) {
        if (r.matterType === 'Management') return 'mt-management';
        if (r.matterType === 'Resident')   return 'mt-resident';
        return 'mt-untriaged';
    }
    // 'Party A'/'Party B' for Resident-to-Resident disputes (neither party
    // is more "the resident" than the other). 'Resident' for Management
    // disputes and untriaged ones, where there's only one party.
    function partyALabel(r) { return r.matterType === 'Resident' ? 'Party A' : 'Resident'; }

    function statusPillClass(status) {
        const map = {
            'Open':                   'rel-pill-open',
            'Acknowledged':           'rel-pill-acknowledged',
            'Under Review':           'rel-pill-under-review',
            'Closed - Resolved':      'rel-pill-closed-resolved',
            'Closed - Unresolved':    'rel-pill-closed-unresolved'
        };
        return map[status] || 'rel-pill-open';
    }
    function statusCardClass(status) {
        const map = {
            'Open':                   'status-open',
            'Acknowledged':           'status-acknowledged',
            'Under Review':           'status-under-review',
            'Closed - Resolved':      'status-closed-resolved',
            'Closed - Unresolved':    'status-closed-unresolved'
        };
        return map[status] || 'status-open';
    }
    // "(ER)" suffix when Early Resolution is flagged -- applies to either
    // closure outcome. Text suffix rather than a separate pill colour,
    // matching RelationsManager.html's own statusDisplayLabel() exactly.
    function statusDisplayLabel(r) {
        return r.status + (r.earlyResolution ? ' (ER)' : '');
    }

    // ── BUILD CARD ───────────────────────────────────────────────────────

    function buildCard(r) {
        const ref       = r.referenceNumber;
        const borderCls = statusCardClass(r.status);
        const pillCls   = statusPillClass(r.status);
        const dateStr   = r.loggedAt ? fmtDate(new Date(r.loggedAt)) : '—';

        return '<div class="relations-card ' + borderCls + '" id="rc-' + escHtml(ref) + '">' +
            '<div class="card-summary" onclick="toggleCard(\'' + escHtml(ref) + '\')">' +
                '<div class="card-ref">' + escHtml(ref) + '</div>' +
                '<div class="card-title">' + escHtml(r.category || 'Dispute') + '</div>' +
                '<span class="card-dispute-type ' + matterTypeClass(r) + '">' + matterTypeLabel(r) + '</span>' +
                '<span class="status-pill ' + pillCls + '">' + escHtml(statusDisplayLabel(r)) + '</span>' +
                '<div class="card-date">Logged ' + dateStr + '</div>' +
                '<div class="card-chevron">&#9660;</div>' +
            '</div>' +
            '<div class="card-detail">' +
                buildCardDetail(r) +
            '</div>' +
        '</div>';
    }

    function buildCardDetail(r) {
        const isResident = r.matterType === 'Resident';
        // Description is the submitter's raw, unfiltered account -- shown
        // back only to whoever wrote it (unitRole 'A'; getRelationsByUnit
        // guarantees this is always true for Management-type disputes,
        // since Party B never exists there). Never shown to unitRole 'B'.
        const showDescription = r.unitRole !== 'B';

        var html = '<div class="detail-grid">';
        html += detailField('Category',    r.category || '—');
        html += detailField('Logged',      r.loggedAt  ? fmtDateLong(new Date(r.loggedAt))  : '—');
        html += detailField('Review By',   r.reviewDue ? fmtDateLong(new Date(r.reviewDue)) : '—');
        html += detailField('Status',      statusDisplayLabel(r));
        if (isResident) html += detailField('Your Role', 'You are ' + (r.unitRole === 'A' ? partyALabel(r) : 'Party B'));
        if (r.desiredOutcome) html += detailField('Desired Outcome', r.desiredOutcome, true);
        if (showDescription && r.description) html += detailField('Your Account', r.description, true);
        html += '</div>';

        // Issue Detail -- Resident-to-Resident only, the Board-authored,
        // blame-neutral version sent to and shown to both parties once
        // triaged. Shown to both Party A and Party B.
        if (isResident && r.issueDetail) {
            html += '<div class="info-block">' +
                '<div class="detail-label">Issue Detail</div>' +
                '<div class="detail-value">' + escHtml(r.issueDetail) + '</div>' +
            '</div>';
        }

        if (r.processStatement) {
            html += '<div class="info-block">' +
                '<div class="detail-label">Board Process Statement</div>' +
                '<div class="detail-value">' + escHtml(r.processStatement) + '</div>' +
            '</div>';
        }

        if (r.resolutionSummary) {
            html += '<div class="info-block">' +
                '<div class="detail-label">Resolution Summary</div>' +
                '<div class="detail-value">' + escHtml(r.resolutionSummary) +
                    (r.earlyResolution ? '<br><br><em>Flagged as Early Resolution.</em>' : '') + '</div>' +
            '</div>';
        }

        if (r.closureNotes) {
            html += '<div class="info-block">' +
                '<div class="detail-label">Closure Notes</div>' +
                '<div class="detail-value">' + escHtml(r.closureNotes) + '</div>' +
            '</div>';
        }

        // Explanatory note -- consolidated from ComplaintForm.html's own
        // tested success-screen wording (VicAssist + CAV), applied
        // generically since Relations covers the full statutory "Village
        // Dispute" definition, not just resident-to-resident matters.
        // Deliberately NOT pre-empting the still-open VicAssist/CAV "no
        // closed doors" wording decision -- that's about backend
        // notification content, not this static informational text.
        html += '<div style="margin-top:12px;font-size:0.78rem;color:rgba(255,255,255,0.4);line-height:1.5;">' +
            'The Board of Management manages this dispute. If you have questions, please contact the Board ' +
            'directly. If the Board is unable to resolve it internally, you will receive advice on your ' +
            'options, including VicAssist Retirement Villages as a suggested (not required) first step for ' +
            'independent conciliation, or Consumer Affairs Victoria for further advice.' +
        '</div>';

        return html;
    }

    // ── UTILITY ───────────────────────────────────────────────────────────

    function toggleCard(ref) {
        const card = document.getElementById('rc-' + ref);
        if (card) card.classList.toggle('expanded');
    }

    function detailField(label, value, fullWidth) {
        return '<div class="detail-field' + (fullWidth ? ' full-width' : '') + '">' +
            '<div class="detail-label">' + escHtml(label) + '</div>' +
            '<div class="detail-value">' + escHtml(value) + '</div>' +
        '</div>';
    }

    function fmtDate(d) {
        if (!d || isNaN(d)) return '—';
        return d.toLocaleDateString('en-AU', { day: 'numeric', month: 'short', year: 'numeric' });
    }

    function fmtDateLong(d) {
        if (!d || isNaN(d)) return '—';
        return d.toLocaleDateString('en-AU', { day: 'numeric', month: 'long', year: 'numeric' });
    }

    function escHtml(str) {
        if (str === null || str === undefined) return '';
        return String(str)
            .replace(/&/g, '&amp;')
            .replace(/</g, '&lt;')
            .replace(/>/g, '&gt;')
            .replace(/"/g, '&quot;');
    }

    function showListError(msg) {
        document.getElementById('disputeList').innerHTML =
            '<div class="empty-state"><div class="state-icon">&#9888;</div><div class="state-text">' + escHtml(msg) + '</div></div>';
    }
</script>
</body>
</html>
