<!--
=====================================================================
DocumentLibrary.html - RESIDENT DOCUMENT LIBRARY
=====================================================================
DOCUMENT INFORMATION:
  File Name:        DocumentLibrary.html
  System:           Lake Illawong Management Central System
  Component Type:   Resident Module
  Frontend Version: V2.7.0
  Backend:          DocumentLibrary V2.14
  Status:           PRODUCTION
  Created:          March 2026
  Last Modified:    Nov 2026

VERSION HISTORY:
  V2.7.0 (Nov 2026): Each document in the list (desktop rows and phone cards)
    now shows "Updated 27 Nov 2026" under its description: the later of the
    date it was added and the date its file was last replaced (the same date
    that drives the New marker). Shown for every document so residents can see
    how current it is, which matters most for undated documents such as the
    Welcome Pack. Display only; no other change.
  V2.6.0 (Nov 2026): A document whose file has been REPLACED in the Manager
    (Edit > Replace file, backend V2.15) shows as New again, and sits first
    among undated documents. The "New" markers (document rows and category /
    subcategory cards) now count from the later of Date Added and the date the
    file was last replaced (new field lastUpdated from backend V2.15; with an
    older backend there is no such field and nothing changes). NEW_BADGE_DAYS is
    unchanged. No other change.
  V2.5.0 (Nov 2026): Tidy-up: header title 2.2rem / mobile 1.8rem and the Back
    button reads "Back to Portal", per the Design System header standard.
  V2.4.0 (Nov 2026): NEW - Category > Subcategory > Year browsing (step 6 of the
    structure build; needs backend V2.13 or later for the structure and the
    subcategory on each document). (1) A category that holds documents filed in
    subcategories opens a SUB-MENU of cards, one per subcategory the person
    can actually open (a subcategory they have no documents in, for example
    Executive for someone without that role, is not shown at all). A category
    with no subcategories opens its document list directly, as before. (2) The
    list is grouped under YEAR headings, newest first, using the rule for that
    category / subcategory in the DocCategories tab (Calendar year: 2026;
    Financial year July-June: 2025-26; None: no headings). The year comes from
    the document's Document Date; a document with no date sits under
    "Undated" at the end. (3) A BREADCRUMB (All Categories > Category >
    Subcategory) sits above each list, each part is a link; the Back button
    goes up one level. (4) Category order and icons now come from the
    DocCategories tab (Sort order and Icon); a category not in the tab is
    still shown, after the others, with the old icon list or a folder icon.
    (5) Search also matches the subcategory, and each result shows
    "Category > Subcategory" so the person can see where it lives. If the
    structure cannot be loaded the page works as in V2.3.0 (alphabetical
    categories, no sub-menu, no year headings). Frequently Opened, All
    Documents, the New markers, Download, the list styling and everything
    else are unchanged. The year is read in the person's own time zone, which
    matches the spreadsheet's for residents in Australia.
  V2.3.0 (Nov 2026): NEW - Download. Each uploaded (Drive) document in the
    list now has a Download button next to the type icon, and the phone
    cards have one too. It saves the file to the person's device using
    Google Drive's download address (the files are shared "anyone with the
    link", as they already were for viewing). Clicking the row still opens the
    document as before. Links and paper copies have no Download button, as
    there is no file. No backend change. If Drive cannot supply the file the
    resident sees the same kind of message as for a failed open.
  V2.2.0 (Nov 2026): STYLE - the document list (desktop rows and the mobile
    cards) is now a solid light panel with dark text and the blue header
    row, matching the Document Library Manager and the Design System rule
    that data lists are never glass. Before, the list was translucent white
    text on the blue background, which read as drab and was hard to scan.
    Panel #f8fafc, rows #f1f5f9, row hover #e2e8f0, header gradient
    #1e40af to #1e3a8a (the Manager's values). The "New" pill is recoloured
    to stay readable on the light rows. The category cards, search box,
    header and everything else are unchanged. CSS only: no script change.
  V2.1.2 (Nov 2026): FIX - a document title, category name or file location
    containing an apostrophe (e.g. "Residents' Notice") broke the click
    handlers: escHtml() does not escape quotes, and the text was placed
    inside onclick="fn('...')" strings, so the JavaScript string ended
    early and the click did nothing. Click handlers no longer carry any
    text: documents pass only their ID (openDocumentById looks the record
    up) and category cards read the name from a data- attribute, escaped
    for attribute use (new escAttr()). No visible change. No other change.
  V2.1.1 (Nov 2026): Script tag changed from VerificationModal_V1_0.js to the generic VerificationModal.js (identical code; V2.1.0 adds a quiet warm-up call that cuts slow first verification codes). No other change.
  V2.1.0 (Nov 2026): Transport migrated to the shared ApiClient.js.
    callAPI() was a single JSONP attempt (30s timeout, no retry), so one
    lost reply meant "Failed to load documents" until the resident
    refreshed -- and a lost reply on the PRIVATE call silently dropped
    those documents from the page. callAPI() is now a thin wrapper over
    ApiClient.call() with the same signature and the same rejection
    behaviour (Error 'Request timeout' / 'Network request failed'), so
    loadDocuments() is unchanged. Both calls are reads, so they retry
    automatically (3 retries, 2s/4s/6s backoff, 30s per attempt); the
    best-effort PRIVATE call is limited to 1 retry so it cannot hold the
    page up for minutes. While a retry is pending the loading text reads
    "Connection slow, retrying... (n/4)". Behaviour when the private call
    still fails is unchanged (page shows what it has, no notice). Requires
    ApiClient.js in the same folder. No other change.
  V2.0.2 (Aug 2026): System-wide JSONP audit fix -- callAPI() deleted its
    callback on timeout/success/onerror instead of replacing it with a
    no-op, and had no settled-guard, so a genuinely late cold-start
    response could throw "docLibCb_... is not defined" in console. No
    functional change to document browsing or search.

  V1.0.0 (Mar 2026): Initial release — flat list view with sidebar filters
  V2.0.0 (Apr 2026): Full redesign — category-first card grid, Frequently
                     Opened card (sheet-driven via Featured flag), drill-down
                     document list, cross-category search, first-name greeting
  V2.0.1 (Jul 2026): "New" badging — category cards show a dot if any
                     document in that category was added within NEW_BADGE_DAYS
                     (14 days); document rows show an inline "New" pill next
                     to the title. Frontend-only, no backend change required.
                     "Residential Club" corrected to "Residential Village".
                     Design System reference updated to V2.4.

AUTHENTICATION:
  Session Key:  lakeIllawongVerified (shared with ResidentDetailsUpdate.html)
  Method:       Standalone OTP via VerificationModal.js
  On no session: OTP modal displays immediately
  Verify once:  Grants access for full browser session

SYSTEM CONNECTIONS:
  Backend API:    DocumentLibrary V2.9 (JSONP — getDocuments)
  Auth:           ManagementCentral V1.3 (via VerificationModal)
  Notifications:  NotificationServer V3.2.0 (via VerificationModal OTP delivery)
  Portal:         ResidentPortal_V2_0.html (back button default)
  URL Param:      ?portal= drives back button destination

PRIMARY FEATURES:
  - Category card grid landing view
  - Frequently Opened card (pinned top-left, populated from Featured=Y in sheet)
  - All Documents card (pinned top-right)
  - Drill-down to document list per category
  - Cross-category search (always searches all accessible documents)
  - Role-based access (public + private documents per roleTags)
  - First-name personalised greeting
  - Mobile-optimised (2-column card grid, mobile document list)

TECHNICAL:
  Technology:    HTML5 + CSS3 + Vanilla JavaScript
  API Protocol:  JSONP (GET only — Netlify/GitHub Pages compatible)
  Design System: Lake Illawong Unified Design System V2.4
  Hosting:       Netlify
  Auth Script:   VerificationModal.js (external, same directory)
  Transport:     ApiClient.js (external, same directory)
=====================================================================
-->
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>📚 Document Library - Lake Illawong</title>

    <!-- ApiClient - shared JSONP transport (V2.1.0) -->
    <script src="ApiClient.js"></script>

    <!-- VerificationModal V1.0 -->
    <script src="VerificationModal.js"></script>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: linear-gradient(135deg, #1e40af 0%, #1e3a8a 100%);
            min-height: 100vh;
            color: #333;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 20px;
        }

        .hidden { display: none !important; }

        /* ============================================================
           HEADER
        ============================================================ */
        .header {
            background: transparent;
            text-align: center;
            margin-bottom: 30px;
            color: white;
        }

        .header-content {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 20px;
            margin-bottom: 15px;
        }

        .logo-image {
            width: 90px;
            height: 90px;
            border-radius: 50%;
            object-fit: cover;
            padding: 5px;
        }

        .header-text {
            text-align: left;
        }

        .header-title {
            font-size: 2.2rem;
            font-weight: 700;
            color: white;
            margin-bottom: 5px;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.3);
        }

        .header-subtitle {
            font-size: 1rem;
            color: rgba(255,255,255,0.9);
            font-weight: 500;
        }

        .header-divider {
            height: 2px;
            background: linear-gradient(90deg, transparent 0%, rgba(255,255,255,0.3) 10%, rgba(255,255,255,0.8) 50%, rgba(255,255,255,0.3) 90%, transparent 100%);
            border-radius: 2px;
            margin-top: 15px;
        }

        /* ============================================================
           TOP BAR (back button + user info)
        ============================================================ */
        .top-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
            gap: 15px;
            flex-wrap: wrap;
        }

        .back-btn {
            background: rgba(255,255,255,0.1);
            border: 1px solid rgba(255,255,255,0.2);
            color: white;
            padding: 10px 20px;
            border-radius: 2px;
            text-decoration: none;
            display: inline-block;
            cursor: pointer;
            font-size: 0.9rem;
            font-weight: 600;
            transition: background 0.2s;
            backdrop-filter: blur(10px);
            min-height: 44px;
        }

        .back-btn:hover {
            background: rgba(255,255,255,0.15);
        }

        .user-info-bar {
            background: rgba(255,255,255,0.1);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255,255,255,0.2);
            border-radius: 2px;
            padding: 12px 20px;
            color: white;
            display: flex;
            align-items: center;
            gap: 15px;
            flex-wrap: wrap;
        }

        .user-info-text {
            font-size: 0.9rem;
        }

        .user-info-text strong {
            font-weight: 600;
        }

        .logout-btn {
            background: rgba(255,255,255,0.1);
            border: 1px solid rgba(255,255,255,0.2);
            color: white;
            padding: 6px 14px;
            border-radius: 2px;
            cursor: pointer;
            font-weight: 500;
            font-size: 0.85rem;
            transition: background 0.2s;
            min-height: 44px;
        }

        .logout-btn:hover {
            background: rgba(255,255,255,0.2);
        }

        /* ============================================================
           SEARCH BAR
        ============================================================ */
        .search-section {
            margin-bottom: 30px;
        }

        .search-wrapper {
            position: relative;
            max-width: 600px;
        }

        .search-icon {
            position: absolute;
            left: 15px;
            top: 50%;
            transform: translateY(-50%);
            color: rgba(255,255,255,0.6);
            font-size: 18px;
            pointer-events: none;
        }

        .search-input {
            width: 100%;
            padding: 14px 20px 14px 50px;
            background: rgba(255,255,255,0.1);
            border: 1px solid rgba(255,255,255,0.2);
            border-radius: 2px;
            color: white;
            font-size: 1rem;
            backdrop-filter: blur(10px);
            transition: all 0.2s;
            min-height: 44px;
        }

        .search-input::placeholder {
            color: rgba(255,255,255,0.6);
        }

        .search-input:focus {
            outline: none;
            background: rgba(255,255,255,0.15);
            border-color: rgba(255,255,255,0.5);
        }

        .search-clear {
            position: absolute;
            right: 12px;
            top: 50%;
            transform: translateY(-50%);
            background: none;
            border: none;
            color: rgba(255,255,255,0.6);
            cursor: pointer;
            font-size: 1.2rem;
            padding: 4px 8px;
            border-radius: 2px;
            display: none;
        }

        .search-clear:hover {
            color: white;
        }

        /* ============================================================
           LOADING STATE
        ============================================================ */
        .loading-state {
            text-align: center;
            padding: 80px 20px;
            color: rgba(255,255,255,0.8);
        }

        .spinner {
            border: 4px solid rgba(255,255,255,0.15);
            border-top: 4px solid rgba(255,255,255,0.6);
            border-radius: 50%;
            width: 50px;
            height: 50px;
            animation: spin 1s linear infinite;
            margin: 0 auto 20px;
        }

        @keyframes spin {
            0%   { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        /* ============================================================
           CATEGORY GRID VIEW (default landing)
        ============================================================ */

        .section-label {
            color: rgba(255,255,255,0.85);
            font-size: 0.8rem;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-bottom: 12px;
        }

        /* Category grid */
        .categories-section {
            margin-bottom: 20px;
        }

        .category-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(160px, 1fr));
            gap: 16px;
        }

        .category-card {
            background: rgba(255,255,255,0.08);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255,255,255,0.15);
            border-radius: 2px;
            padding: 24px 20px;
            cursor: pointer;
            transition: all 0.2s;
            text-align: center;
            min-height: 120px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 10px;
        }

        .category-card:hover {
            background: rgba(255,255,255,0.14);
            border-color: rgba(255,255,255,0.3);
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(0,0,0,0.15);
        }

        .category-card.featured-card {
            background: linear-gradient(135deg, rgba(251,191,36,0.2) 0%, rgba(245,158,11,0.15) 100%);
            border-color: rgba(251,191,36,0.5);
        }

        .category-card.featured-card:hover {
            background: linear-gradient(135deg, rgba(251,191,36,0.3) 0%, rgba(245,158,11,0.25) 100%);
            border-color: rgba(251,191,36,0.7);
        }

        .category-card.featured-card .category-icon {
            color: #fbbf24;
        }

        .category-card.all-docs {
            border-style: dashed;
            border-color: rgba(255,255,255,0.25);
        }

        .category-icon {
            font-size: 2rem;
        }

        .category-name {
            color: white;
            font-weight: 600;
            font-size: 0.95rem;
            line-height: 1.3;
        }

        /* ============================================================
           "NEW" BADGE
        ============================================================ */

        /* Category card — position:relative already implied by flex;
           the dot sits top-right inside the card */
        .category-card {
            position: relative;
        }

        .new-dot {
            position: absolute;
            top: 8px;
            right: 8px;
            background: #10b981;
            color: white;
            font-size: 0.62rem;
            font-weight: 700;
            letter-spacing: 0.5px;
            text-transform: uppercase;
            padding: 2px 6px;
            border-radius: 20px;
            line-height: 1.4;
            pointer-events: none;
        }

        /* Inline pill used on document rows */
        .new-pill {
            display: inline-block;
            background: #d1fae5;
            border: 1px solid #6ee7b7;
            color: #047857;
            font-size: 0.65rem;
            font-weight: 700;
            letter-spacing: 0.5px;
            text-transform: uppercase;
            padding: 1px 6px;
            border-radius: 20px;
            margin-left: 8px;
            vertical-align: middle;
            line-height: 1.5;
            pointer-events: none;
        }

        /* ============================================================
           DRILL-DOWN (document list inside a category / search results)
        ============================================================ */
        .drill-header {
            display: flex;
            align-items: center;
            gap: 15px;
            margin-bottom: 20px;
            flex-wrap: wrap;
        }

        .drill-back-btn {
            background: rgba(255,255,255,0.1);
            border: 1px solid rgba(255,255,255,0.2);
            color: white;
            padding: 10px 20px;
            border-radius: 2px;
            cursor: pointer;
            font-size: 0.9rem;
            font-weight: 600;
            transition: background 0.2s;
            min-height: 44px;
        }

        .drill-back-btn:hover {
            background: rgba(255,255,255,0.18);
        }

        .drill-title {
            color: white;
            font-size: 1.2rem;
            font-weight: 700;
        }

        .drill-count {
            color: rgba(255,255,255,0.65);
            font-size: 0.9rem;
            font-weight: 500;
        }

        /* Desktop list */
        .doc-list-container {
            background: #f8fafc;
            border-radius: 2px;
            overflow: hidden;
            box-shadow: 0 4px 20px rgba(0,0,0,0.15);
        }

        .doc-list-header {
            display: grid;
            grid-template-columns: 1fr 160px 50px 112px;
            gap: 15px;
            padding: 13px 20px;
            background: linear-gradient(90deg, #1e40af 0%, #1e3a8a 100%);
        }

        .doc-list-header-cell {
            color: white;
            font-weight: 600;
            font-size: 0.8rem;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .doc-row {
            display: grid;
            grid-template-columns: 1fr 160px 50px 112px;
            gap: 15px;
            padding: 15px 20px;
            background: #f1f5f9;
            border-bottom: 1px solid #e2e8f0;
            cursor: pointer;
            transition: background 0.15s;
            align-items: center;
        }

        .doc-row:last-child {
            border-bottom: none;
        }

        .doc-row:hover {
            background: #e2e8f0;
        }

        .doc-row-title {
            color: #1e293b;
            font-weight: 500;
            font-size: 0.95rem;
            line-height: 1.4;
        }

        .doc-row-desc {
            color: #64748b;
            font-size: 0.8rem;
            margin-top: 3px;
            line-height: 1.3;
        }

        /* V2.7.0: Updated date */
        .doc-row-updated {
            color: #94a3b8;
            font-size: 0.75rem;
            margin-top: 3px;
        }

        .doc-row-category {
            color: #374151;
            font-size: 0.85rem;
        }

        .doc-row-type {
            font-size: 1.3rem;
            text-align: center;
        }

        /* V2.3.0: Download button */
        .btn-download {
            background: linear-gradient(135deg, #1e40af 0%, #1e3a8a 100%);
            color: white;
            border: none;
            border-radius: 2px;
            padding: 8px 12px;
            font-size: 0.8rem;
            font-weight: 600;
            cursor: pointer;
            white-space: nowrap;
            transition: opacity 0.15s;
        }

        .btn-download:hover { opacity: 0.85; }
        .doc-row-download { text-align: center; }

        /* Mobile card list (inside drill-down) */
        .mobile-doc-list {
            display: none;
        }

        .mobile-doc-item {
            background: #f1f5f9;
            border: 1px solid #e2e8f0;
            border-radius: 2px;
            padding: 16px;
            margin-bottom: 10px;
            cursor: pointer;
            transition: background 0.15s;
            overflow: hidden;
            min-width: 0;
        }

        .mobile-doc-item:hover {
            background: #e2e8f0;
        }

        .mobile-doc-item-title {
            color: #1e293b;
            font-weight: 600;
            font-size: 0.95rem;
            margin-bottom: 6px;
            line-height: 1.4;
            word-break: break-word;
            overflow-wrap: anywhere;
        }

        .mobile-doc-item-meta {
            display: flex;
            justify-content: space-between;
            align-items: center;
            color: #64748b;
            font-size: 0.82rem;
            gap: 10px;
        }

        .mobile-doc-item-desc {
            color: #64748b;
            font-size: 0.8rem;
            margin-top: 5px;
            line-height: 1.3;
        }

        /* Empty states */
        .empty-state {
            text-align: center;
            padding: 60px 20px;
            color: rgba(255,255,255,0.7);
        }

        .empty-state-icon {
            font-size: 3rem;
            margin-bottom: 15px;
            opacity: 0.6;
        }

        .empty-state h3 {
            color: rgba(255,255,255,0.9);
            margin-bottom: 8px;
            font-size: 1.1rem;
        }

        /* ============================================================
           SEARCH RESULTS label
        ============================================================ */
        .search-results-label {
            color: rgba(255,255,255,0.75);
            font-size: 0.9rem;
            margin-bottom: 15px;
        }

        .search-results-label strong {
            color: white;
        }

        /* V2.4.0: breadcrumb and year headings */
        .crumb {
            color: rgba(255,255,255,0.7);
            font-size: 0.85rem;
            margin-bottom: 16px;
        }

        .crumb-link {
            background: none;
            border: none;
            color: rgba(255,255,255,0.9);
            cursor: pointer;
            font-size: inherit;
            padding: 0;
            text-decoration: underline;
        }

        .crumb-link:hover { color: white; }

        .year-heading {
            padding: 10px 20px;
            background: #e2e8f0;
            color: #1e3a8a;
            font-weight: 700;
            font-size: 0.85rem;
            letter-spacing: 0.5px;
            border-bottom: 1px solid #cbd5e1;
        }

        .mobile-year-heading {
            color: rgba(255,255,255,0.85);
            font-weight: 700;
            font-size: 0.85rem;
            letter-spacing: 0.5px;
            text-transform: uppercase;
            margin: 14px 0 8px;
        }

        /* ============================================================
           RESPONSIVE
        ============================================================ */
        @media (max-width: 768px) {
            .header-content {
                flex-direction: column;
                gap: 12px;
            }

            .header-text {
                text-align: center;
            }

            .header-title {
                font-size: 1.8rem;
            }

            .logo-image {
                width: 70px;
                height: 70px;
            }

            .top-bar {
                flex-direction: column;
                align-items: stretch;
            }

            .user-info-bar {
                justify-content: space-between;
            }

            .category-grid {
                grid-template-columns: 1fr 1fr;
                gap: 10px;
            }

            .category-card {
                min-height: 110px;
                height: 110px;
                padding: 14px 10px;
                gap: 8px;
                box-sizing: border-box;
                width: 100%;
            }

            .category-icon {
                font-size: 1.6rem;
            }

            .category-name {
                font-size: 0.82rem;
            }

            /* Hide desktop list, show mobile items */
            .doc-list-container {
                display: none;
            }

            .mobile-doc-list {
                display: block;
            }

            .mobile-doc-item-title {
                white-space: normal;
                word-break: break-word;
                overflow-wrap: anywhere;
            }
        }
    </style>
</head>
<body>

<div class="container" id="mainContent" style="display:none;">

    <!-- HEADER -->
    <div class="header">
        <div class="header-content">
            <img src="logo.png" alt="Lake Illawong Logo" class="logo-image">
            <div class="header-text">
                <div class="header-title">📚 Document Library</div>
                <div class="header-subtitle">Lake Illawong Residential Village</div>
            </div>
        </div>
        <div class="header-divider"></div>
    </div>

    <!-- TOP BAR -->
    <div class="top-bar">
        <button class="back-btn" onclick="goBackToPortal()">← Back to Portal</button>
        <div class="user-info-bar">
            <div class="user-info-text">
                Welcome, <strong id="userName">–</strong> &nbsp;|&nbsp; <strong id="userUnit">–</strong>
            </div>
            <button class="logout-btn" onclick="logout()">Log Out</button>

    </div>

    <!-- SEARCH -->
    <div class="search-section">
        <div class="search-wrapper">
            <span class="search-icon">🔍</span>
            <input type="text"
                   id="searchInput"
                   class="search-input"
                   placeholder="Search all documents..."
                   oninput="handleSearch(this.value)">

    <!-- LOADING -->
    <div id="loadingState" class="loading-state">
        <div class="spinner"></div>
        <p id="loadingText">Loading documents...</p>

    <!-- ============================================================
         CATEGORY GRID VIEW (default)
    ============================================================ -->
    <div id="categoryView" class="hidden">

        <!-- Category Cards -->
        <div class="categories-section">
            <div class="section-label">Browse by Category</div>
            <div class="category-grid" id="categoryGrid"></div>
        </div>

    </div>

    <!-- ============================================================
         SUB-MENU VIEW (V2.4.0): the subcategories of one category
    ============================================================ -->
    <div id="subView" class="hidden">
        <div class="drill-header">
            <button class="drill-back-btn" onclick="backToCategories()">← All Categories</button>
            <div>
                <div class="drill-title" id="subTitle"></div>
                <div class="drill-count" id="subCount"></div>
            </div>
        </div>
        <div class="crumb" id="subCrumb"></div>
        <div class="category-grid" id="subGrid"></div>
    </div>

    <!-- ============================================================
         DRILL-DOWN / SEARCH RESULTS VIEW
    ============================================================ -->
    <div id="drillView" class="hidden">

        <!-- Drill header -->
        <div class="drill-header">
            <button class="drill-back-btn" id="drillBackBtn" onclick="goBackOne()">← All Categories</button>
            <div>
                <div class="drill-title" id="drillTitle"></div>
                <div class="drill-count" id="drillCount"></div>
            </div>
        </div>
        <div class="crumb hidden" id="drillCrumb"></div>

        <!-- Search results label (shown only in search mode) -->
        <div id="searchResultsLabel" class="search-results-label hidden"></div>

        <!-- Desktop list -->
        <div class="doc-list-container" id="docListContainer">
            <div class="doc-list-header">
                <div class="doc-list-header-cell">Document</div>
                <div class="doc-list-header-cell">Category</div>
                <div class="doc-list-header-cell" style="text-align:center;">Type</div>
                <div class="doc-list-header-cell" style="text-align:center;"></div>
            </div>
            <div id="docListBody"></div>
        </div>

        <!-- Mobile card list -->
        <div class="mobile-doc-list" id="mobileDocList"></div>

        <!-- Empty state -->
        <div id="drillEmpty" class="empty-state hidden">
            <div class="empty-state-icon">📭</div>
            <h3>No documents found</h3>
            <p>Try a different search term</p>
        </div>

    </div>

</div><!-- /mainContent -->

<script>
// ============================================================
// CONFIGURATION
// ============================================================
const CONFIG = {
    DOCLIB_API:  'https://script.google.com/macros/s/AKfycbxH9YUs18W2euFxGUcIJU_zRmlDuxT-Glo5-MJfNErFzD0cL2ICm8__xBgnrNizB94/exec',
    SESSION_KEY: 'lakeIllawongVerified',
    PORTAL_URL:  'ResidentPortal.html'
};

// ============================================================
// "NEW" BADGE THRESHOLD
// Documents added within this many days receive a "New" badge.
// Adjust here — no other code changes needed.
// ============================================================
const NEW_BADGE_DAYS = 14;

// V2.6.0: a document is New from the later of its Date Added and the date its
// file was replaced (lastUpdated, backend V2.15; absent on older backends).
function isNewDoc(doc) {
    const a = doc && doc.dateAdded   ? new Date(doc.dateAdded).getTime()   : NaN;
    const u = doc && doc.lastUpdated ? new Date(doc.lastUpdated).getTime() : NaN;
    const latest = Math.max(isNaN(a) ? -Infinity : a, isNaN(u) ? -Infinity : u);
    if (latest === -Infinity) return false;
    return isNew(new Date(latest).toISOString());
}

// V2.7.0: the "Updated" date shown on each document: the later of Date Added
// and the date the file was replaced. '' when neither is a usable date.
function updatedLabel(doc) {
    const a = doc && doc.dateAdded   ? new Date(doc.dateAdded).getTime()   : NaN;
    const u = doc && doc.lastUpdated ? new Date(doc.lastUpdated).getTime() : NaN;
    const latest = Math.max(isNaN(a) ? -Infinity : a, isNaN(u) ? -Infinity : u);
    if (latest === -Infinity) return '';
    return 'Updated ' + new Date(latest).toLocaleDateString('en-AU', { day: 'numeric', month: 'short', year: 'numeric' });
}

function isNew(dateAdded) {
    if (!dateAdded) return false;
    const added     = new Date(dateAdded);
    const now       = new Date();
    const diffDays  = (now - added) / (1000 * 60 * 60 * 24);
    return diffDays <= NEW_BADGE_DAYS;
}

// ============================================================
// FREQUENTLY OPENED
// Documents flagged Featured = Y in the DocumentLibrary sheet
// are automatically included here. No code changes needed —
// manage via DocumentLibraryManager.
// ============================================================

// ============================================================
// CATEGORY ICONS
// Maps category names (as stored in sheet) to an emoji.
// Add entries here to customise icons for your categories.
// Fallback: 📁
// ============================================================
const CATEGORY_ICONS = {
    'AGM Documents':        '🏛️',
    'By-Laws & Rules':      '📜',
    'Policies & By-Laws':   '📜',
    'Maintenance Guides':   '🔧',
    'Newsletters':          '📰',
    'Minutes & Reports':    '📋',
    'Forms & Applications': '📝',
    'Emergency':            '🚨',
    'Facilities':           '🏊',
    'Financial':            '💰',
    'Social Events':        '🎉',
    'Health & Safety':      '⛑️',
    'Village Information':  '🏘️',
    'Uncategorized':        '📁',
};

// ============================================================
// STATE
// ============================================================
let allDocuments    = [];
let currentUserData = null;
let searchTimeout   = null;
let categoryTree    = [];    // V2.4.0: from getCategoryTree (best effort; empty = old flat behaviour)
// Where the person is: level 'grid' | 'subs' | 'list' | 'search'.
// list: cat / sub (sub '' = no subcategory level) or special '__ALL__' / '__FEATURED__'.
let nav             = { level: 'grid' };
let navBeforeSearch = null;

// ============================================================
// INIT
// ============================================================
document.addEventListener('DOMContentLoaded', function () {
    // Show body (was hidden to prevent flash)
    document.body.style.display = '';

    const alreadyVerified = VerificationModal.init({
        moduleName: 'Document Library',
        moduleIcon: '📚',
        sessionKey:  CONFIG.SESSION_KEY,
        onSuccess:   handleVerificationSuccess
    });

    if (!alreadyVerified) {
        VerificationModal.show();
    }
});

function handleVerificationSuccess(userData) {
    currentUserData = userData;
    document.getElementById('userName').textContent = (userData.name || '').split(' ')[0];
    document.getElementById('userUnit').textContent = userData.unit;
    document.getElementById('mainContent').style.display = 'block';
    loadDocuments();
}

// ============================================================
// DATA LOAD
// ============================================================
async function loadDocuments() {
    showLoading(true);

    // V2.4.0: the structure (order, icons, year rules). Best effort: the page
    // still works without it. Started now so it loads while the documents do.
    const treePromise = callAPI('getCategoryTree', {}, { retries: 1 })
        .then(function (t) { return (t && t.success && t.categories) ? t.categories : []; })
        .catch(function () { return []; });

    try {
        // Public documents
        const pubResp = await callAPI('getDocuments', {
            userRoles:   currentUserData.roleTags,
            accessLevel: 'PUBLIC'
        });

        const publicDocs = (pubResp.success && pubResp.documents) ? pubResp.documents : [];

        // Private documents (best-effort — don't fail page if unavailable)
        let privateDocs = [];
        try {
            const privResp = await callAPI('getDocuments', {
                userRoles:   currentUserData.roleTags,
                accessLevel: 'PRIVATE'
            }, { retries: 1 });
            if (privResp.success && privResp.documents) {
                privateDocs = privResp.documents;
            }
        } catch (e) {
            console.warn('Could not load private documents:', e);
        }

        allDocuments = [...publicDocs, ...privateDocs];
        categoryTree = await treePromise;

        showLoading(false);
        renderCategoryView();

    } catch (err) {
        console.error('loadDocuments error:', err);
        document.getElementById('loadingState').innerHTML =
            '<p style="color:rgba(255,255,255,0.9);font-size:1rem;">Failed to load documents. Please refresh the page.</p>';
    }
}

// ============================================================
// STRUCTURE HELPERS (V2.4.0)
// ============================================================
function treeCat(name) {
    return categoryTree.find(function (c) { return c.name === name; }) || null;
}
function treeSub(catName, subName) {
    const c = treeCat(catName);
    if (!c) return null;
    return c.subcategories.find(function (x) { return x.name === subName; }) || null;
}
function catOrder(name) {
    const i = categoryTree.findIndex(function (c) { return c.name === name; });
    return i === -1 ? 100000 : i;
}
function subOrder(catName, subName) {
    const c = treeCat(catName);
    if (!c) return 100000;
    const i = c.subcategories.findIndex(function (x) { return x.name === subName; });
    return i === -1 ? 100000 : i;
}
function iconFor(catName) {
    const c = treeCat(catName);
    return (c && c.icon) || CATEGORY_ICONS[catName] || '📁';
}
function docCat(d) { return (d.category || 'Uncategorized').trim(); }
function docSub(d) { return (d.subcategory || '').trim(); }
function docsInCategory(cat) {
    return allDocuments.filter(function (d) { return docCat(d) === cat; });
}
function docPath(d) {
    return docCat(d) + (docSub(d) ? ' › ' + docSub(d) : '');
}
// Year grouping rule that applies to a category / subcategory
function groupByFor(cat, sub) {
    const c = treeCat(cat);
    if (!c) return 'None';
    const x = sub ? treeSub(cat, sub) : null;
    return (x && x.groupBy) || (c.subcategories.length && !sub ? 'None' : c.groupBy) || 'None';
}
function docDateObj(v) {
    if (!v) return null;
    const d = new Date(v);
    return isNaN(d.getTime()) ? null : d;
}
function yearLabel(groupBy, v) {
    const g = (groupBy || 'None').toLowerCase();
    if (g === 'none') return '';
    const d = docDateObj(v);
    if (!d) return 'Undated';
    const y = d.getFullYear(), m = d.getMonth() + 1;
    if (g.indexOf('financial') === 0) {
        const start = m >= 7 ? y : y - 1;
        return start + '-' + String((start + 1) % 100).padStart(2, '0');
    }
    return String(y);
}

// ============================================================
// CATEGORY GRID VIEW
// ============================================================
function renderCategoryView() {
    nav = { level: 'grid' };

    showView('categoryView');

    // Build category map
    const catMap = {};
    allDocuments.forEach(doc => {
        const cat = docCat(doc);
        if (!catMap[cat]) catMap[cat] = [];
        catMap[cat].push(doc);
    });

    const grid       = document.getElementById('categoryGrid');
    // V2.4.0: structure order first (Sort order in DocCategories), then the rest A to Z
    const sortedCats = Object.keys(catMap).sort(function (a, b) {
        return (catOrder(a) - catOrder(b)) || a.localeCompare(b);
    });
    const featured   = allDocuments.filter(d => d.featured === true);

    let html = '';

    // Frequently Opened card — pinned first, only shown if any docs are flagged
    if (featured.length > 0) {
        html += `
            <div class="category-card featured-card" onclick="drillIntoCategory('__FEATURED__')">
                <div class="category-icon">★</div>
                <div class="category-name">Frequently Opened</div>
            </div>
        `;
    }

    // All Documents card — always top right (next to Frequently Opened)
    html += `
        <div class="category-card all-docs" onclick="drillIntoCategory('__ALL__')">
            <div class="category-icon">📚</div>
            <div class="category-name">All Documents</div>
        </div>
    `;

    // One card per category (V2.1.2: name carried in a data- attribute, not in the onclick string)
    sortedCats.forEach(cat => {
        const icon    = iconFor(cat);
        const hasNew  = catMap[cat].some(d => isNewDoc(d));
        html += `
            <div class="category-card" data-cat="${escAttr(cat)}" onclick="drillIntoCategory(this.dataset.cat)">
                ${hasNew ? '<span class="new-dot">New</span>' : ''}
                <div class="category-icon">${escHtml(icon)}</div>
                <div class="category-name">${escHtml(cat)}</div>
            </div>
        `;
    });

    grid.innerHTML = html;
}

function renderQuickAccess() {
    const section      = document.getElementById('quickAccessSection');
    const grid         = document.getElementById('quickAccessGrid');
    const featuredDocs = allDocuments.filter(d => d.featured === true);

    if (featuredDocs.length === 0) {
        section.classList.add('hidden');
        return;
    }

    section.classList.remove('hidden');

    grid.innerHTML = featuredDocs.map(doc => `
        <div class="quick-card" data-id="${escAttr(doc.documentId)}" onclick="openDocumentById(this.dataset.id)">
            <div class="quick-card-icon">★</div>
            <div class="quick-card-title">${escHtml(doc.title)}</div>
        </div>
    `).join('');
}

// ============================================================
// SUB-MENU VIEW (V2.4.0) — only subcategories the person can open
// ============================================================
function renderSubMenu(cat) {
    nav = { level: 'subs', cat: cat };
    showView('subView');

    const docs = docsInCategory(cat);
    const bySub = {};
    docs.forEach(function (d) {
        const k = docSub(d);
        if (!bySub[k]) bySub[k] = [];
        bySub[k].push(d);
    });
    const names = Object.keys(bySub).filter(Boolean).sort(function (a, b) {
        return (subOrder(cat, a) - subOrder(cat, b)) || a.localeCompare(b);
    });

    document.getElementById('subTitle').textContent = cat;
    document.getElementById('subCount').textContent =
        docs.length === 1 ? '1 document' : docs.length + ' documents';
    renderCrumb('subCrumb', { cat: cat, sub: null, current: 'cat' });

    const icon = iconFor(cat);
    let html = '';
    names.forEach(function (sub) {
        const hasNew = bySub[sub].some(function (d) { return isNewDoc(d); });
        html += `
            <div class="category-card" data-cat="${escAttr(cat)}" data-sub="${escAttr(sub)}" onclick="drillIntoSub(this.dataset.cat, this.dataset.sub)">
                ${hasNew ? '<span class="new-dot">New</span>' : ''}
                <div class="category-icon">${escHtml(icon)}</div>
                <div class="category-name">${escHtml(sub)}</div>
            </div>
        `;
    });
    // documents in this category that were not given a subcategory
    if (bySub['']) {
        const hasNew = bySub[''].some(function (d) { return isNewDoc(d); });
        html += `
            <div class="category-card all-docs" data-cat="${escAttr(cat)}" data-sub="" onclick="drillIntoSub(this.dataset.cat, this.dataset.sub)">
                ${hasNew ? '<span class="new-dot">New</span>' : ''}
                <div class="category-icon">${escHtml(icon)}</div>
                <div class="category-name">Other documents</div>
            </div>
        `;
    }
    document.getElementById('subGrid').innerHTML = html;
}

// ============================================================
// BREADCRUMB (V2.4.0) — parts are links; no text inside onclick strings
// ============================================================
function renderCrumb(elId, ctx) {
    const el = document.getElementById(elId);
    if (!ctx || !ctx.cat) { el.classList.add('hidden'); el.innerHTML = ''; return; }
    let html = '<button class="crumb-link" data-nav="grid">All Categories</button> › ';
    if (ctx.sub !== null && ctx.sub !== undefined && ctx.fromSubs) {
        html += '<button class="crumb-link" data-nav="cat" data-cat="' + escAttr(ctx.cat) + '">' + escHtml(ctx.cat) + '</button> › ' +
                '<span>' + escHtml(ctx.sub || 'Other documents') + '</span>';
    } else {
        html += '<span>' + escHtml(ctx.cat) + '</span>';
    }
    el.innerHTML = html;
    el.classList.remove('hidden');
}

['subCrumb', 'drillCrumb'].forEach(function (id) {
    document.getElementById(id).addEventListener('click', function (ev) {
        const btn = ev.target.closest ? ev.target.closest('button[data-nav]') : null;
        if (!btn) return;
        if (btn.dataset.nav === 'grid') backToCategories();
        else if (btn.dataset.nav === 'cat') drillIntoCategory(btn.dataset.cat);
    });
});

// ============================================================
// DRILL-DOWN VIEW
// ============================================================
function clearSearchBox() {
    document.getElementById('searchInput').value = '';
    document.getElementById('searchClear').style.display = 'none';
}

function drillIntoCategory(category) {
    // Clear search when drilling by category
    clearSearchBox();

    if (category === '__ALL__') {
        nav = { level: 'list', special: '__ALL__' };
        renderDrillView([...allDocuments], 'All Documents', false, null);
    } else if (category === '__FEATURED__') {
        nav = { level: 'list', special: '__FEATURED__' };
        renderDrillView(allDocuments.filter(d => d.featured === true), 'Frequently Opened', false, null);
    } else {
        const docs = docsInCategory(category);
        if (docs.some(function (d) { return docSub(d); })) {
            renderSubMenu(category);
        } else {
            nav = { level: 'list', cat: category, sub: '', fromSubs: false };
            renderDrillView(docs, category, false, { cat: category, sub: null, fromSubs: false });
        }
    }
}

function drillIntoSub(cat, sub) {
    clearSearchBox();
    nav = { level: 'list', cat: cat, sub: sub, fromSubs: true };
    const docs = docsInCategory(cat).filter(function (d) { return docSub(d) === sub; });
    renderDrillView(docs, sub || 'Other documents', false, { cat: cat, sub: sub, fromSubs: true });
}

function backToCategories() {
    // Clear search
    clearSearchBox();
    document.getElementById('searchResultsLabel').classList.add('hidden');

    renderCategoryView();
}

// Back button on the document list: up one level
function goBackOne() {
    if (nav.level === 'list' && nav.fromSubs) {
        drillIntoCategory(nav.cat);
    } else {
        backToCategories();
    }
}

// Puts the person back where they were (after a search is cleared)
function restoreNav(saved) {
    if (!saved || saved.level === 'grid') { renderCategoryView(); return; }
    if (saved.level === 'subs') { drillIntoCategory(saved.cat); return; }
    if (saved.level === 'list') {
        if (saved.special) { drillIntoCategory(saved.special); return; }
        if (saved.fromSubs) { drillIntoSub(saved.cat, saved.sub); return; }
        drillIntoCategory(saved.cat);
        return;
    }
    renderCategoryView();
}

function docRowHTML(doc, typeIcons) {
    return `
        <div class="doc-row" data-id="${escAttr(doc.documentId)}" onclick="openDocumentById(this.dataset.id)">
            <div>
                <div class="doc-row-title">
                    ${escHtml(doc.title)}
                    ${isNewDoc(doc) ? '<span class="new-pill">New</span>' : ''}
                </div>
                ${doc.description ? `<div class="doc-row-desc">${escHtml(doc.description)}</div>` : ''}
                ${updatedLabel(doc) ? `<div class="doc-row-updated">${escHtml(updatedLabel(doc))}</div>` : ''}
            </div>
            <div class="doc-row-category">${escHtml(docPath(doc))}</div>
            <div class="doc-row-type">${typeIcons[doc.sourceType] || '📄'}</div>
            <div class="doc-row-download">${canDownload(doc) ? `<button class="btn-download" data-id="${escAttr(doc.documentId)}" onclick="event.stopPropagation(); downloadDocumentById(this.dataset.id)">⬇ Download</button>` : ''}</div>
        </div>
    `;
}

function mobileItemHTML(doc, typeIcons) {
    return `
        <div class="mobile-doc-item" data-id="${escAttr(doc.documentId)}" onclick="openDocumentById(this.dataset.id)">
            <div class="mobile-doc-item-title">
                ${escHtml(doc.title)}
                ${isNewDoc(doc) ? '<span class="new-pill">New</span>' : ''}
            </div>
            ${doc.description ? `<div class="mobile-doc-item-desc">${escHtml(doc.description)}</div>` : ''}
            ${updatedLabel(doc) ? `<div class="doc-row-updated">${escHtml(updatedLabel(doc))}</div>` : ''}
            <div class="mobile-doc-item-meta">
                <span>${escHtml(docPath(doc))}</span>
                <span>${typeIcons[doc.sourceType] || '📄'}</span>
                ${canDownload(doc) ? `<button class="btn-download" data-id="${escAttr(doc.documentId)}" onclick="event.stopPropagation(); downloadDocumentById(this.dataset.id)">⬇ Download</button>` : ''}
            </div>
        </div>
    `;
}

// ctx: { cat, sub, fromSubs } for a category / subcategory list (drives the
// year headings, back button and breadcrumb); null for All / Frequently Opened / search.
function renderDrillView(docs, title, isSearch, ctx) {
    showView('drillView');

    document.getElementById('drillTitle').textContent = title;
    document.getElementById('drillCount').textContent =
        docs.length === 0 ? 'No documents' :
        docs.length === 1 ? '1 document' :
        docs.length + ' documents';

    // Back button and breadcrumb
    const back = document.getElementById('drillBackBtn');
    back.textContent = (ctx && ctx.fromSubs) ? '← ' + ctx.cat : '← All Categories';
    renderCrumb('drillCrumb', ctx);

    const searchLabel = document.getElementById('searchResultsLabel');
    if (isSearch) {
        searchLabel.classList.remove('hidden');
        searchLabel.innerHTML = 'Showing results across all categories for <strong>' + escHtml(title) + '</strong>';
    } else {
        searchLabel.classList.add('hidden');
    }

    if (docs.length === 0) {
        document.getElementById('docListContainer').classList.add('hidden');
        document.getElementById('mobileDocList').innerHTML = '';
        document.getElementById('drillEmpty').classList.remove('hidden');
        return;
    }

    document.getElementById('drillEmpty').classList.add('hidden');
    document.getElementById('docListContainer').classList.remove('hidden');

    const typeIcons = { 'Drive': '📄', 'Link': '🔗', 'Physical': '📦' };

    // Year headings (category / subcategory lists whose rule is not None)
    const groupBy = ctx ? groupByFor(ctx.cat, ctx.sub) : 'None';
    let ordered = docs;
    if ((groupBy || 'None').toLowerCase() !== 'none') {
        // newest Document Date first, undated last; ties keep the existing order
        ordered = docs.map(function (d, i) { return { d: d, i: i }; }).sort(function (a, b) {
            const da = docDateObj(a.d.documentDate), db = docDateObj(b.d.documentDate);
            if (da && db) return (db - da) || (a.i - b.i);
            if (da) return -1;
            if (db) return 1;
            return a.i - b.i;
        }).map(function (x) { return x.d; });
    }

    let listHTML = '', mobileHTML = '', lastYear = null;
    ordered.forEach(function (doc) {
        const yr = yearLabel(groupBy, doc.documentDate);
        if (yr && yr !== lastYear) {
            listHTML   += '<div class="year-heading">' + escHtml(yr) + '</div>';
            mobileHTML += '<div class="mobile-year-heading">' + escHtml(yr) + '</div>';
        }
        lastYear = yr;
        listHTML   += docRowHTML(doc, typeIcons);
        mobileHTML += mobileItemHTML(doc, typeIcons);
    });
    document.getElementById('docListBody').innerHTML = listHTML;
    document.getElementById('mobileDocList').innerHTML = mobileHTML;
}

// ============================================================
// SEARCH — always across all documents
// ============================================================
function handleSearch(value) {
    const q = value.trim().toLowerCase();

    // Toggle clear button
    document.getElementById('searchClear').style.display = q ? 'block' : 'none';

    clearTimeout(searchTimeout);

    if (!q) {
        // Return to wherever the user was
        const saved = navBeforeSearch;
        navBeforeSearch = null;
        restoreNav(saved);
        return;
    }

    searchTimeout = setTimeout(function () {
        const results = allDocuments.filter(doc => {
            const haystack = [
                doc.title,
                doc.category,
                doc.subcategory,
                doc.description,
                doc.tags
            ].join(' ').toLowerCase();
            return haystack.includes(q);
        });

        if (nav.level !== 'search') navBeforeSearch = nav;
        nav = { level: 'search' };
        renderDrillView(results, value.trim(), true, null);
    }, 250);
}

function clearSearch() {
    document.getElementById('searchInput').value = '';
    document.getElementById('searchClear').style.display = 'none';
    handleSearch('');
}

// ============================================================
// OPEN DOCUMENT
// ============================================================
// V2.1.2: rows pass only the document ID; the record is looked up here so
// no title / location text ever has to survive inside an onclick string.
function openDocumentById(documentId) {
    const doc = allDocuments.find(d => d.documentId === documentId);
    if (!doc) {
        alert('Unable to open this document. Please contact management.');
        return;
    }
    openDocument(doc.documentId, doc.sourceType, doc.sourceLocation || '', doc.title);
}

// ============================================================
// DOWNLOAD (V2.3.0) -- uploaded (Drive) documents only
// ============================================================
function driveFileIdOf(sourceLink) {
    if (!sourceLink) return '';
    if (!/^https?:/i.test(sourceLink)) return sourceLink;
    const m = /\/d\/([A-Za-z0-9_-]+)/.exec(sourceLink) || /[?&]id=([A-Za-z0-9_-]+)/.exec(sourceLink);
    return m ? m[1] : '';
}

function canDownload(doc) {
    return doc.sourceType === 'Drive' && !!driveFileIdOf(doc.sourceLocation || '');
}

function downloadDocumentById(documentId) {
    const doc = allDocuments.find(d => d.documentId === documentId);
    const id  = doc ? driveFileIdOf(doc.sourceLocation || '') : '';
    if (!doc || doc.sourceType !== 'Drive' || !id) {
        alert('Unable to download this document. Please contact management.');
        return;
    }
    const a = document.createElement('a');
    a.href = 'https://drive.google.com/uc?export=download&id=' + encodeURIComponent(id);
    a.rel  = 'noopener';
    a.style.display = 'none';
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
}

function openDocument(documentId, sourceType, sourceLink, title) {
    if (sourceType === 'Drive' && sourceLink) {
        const url = sourceLink.startsWith('http')
            ? sourceLink
            : 'https://drive.google.com/file/d/' + sourceLink + '/view';
        window.open(url, '_blank');
    } else if (sourceType === 'Link' && sourceLink) {
        window.open(sourceLink, '_blank');
    } else if (sourceType === 'Physical') {
        alert('📦 Physical Document\n\n"' + title + '"\n\nThis is a physical document stored at the management office. Please contact management for access.');
    } else {
        alert('Unable to open this document. Please contact management.');
    }
}

// ============================================================
// NAVIGATION & AUTH
// ============================================================
function goBackToPortal() {
    // Respect ?portal= parameter for correct back-button routing
    const params = new URLSearchParams(window.location.search);
    const portal = params.get('portal');
    if (portal) {
        window.location.href = portal;
    } else {
        window.location.href = CONFIG.PORTAL_URL;
    }
}

function logout() {
    if (confirm('Are you sure you want to log out?')) {
        VerificationModal.clearVerification();
        location.reload();
    }
}

// ============================================================
// VIEW SWITCHER
// ============================================================
function showLoading(show) {
    document.getElementById('loadingState').style.display = show ? 'block' : 'none';
    document.getElementById('categoryView').classList.add('hidden');
    document.getElementById('subView').classList.add('hidden');
    document.getElementById('drillView').classList.add('hidden');
}

function showView(viewId) {
    document.getElementById('loadingState').style.display = 'none';
    document.getElementById('categoryView').classList.toggle('hidden', viewId !== 'categoryView');
    document.getElementById('subView').classList.toggle('hidden', viewId !== 'subView');
    document.getElementById('drillView').classList.toggle('hidden', viewId !== 'drillView');
}

// ============================================================
// JSONP API HELPER
// ============================================================
// V2.1.0: thin wrapper over the shared ApiClient (see header). Every call
// on this page is a read, so all are retried; `opts.retries` lets the
// best-effort private-documents call use fewer. Rejects with an Error
// exactly as the old hand-rolled version did.
async function callAPI(action, params, opts) {
    try {
        return await ApiClient.call(CONFIG.DOCLIB_API, action, { data: JSON.stringify(params) }, {
            write: false,
            retries: opts && typeof opts.retries === 'number' ? opts.retries : undefined,
            onRetry: function (info) {
                const el = document.getElementById('loadingText');
                if (el) el.textContent = 'Connection slow, retrying... (' + (info.attempt + 1) + '/' + info.maxAttempts + ')';
            }
        });
    } catch (err) {
        throw new Error(err.reason === 'timeout' ? 'Request timeout' : 'Network request failed');
    }
}

// ============================================================
// UTILITY
// ============================================================
function escHtml(text) {
    if (!text) return '';
    const d = document.createElement('div');
    d.textContent = String(text);
    return d.innerHTML;
}

// V2.1.2: for values placed inside a double-quoted HTML attribute (data-*).
// escHtml() leaves quotes alone, which is fine for element text but not here.
function escAttr(text) {
    if (text === null || text === undefined) return '';
    return String(text)
        .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;').replace(/'/g, '&#39;');
}
