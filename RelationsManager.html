<body>
<div class="container">

    <!-- Header - system standard -->
    <div class="header">
        <div class="header-content">
            <div class="logo-container">
                <img src="logo.png" alt="Lake Illawong Logo" class="logo-image">
            </div>
            <div class="header-text">
                <h1 class="header-title">Relations Manager</h1>
                <p class="header-subtitle">Lake Illawong Retirement Village — Admin</p>
            </div>
        </div>
        <div class="header-divider"></div>
    </div>

    <!-- Back button -->
    <button class="portal-back-btn" onclick="window.location.href='AdminPortal.html'">
        &#8592; Back to Admin Portal
    </button>

    <!-- Access denied view -->
    <div id="deniedView" class="denied-box hidden">
        <h2>&#128683; Access Denied</h2>
        <p>You do not have permission to access Relations Manager.</p>
        <p>Signed in as: <strong id="deniedName"></strong></p>
        <p>Role: <strong id="deniedRoles"></strong></p>
        <button class="btn-reverify" onclick="reVerify()">Try Again</button>
    </div>

    <!-- Main content (hidden until auth) -->
    <div id="mainContent" class="hidden">

        <!-- Summary strip -->
        <div class="summary-strip" id="summaryStrip" style="display:none">
            <div class="summary-tile"><div class="tile-count" id="countOpen">—</div><div class="tile-label">Open</div></div>
            <div class="summary-tile"><div class="tile-count" id="countAcknowledged">—</div><div class="tile-label">Acknowledged</div></div>
            <div class="summary-tile"><div class="tile-count" id="countUnderReview">—</div><div class="tile-label">Under Review</div></div>
            <div class="summary-tile"><div class="tile-count" id="countResolved">—</div><div class="tile-label">Resolved</div></div>
            <div class="summary-tile"><div class="tile-count" id="countUnresolved">—</div><div class="tile-label">Unresolved</div></div>
            <div class="summary-tile"><div class="tile-count overdue" id="countOverdue">—</div><div class="tile-label">Overdue</div></div>
        </div>

        <!-- Filter bar -->
        <div class="filter-bar">
            <input type="text" id="filterSearch" placeholder="&#128269; Search name or unit&hellip;" oninput="applyFilters()" style="margin-right:10px;">
            <label for="filterStatus">Status:</label>
            <select id="filterStatus" onchange="applyFilters()">
                <option value="">All</option>
                <option value="Open">Open</option>
                <option value="Acknowledged">Acknowledged</option>
                <option value="Under Review">Under Review</option>
                <option value="Closed - Resolved">Closed - Resolved</option>
                <option value="Closed - Unresolved">Closed - Unresolved</option>
            </select>
            <label for="filterMatterType">Type:</label>
            <select id="filterMatterType" onchange="applyFilters()">
                <option value="">All</option>
                <option value="Management">Resident-to-Management</option>
                <option value="Resident">Resident-to-Resident</option>
                <option value="">Untriaged</option>
            </select>
            <label for="filterOverdue">Show:</label>
            <select id="filterOverdue" onchange="applyFilters()">
                <option value="">All disputes</option>
                <option value="overdue">Overdue only</option>
            </select>
            <button class="btn-refresh" onclick="loadRelations()">&#8635; Refresh</button>
            <button class="btn-print" onclick="printRelationsRegister()">&#128438; Print Register</button>
            <a class="btn-log-dispute" href="RelationsForm.html">+ Log Dispute</a>
        </div>

        <!-- Relations list -->
        <div id="relationsList">
            <div class="loading-state">
                <div class="spinner"></div>
                <div class="state-text">Loading disputes...</div>
            </div>
        </div>

    </div><!-- end mainContent -->
</div><!-- end container -->

<script>
    const CONFIG = {
        BACKEND_URL:   'https://script.google.com/macros/s/AKfycbyTuaQ90JhsVxgzD7olxO_MicP5JNlcTiQk2gQd7cwi0prHSBtx8TVl2GZQTTFT7jVN-A/exec',
        MGMT_URL:      'https://script.google.com/macros/s/AKfycbzVF25ss7kEmhE42Sf-i_vpLIL1FpTe2AjNeb0b8MqP_eBXAxV9ghWcuwe25hdEuqBFjw/exec',
        SESSION_KEY:   'portalAdminVerified',
        PORTAL_URL:    'AdminPortal.html',
        ALLOWED_ROLES: ['Relations-Manager', 'Developer'],
        REVIEW_DAYS:   28,
        EARLY_RESOLUTION_HOURS: 72,
        TRIAGE_REMINDER_HOURS:  24
    };

    let allRelations = [];
    let allResidents = [];  // for the Party B lookup at triage -- loaded once after auth

    // Tracks the Status Review decision (Resolved / Not Resolved) per
    // dispute reference, local to this page load only -- same session-
    // state-only pattern DisputesManager used (disputePathChoice).
    let relationsPathChoice = {};

    // Tracks the Under Review closure choice (Resolve & Close / Close as
    // Unresolved) per dispute reference, same choice-then-reveal pattern
    // as relationsPathChoice above -- applied here too so both textareas
    // aren't shown simultaneously.
    let underReviewChoice = {};

    // Tracks the in-progress Triage selection (Management / Resident)
    // per dispute reference, local only, cleared once triage submits.
    let triagePathChoice = {};

    // Tracks the selected Party B resident (name/unit/email/mobile,
    // normalised) per dispute reference, once chosen from the triage
    // lookup. Required -- triage cannot submit for a Resident-to-
    // Resident dispute without a genuine selection here.
    let triagePartyBSelected = {};

    // ── AUTH ──────────────────────────────────────────────────────────────

    document.addEventListener('DOMContentLoaded', function () {
        const alreadyVerified = VerificationModal.init({
            moduleName: 'Relations Manager',
            moduleIcon: '🤝',
            sessionKey: CONFIG.SESSION_KEY,
            onSuccess:  handleVerificationSuccess
        });
        if (!alreadyVerified) { VerificationModal.show(); }
    });

    function handleVerificationSuccess(userData) {
        window._sessionUser = userData;
        const roles = userData.roleTags || [];
        const hasAccess = CONFIG.ALLOWED_ROLES.some(function(r) { return roles.includes(r); });
        if (!hasAccess) {
            document.getElementById('deniedName').textContent  = userData.name || 'Unknown';
            document.getElementById('deniedRoles').textContent = roles.join(', ') || 'None';
            document.getElementById('deniedView').classList.remove('hidden');
            return;
        }
        document.getElementById('mainContent').classList.remove('hidden');
        loadRelationsCategories();
        loadRelations();
        loadResidentList();
    }

    function reVerify() {
        document.getElementById('deniedView').classList.add('hidden');
        VerificationModal.clearVerification();
        VerificationModal.show();
    }

    // ── JSONP HELPER ──────────────────────────────────────────────────────

    function jsonp(params, onSuccess, onError, timeoutMs) {
        const callbackName = 'rm_cb_' + Date.now() + '_' + Math.random().toString(36).slice(2);
        const qs = Object.keys(params).map(function(k) {
            return encodeURIComponent(k) + '=' + encodeURIComponent(params[k]);
        }).join('&');
        const url = CONFIG.BACKEND_URL + '?' + qs + '&callback=' + callbackName;

        let settled = false;
        const s = document.createElement('script');

        function cleanup() {
            window[callbackName] = function () {};
            try { document.head.removeChild(s); } catch (e) {}
        }

        const timer = setTimeout(function () {
            if (settled) return;
            settled = true;
            cleanup();
            if (onError) onError('Server did not respond. Please try again.');
        }, timeoutMs || 30000);

        window[callbackName] = function (data) {
            if (settled) return;
            settled = true;
            clearTimeout(timer); cleanup();
            if (onSuccess) onSuccess(data);
        };

        s.onerror = function () {
            if (settled) return;
            settled = true;
            clearTimeout(timer); cleanup();
            if (onError) onError('Could not reach the server.');
        };
        s.src = url;
        document.head.appendChild(s);
    }

    // ── LOAD RELATIONS ────────────────────────────────────────────────────

    function loadRelations() {
        const list = document.getElementById('relationsList');
        list.innerHTML = '<div class="loading-state"><div class="spinner"></div><div class="state-text">Loading disputes...</div></div>';
        document.getElementById('summaryStrip').style.display = 'none';

        jsonp({ action: 'getRelations' }, function(data) {
            if (!data.success) { showPageError(data.error || 'Failed to load disputes.'); return; }
            allRelations = data.relations || [];
            updateSummary(allRelations);
            document.getElementById('summaryStrip').style.display = 'flex';
            applyFilters();
        }, function(err) {
            showPageError(err);
        });
    }

    function showPageError(msg) {
        document.getElementById('relationsList').innerHTML =
            '<div class="error-state"><div class="state-icon">&#9888;</div><div class="state-text">' + escHtml(msg) + '</div></div>';
    }

    // ── SUMMARY STRIP ─────────────────────────────────────────────────────

    function updateSummary(relations) {
        var counts = { Open: 0, Acknowledged: 0, UnderReview: 0, Resolved: 0, Unresolved: 0, overdue: 0 };
        relations.forEach(function(r) {
            if (r.status === 'Open')                   counts.Open++;
            if (r.status === 'Acknowledged')           counts.Acknowledged++;
            if (r.status === 'Under Review')           counts.UnderReview++;
            if (r.status === 'Closed - Resolved')      counts.Resolved++;
            if (r.status === 'Closed - Unresolved')    counts.Unresolved++;
            if (isOverdue(r))                          counts.overdue++;
        });
        document.getElementById('countOpen').textContent         = counts.Open;
        document.getElementById('countAcknowledged').textContent = counts.Acknowledged;
        document.getElementById('countUnderReview').textContent  = counts.UnderReview;
        document.getElementById('countResolved').textContent     = counts.Resolved;
        document.getElementById('countUnresolved').textContent   = counts.Unresolved;
        document.getElementById('countOverdue').textContent      = counts.overdue;
    }

    // ── FILTER ────────────────────────────────────────────────────────────

    function applyFilters() {
        const statusF  = document.getElementById('filterStatus').value;
        const typeF    = document.getElementById('filterMatterType').value;
        const overdueF = document.getElementById('filterOverdue').value;
        const searchF  = (document.getElementById('filterSearch').value || '').trim().toLowerCase();
        // 'Untriaged' option shares value '' with 'All' in the markup above
        // -- distinguish by selectedIndex instead of value.
        const typeSel  = document.getElementById('filterMatterType');
        const untriagedOnly = typeSel.selectedIndex === 3;

        const filtered = allRelations.filter(function(r) {
            if (statusF && r.status !== statusF) return false;
            if (untriagedOnly) { if (r.matterType) return false; }
            else if (typeF && r.matterType !== typeF) return false;
            if (overdueF === 'overdue' && !isOverdue(r)) return false;
            if (searchF) {
                var partyA = (r.partyAName || '').toLowerCase();
                var partyB = (r.partyBName || '').toLowerCase();
                var unitA  = (r.partyAUnit || '').toLowerCase();
                var unitB  = (r.partyBUnit || '').toLowerCase();
                if (partyA.indexOf(searchF) === -1 && partyB.indexOf(searchF) === -1 &&
                    unitA.indexOf(searchF)  === -1 && unitB.indexOf(searchF)  === -1) return false;
            }
            return true;
        });

        renderList(filtered);
    }

    // ── OVERDUE (three-tier) ─────────────────────────────────────────────
    // Returns null if not overdue on any tier, else 'triage'|'process'|'review'.
    function overdueTier(r) {
        const TERMINAL = ['Closed - Resolved', 'Closed - Unresolved'];
        if (TERMINAL.indexOf(r.status) !== -1) return null;
        const now = new Date();

        if (r.status === 'Open') {
            if (!r.loggedAt) return null;
            const deadline = new Date(new Date(r.loggedAt).getTime() + CONFIG.TRIAGE_REMINDER_HOURS * 3600000);
            return now > deadline ? 'triage' : null;
        }
        if (r.status === 'Acknowledged' && !r.processStatementAt) {
            if (!r.loggedAt) return null;
            const deadline = new Date(new Date(r.loggedAt).getTime() + CONFIG.EARLY_RESOLUTION_HOURS * 3600000);
            if (now > deadline) return 'process';
        }
        if (r.reviewDue && now > new Date(r.reviewDue)) return 'review';
        return null;
    }

    function isOverdue(r) { return overdueTier(r) !== null; }

    // ── RENDER LIST ───────────────────────────────────────────────────────

    function renderList(relations) {
        const list = document.getElementById('relationsList');
        if (relations.length === 0) {
            list.innerHTML = '<div class="empty-state"><div class="state-icon">&#129309;</div><div class="state-text">No disputes found.</div></div>';
            return;
        }
        list.innerHTML = relations.map(function(r) { return buildCard(r); }).join('');
    }

    function matterTypeLabel(r) {
        if (r.matterType === 'Management') return 'Resident-to-Management';
        if (r.matterType === 'Resident')   return 'Resident-to-Resident';
        return 'Untriaged';
    }
    function matterTypeClass(r) {
        if (r.matterType === 'Management') return 'mt-management';
        if (r.matterType === 'Resident')   return 'mt-resident';
        return 'mt-untriaged';
    }
    // Party label: 'Party A'/'Party B' for Resident-to-Resident disputes
    // (neither party is more "the resident" than the other -- neutral,
    // symmetric labels are correct there). 'Resident' for Management
    // disputes, where there's only one party and no ambiguity at all.
    // Untriaged (matterType blank) defaults to 'Resident' -- the safer
    // generic term until triage confirms which framing applies.
    function partyALabel(r) { return r.matterType === 'Resident' ? 'Party A' : 'Resident'; }

    function buildCard(r) {
        const ref      = r.referenceNumber;
        const tier     = overdueTier(r);
        const statusCls = tier ? 'overdue-' + tier : statusCardClass(r.status);
        const pillCls   = statusPillClass(r.status);
        const loggedStr = r.loggedAt ? fmtDate(new Date(r.loggedAt)) : '—';
        const dueStr    = r.reviewDue ? fmtDate(new Date(r.reviewDue)) : '—';

        const partyLabel = [r.partyAName, r.partyAUnit ? '(' + r.partyAUnit + ')' : ''].filter(Boolean).join(' ') +
            (r.partyBName ? ' &mdash; ' + r.partyBName + (r.partyBUnit ? ' (' + r.partyBUnit + ')' : '') : '');

        return '<div class="relations-card ' + statusCls + '" id="card-' + escHtml(ref) + '">' +
            '<div class="card-summary" onclick="toggleCard(\'' + escHtml(ref) + '\')">' +
                '<div class="card-ref">' + escHtml(ref) + '</div>' +
                '<div class="card-parties">' + partyLabel + '</div>' +
                '<span class="card-dispute-type ' + matterTypeClass(r) + '">' + matterTypeLabel(r) + '</span>' +
                (tier ? '<span class="overdue-badge">&#9888; Overdue</span>' : '') +
                '<span class="status-pill ' + pillCls + '">' + escHtml(r.status) + '</span>' +
                '<div class="card-dates">Logged ' + loggedStr + ' &bull; Due ' + dueStr + '</div>' +
                '<div class="card-chevron">&#9660;</div>' +
            '</div>' +
            '<div class="card-detail" id="detail-' + escHtml(ref) + '">' +
                buildCardDetail(r) +
            '</div>' +
        '</div>';
    }

    function buildCardDetail(r) {
        const ref = r.referenceNumber;
        const isResident = r.matterType === 'Resident';
        var html = '';

        // ── NOTIFICATIONS PENDING BANNER (Open, pre-triage) ──
        if (r.status === 'Open') {
            html += '<div class="notify-pending-banner">' +
                '<div class="notify-pending-icon">&#9432;</div>' +
                '<div class="notify-pending-text">' +
                '<strong>Awaiting triage</strong> — the Board alert has already been sent for this dispute. ' +
                'No resident/party-facing notification fires until this dispute is triaged below.' +
                '</div>' +
            '</div>';
        }

        // ── PARTY BLOCKS ──
        html += '<div class="detail-section-title">Parties</div>';
        html += '<div class="party-block">' +
            '<div class="detail-label">' + escHtml(partyALabel(r)) + '</div>' +
            '<div class="detail-value">' + escHtml(r.partyAName || '—') + (r.partyAUnit ? ' &bull; ' + escHtml(r.partyAUnit) : '') + '</div>' +
            (r.partyAEmail ? '<div class="detail-value" style="font-size:0.82rem;color:rgba(255,255,255,0.6)">' + escHtml(r.partyAEmail) + (r.partyAMobile ? ' &bull; ' + escHtml(r.partyAMobile) : '') + '</div>' : '') +
        '</div>';

        if (isResident && r.partyBName) {
            html += '<div class="party-block">' +
                '<div class="detail-label">Party B</div>' +
                '<div class="detail-value">' + escHtml(r.partyBName) + (r.partyBUnit ? ' &bull; ' + escHtml(r.partyBUnit) : '') + '</div>' +
                (r.partyBEmail ? '<div class="detail-value" style="font-size:0.82rem;color:rgba(255,255,255,0.6)">' + escHtml(r.partyBEmail) + (r.partyBMobile ? ' &bull; ' + escHtml(r.partyBMobile) : '') + '</div>' : '') +
            '</div>';
        }

        // ── DETAILS GRID ──
        html += '<div class="detail-grid">';
        html += detailField('Logged', r.loggedAt ? fmtDateLong(new Date(r.loggedAt)) : '—');
        html += detailField('Logged By', r.loggedBy || '—');
        html += detailField('Dispute Type', matterTypeLabel(r));
        if (r.triagedAt) html += detailField('Triaged', fmtDateLong(new Date(r.triagedAt)) + ' by ' + (r.triagedBy || '—'));
        html += detailField('Review Due', r.reviewDue ? fmtDateLong(new Date(r.reviewDue)) : '—');
        html += detailField('Status', r.status || '—');
        html += detailField('Category', r.category || '—');
        html += detailField('Submission Method', r.submissionMethod || '—');
        if (r.incidentDateTime) html += detailField('Incident Date/Time', fmtDateLong(new Date(r.incidentDateTime)));
        // Complaints-sourced fields -- always shown when present, regardless
        // of dispute type (per Build Log: Description and the other new
        // fields display alongside Issue Detail, not instead of it).
        if (r.description)      html += detailField('Description (raw, internal only)', r.description, true);
        if (r.desiredOutcome)   html += detailField('Desired Outcome', r.desiredOutcome, true);
        if (r.previousActions)  html += detailField('Previous Actions', r.previousActions, true);
        if (r.location)         html += detailField('Location', r.location, true);
        if (r.peopleInvolved)   html += detailField('People Involved (informal)', r.peopleInvolved, true);
        // Issue Detail -- Resident-to-Resident only, populated at triage.
        if (isResident && r.issueDetail) html += detailField('Issue Detail (sent to both parties)', r.issueDetail, true);
        html += '</div>';

        // ── ACTION PANEL (Next Step -- first) ──
        html += buildActionPanel(r);

        // ── ACCORDION PANES (case record) ──
        html += buildAccordion(r);

        // ── FILTERED EVENT PANES (from Events tab) ──
        html += buildFilteredPane(r, 'all',    'All Events', 'All board-recorded events');
        html += buildFilteredPane(r, 'partyA', partyALabel(r) + ' Events',  'Includes events tagged ' + partyALabel(r));
        if (isResident) html += buildFilteredPane(r, 'partyB', 'Party B Events', 'Includes events tagged Party B');
        html += buildFilteredPane(r, 'board',  'Board Notes',     'Visibility: Board or All');

        // ── SYSTEM EVENTS (read-only, auto-generated) ──
        html += buildActivityLogPane(r);

        // ── ADD EVENT BUTTON ──
        html += '<div style="margin-top:12px;text-align:right;">' +
            '<button class="btn-save" onclick="openEventEntry(\'' + escHtml(ref) + '\')">+ Add Event</button>' +
        '</div>';

        return html;
    }

    function buildAccordion(r) {
        const ref = r.referenceNumber;
        var html  = '';

        if (r.processStatement) {
            html += accordionPane('pane-ps-' + ref, 'Process Statement',
                r.processStatementAt ? fmtDate(new Date(r.processStatementAt)) : '',
                '<div class="pane-text">' + escHtml(r.processStatement) + '</div>', false);
        }
        if (r.resolutionSummary) {
            html += accordionPane('pane-res-' + ref, 'Resolution Summary',
                r.resolvedAt ? fmtDate(new Date(r.resolvedAt)) : '',
                '<div class="pane-text">' + escHtml(r.resolutionSummary) + (r.earlyResolution ? '<br><br><em>Flagged as Early Resolution.</em>' : '') + '</div>', true);
        }
        if (r.closureNotes) {
            html += accordionPane('pane-cn-' + ref, 'Closure Notes',
                r.closedAt ? fmtDate(new Date(r.closedAt)) : '',
                '<div class="pane-text">' + escHtml(r.closureNotes) + '</div>', true);
        }

        return html;
    }

    function buildActivityLogPane(r) {
        const ref = r.referenceNumber;
        // activityLog is stripped from the bulk list response (see
        // backend V1.0.5) and lazy-loaded on first card expand (see
        // toggleCard()) -- show a loading placeholder rather than
        // falsely claiming "no events" before that fetch completes.
        if (!r._activityLoaded) {
            return accordionPane('pane-sysevents-' + ref, 'System Events', 'Auto-generated only',
                '<div class="pane-text" style="color:rgba(255,255,255,0.4);">Loading&hellip;</div>', false);
        }
        const logEntries = r.activityLog
            ? r.activityLog.split('\n\n').map(function(e) { return e.trim(); }).filter(Boolean).reverse()
            : [];
        const logHtml = logEntries.length
            ? renderLogEntries(logEntries)
            : '<div class="pane-text" style="color:rgba(255,255,255,0.4);">No system events recorded.</div>';
        return accordionPane('pane-sysevents-' + ref, 'System Events', 'Auto-generated only', logHtml, false);
    }

    function buildFilteredPane(r, filter, title, subtitle) {
        const ref     = r.referenceNumber;
        const paneId  = 'pane-' + filter + '-' + ref;
        const entryId = 'events-' + filter + '-' + ref;
        const isOpen  = filter === 'all';
        return '<div class="accordion-pane' + (isOpen ? ' open' : '') + '" id="' + paneId + '" style="margin-bottom:12px;">' +
            '<div class="accordion-pane-header" onclick="togglePane(\'' + paneId + '\')">' +
                '<span class="pane-title">' + escHtml(title) + '</span>' +
                '<span class="pane-date">' + escHtml(subtitle) + '</span>' +
                '<span class="accordion-chevron">&#9660;</span>' +
            '</div>' +
            '<div class="accordion-body">' +
                '<div id="' + entryId + '" class="pane-text" style="color:rgba(255,255,255,0.4);">Loading\u2026</div>' +
            '</div>' +
        '</div>';
    }

    function accordionPane(id, title, dateStr, bodyHtml, openByDefault) {
        return '<div class="accordion-pane' + (openByDefault ? ' open' : '') + '" id="' + id + '">' +
            '<div class="accordion-pane-header" onclick="togglePane(\'' + id + '\')">' +
                '<span class="pane-title">' + escHtml(title) + '</span>' +
                (dateStr ? '<span class="pane-date">' + escHtml(dateStr) + '</span>' : '') +
                '<span class="accordion-chevron">&#9660;</span>' +
            '</div>' +
            '<div class="accordion-body">' + bodyHtml + '</div>' +
        '</div>';
    }

    // ── ACTION PANEL ──────────────────────────────────────────────────────

    function buildCloseUnresolvedSection(r) {
        const ref = r.referenceNumber;
        return '<div class="action-title" style="color:#fed7aa;">&#9888; Close as Unresolved</div>' +
            '<div class="action-note" style="margin-bottom:8px;">Use this if the Board has not been able to resolve the dispute internally. All parties will automatically be sent the standard advice on their options, with VicAssist suggested as a first step -- a suggestion, not a direction -- and the Board\'s offer to help with that application.</div>' +
            '<div class="action-row"><div class="action-field">' +
                '<label>Closure Notes <span style="color:rgba(255,255,255,0.4);font-weight:400;">(optional)</span></label>' +
                '<textarea id="closeun-' + ref + '" placeholder="Any context on what was tried and why it couldn\'t be resolved internally, including a withdrawal reason if applicable. Included in the closure notice sent to all parties.">' + escHtml(r.closureNotes || '') + '</textarea>' +
            '</div></div>' +
            '<div class="action-note" style="margin-bottom:8px;"><i>Use <strong>Save Draft</strong> to save your notes without notifying parties. When ready, click <strong>Close as Unresolved &amp; Notify</strong> to finalise.</i></div>' +
            '<button class="btn-save" onclick="saveRelationsDraft(\'' + ref + '\', \'closureNotes\')">Save Draft</button>' +
            '<button class="btn-danger-action" style="margin-left:8px;" onclick="doCloseUnresolved(\'' + ref + '\')">Close as Unresolved &amp; Notify</button>' +
            '<span id="fb-cu-' + ref + '" class="save-feedback"></span>';
    }

    function buildResolveSection(r, headerLabel) {
        const ref = r.referenceNumber;
        return '<div class="action-title" style="color:#6ee7b7;">&#10003; ' + headerLabel + '</div>' +
        '<div class="action-row"><div class="action-field">' +
            '<label>Resolution Summary <span style="color:#fca5a5">*</span></label>' +
            '<textarea id="res-' + ref + '" placeholder="Summarise how the dispute was resolved and what was agreed.">' + escHtml(r.resolutionSummary || '') + '</textarea>' +
        '</div></div>' +
        '<div class="action-note" style="margin-bottom:8px;"><i>Use <strong>Save Draft</strong> to save your text without notifying parties. When ready, click <strong>Resolve &amp; Close &amp; Notify</strong> to finalise.</i></div>' +
        '<button class="btn-save" onclick="saveRelationsDraft(\'' + ref + '\', \'resolution\')">Save Draft</button>' +
        '<button class="btn-action" style="margin-left:8px;" onclick="doResolveClose(\'' + ref + '\')">Resolve &amp; Close &amp; Notify</button>' +
        '<span id="fb-res-' + ref + '" class="save-feedback"></span>';
    }

    // ── EARLY RESOLUTION ──────────────────────────────────────────────────
    // Standalone action, styled and positioned with the same prominence
    // as "Resolved -- Proceed to Closure" (same button row on
    // Acknowledged), not nested behind any other choice. Clicking it
    // reveals the lightweight confirm panel directly -- matches the
    // locked design ("Ticking it opens a lightweight Resolved panel").
    // Locked (disabled, not hidden) once 72 hours from LoggedAt has
    // passed, reason stated on the control itself.
    function buildEarlyResolutionButton(r) {
        const ref = r.referenceNumber;
        const hoursElapsed = r.loggedAt ? (Date.now() - new Date(r.loggedAt).getTime()) / 3600000 : 999;
        const earlyAvailable = hoursElapsed <= CONFIG.EARLY_RESOLUTION_HOURS;
        return '<button class="btn-action" style="background:rgba(217,119,6,0.35);border-color:rgba(217,119,6,0.65);margin-right:8px;"' +
            (earlyAvailable
                ? ' onclick="toggleEarlyPanel(\'' + ref + '\')"'
                : ' disabled title="72-hour window from lodgement has passed"') +
            '>&#9889; Resolved within 72 Hours — Early Resolution</button>';
    }

    function buildEarlyResolutionPanel(r) {
        const ref = r.referenceNumber;
        const hoursElapsed = r.loggedAt ? (Date.now() - new Date(r.loggedAt).getTime()) / 3600000 : 999;
        const earlyAvailable = hoursElapsed <= CONFIG.EARLY_RESOLUTION_HOURS;

        var html = !earlyAvailable
            ? '<div class="action-note" style="margin-top:6px;">Early Resolution is no longer available — the 72-hour window from lodgement has passed.</div>'
            : '';

        html += '<div id="earlypanel-' + ref + '" class="hidden" style="margin-top:10px;">' +
            '<div class="action-row"><div class="action-field">' +
                '<label>Resolution Summary <span style="color:#fca5a5">*</span></label>' +
                '<textarea id="earlyres-' + ref + '" placeholder="Briefly summarise how the dispute was resolved."></textarea>' +
            '</div></div>' +
            '<button class="btn-action" onclick="doEarlyResolutionClose(\'' + ref + '\')">Confirm Early Resolution &amp; Close</button>' +
            '<span id="fb-early-' + ref + '" class="save-feedback"></span>' +
        '</div>';
        return html;
    }


    function buildTriageSection(r) {
        const ref = r.referenceNumber;
        const choice = triagePathChoice[ref];

        var html = '<div class="action-title">Triage This Dispute</div>';
        html += '<div class="action-note" style="margin-bottom:12px;">Choose whether this is a dispute between the resident and Management, or between two residents. This is a one-time decision -- it sets the dispute type, moves status to Acknowledged, and sends the first resident/party-facing notification, all in one action.</div>';

        if (r.description) {
            html += '<div class="description-reference-block">' +
                '<div class="description-reference-label">Submitter\'s Description (raw, internal reference only)</div>' +
                escHtml(r.description) +
            '</div>';
        }

        html += '<div class="triage-choice-row">' +
            '<div class="triage-choice-btn' + (choice === 'Management' ? ' selected' : '') + '" onclick="selectTriageChoice(\'' + ref + '\', \'Management\')">' +
                '<div class="triage-choice-title">Resident-to-Management</div>' +
                '<div class="triage-choice-desc">The resident\'s issue is with the Board/Operator (was: Complaint).</div>' +
            '</div>' +
            '<div class="triage-choice-btn' + (choice === 'Resident' ? ' selected' : '') + '" onclick="selectTriageChoice(\'' + ref + '\', \'Resident\')">' +
                '<div class="triage-choice-title">Resident-to-Resident</div>' +
                '<div class="triage-choice-desc">The dispute is between two residents; the Board mediates.</div>' +
            '</div>' +
        '</div>';

        if (choice === 'Resident') {
            const selected = triagePartyBSelected[ref];
            html += '<div class="action-row">' +
                '<div class="action-field" style="flex:2;">' +
                    '<label>Search Party B by name <span style="color:#fca5a5">*</span></label>' +
                    '<input type="text" id="triage-partyBSearch-' + ref + '" placeholder="Type name to search…" autocomplete="off" value="' + escHtml(selected ? selected.name : '') + '"' +
                        ' oninput="searchTriagePartyB(\'' + ref + '\')" onkeydown="if(event.key===\'Enter\'){event.preventDefault();}">' +
                '</div>' +
            '</div>' +
            '<div id="triage-partyBResults-' + ref + '" class="lookup-results"></div>' +
            (selected
                ? '<div class="prefilled-note">&#10003; ' + escHtml(selected.name) + (selected.unit ? ' (' + escHtml(selected.unit) + ')' : '') + ' selected as Party B.</div>'
                : '') +
            '<div class="action-row" style="margin-top:10px;"><div class="action-field">' +
                '<label>Issue Detail — Board\'s tactful, blame-neutral summary <span style="color:#fca5a5">*</span></label>' +
                '<textarea id="triage-issueDetail-' + ref + '" placeholder="Write a neutral, factual, tactful summary of the dispute, drawing on the Description above. This is sent verbatim to both parties -- do not attribute blame."></textarea>' +
            '</div></div>';
        }

        if (choice) {
            const partyBReady = choice !== 'Resident' || !!triagePartyBSelected[ref];
            html += '<button class="btn-action" onclick="doTriage(\'' + ref + '\')"' + (partyBReady ? '' : ' disabled title="Search and select Party B before confirming triage"') + '>Confirm Triage &amp; Notify</button>' +
                (partyBReady ? '' : '<span class="action-note" style="margin-left:8px;">Select Party B above to enable.</span>') +
                '<span id="fb-triage-' + ref + '" class="save-feedback"></span>';
        }

        return html;
    }

    function buildActionPanel(r) {
        const ref    = r.referenceNumber;
        const status = r.status;
        const terminal = ['Closed - Resolved', 'Closed - Unresolved'];

        var html = '<div class="action-panel">';
        html += '<div class="action-title">Next Step</div>';

        if (status === 'Open') {
            html += buildTriageSection(r);
        }

        else if (status === 'Acknowledged') {
            const choice = relationsPathChoice[ref];

            if (!choice) {
                html += '<div class="action-title">Early Resolution</div>' +
                    buildEarlyResolutionButton(r) +
                    buildEarlyResolutionPanel(r) +
                    '<hr class="action-separator">';
                html += '<div class="action-title">Status Review</div>' +
                '<div class="action-note" style="margin-bottom:12px;">Review the current status of this dispute. If already resolved, proceed directly to closure. If not yet resolved, open the Process Statement panel.</div>' +
                '<button class="btn-action" onclick="doStatusReview(\'' + ref + '\', \'resolved\')">&#10003; Resolved — Proceed to Closure</button>' +
                '<button class="btn-secondary-action" style="margin-left:8px;" onclick="doStatusReview(\'' + ref + '\', \'not_resolved\')">&#8594; Not Resolved — Open Process Statement</button>';
                html += '<hr class="action-separator">';
                html += '<button class="btn-print-record" onclick="showRelationsPrintDialog(\'' + ref + '\')">&#128438; Print Record</button>';
                return html + '</div>';
            }

            if (choice === 'not_resolved') {
                html += '<div class="action-title">Process Statement</div>' +
                '<div class="action-row"><div class="action-field full-width">' +
                    '<label>Process Statement — describe the process the Board will follow <span style="color:#fca5a5">*</span></label>' +
                    '<textarea id="ps-' + ref + '" placeholder="e.g. The Board will meet with both parties separately within 7 days and provide a written summary of the meeting to each party. Both parties will be given an opportunity to respond before any determination is made."></textarea>' +
                '</div></div>' +
                '<div class="action-note">Recorded and sent within <strong>72 hours</strong> of this dispute being logged, if it remains unresolved by then.</div>' +
                '<div style="margin-top:10px;">' +
                    '<button class="btn-action" onclick="doProcessStatement(\'' + ref + '\')">Send Process Statement &amp; Notify</button>' +
                    '<span id="fb-' + ref + '" class="save-feedback"></span>' +
                '</div>' +
                '<div style="margin-top:10px;">' +
                    '<a href="#" style="color:#5eead4;font-size:0.82rem;font-weight:600;text-decoration:none;" onclick="relationsPathChoice[\'' + ref + '\']=null; renderCard(\'' + ref + '\'); return false;">&larr; Back to Status Review</a>' +
                '</div>';
                html += '<hr class="action-separator">';
                html += '<button class="btn-print-record" onclick="showRelationsPrintDialog(\'' + ref + '\')">&#128438; Print Record</button>';
                return html + '</div>';
            }

            // RESOLVED (quick path)
            html += buildResolveSection(r, 'Resolve & Close') +
            '<div style="margin-top:10px;">' +
                '<a href="#" style="color:#5eead4;font-size:0.82rem;font-weight:600;text-decoration:none;" onclick="relationsPathChoice[\'' + ref + '\']=null; renderCard(\'' + ref + '\'); return false;">&larr; Back to Status Review</a>' +
            '</div>';
            html += '<hr class="action-separator">';
            html += '<button class="btn-print-record" onclick="showRelationsPrintDialog(\'' + ref + '\')">&#128438; Print Record</button>';
            return html + '</div>';
        }

        else if (status === 'Under Review') {
            html += '<div class="action-title">Early Resolution</div>' +
                buildEarlyResolutionButton(r) +
                buildEarlyResolutionPanel(r) +
                '<hr class="action-separator">';

            const urChoice = underReviewChoice[ref];

            if (!urChoice) {
                html += '<div class="action-title">Closure</div>' +
                '<div class="action-note" style="margin-bottom:12px;">Choose how this dispute is being closed.</div>' +
                '<button class="btn-action" onclick="selectUnderReviewChoice(\'' + ref + '\', \'resolved\')">&#10003; Resolve &amp; Close</button>' +
                '<button class="btn-danger-action" style="margin-left:8px;" onclick="selectUnderReviewChoice(\'' + ref + '\', \'unresolved\')">&#9888; Close as Unresolved</button>';
            } else if (urChoice === 'resolved') {
                html += buildResolveSection(r, 'Resolve & Close') +
                '<div style="margin-top:10px;">' +
                    '<a href="#" style="color:#5eead4;font-size:0.82rem;font-weight:600;text-decoration:none;" onclick="underReviewChoice[\'' + ref + '\']=null; renderCard(\'' + ref + '\'); return false;">&larr; Back to Closure</a>' +
                '</div>';
            } else {
                html += buildCloseUnresolvedSection(r) +
                '<div style="margin-top:10px;">' +
                    '<a href="#" style="color:#5eead4;font-size:0.82rem;font-weight:600;text-decoration:none;" onclick="underReviewChoice[\'' + ref + '\']=null; renderCard(\'' + ref + '\'); return false;">&larr; Back to Closure</a>' +
                '</div>';
            }
        }

        else if (terminal.indexOf(status) !== -1) {
            html += '<div class="action-note">This dispute is <strong>' + escHtml(status) + '</strong> and no further actions are available.</div>';
        }

        html += '<hr class="action-separator">';
        html += '<button class="btn-print-record" onclick="showRelationsPrintDialog(\'' + ref + '\')">&#128438; Print Record</button>';
        html += '</div>';
        return html;
    }

    // ── CARD / PANE TOGGLE ────────────────────────────────────────────────

    function toggleCard(ref) {
        const card = document.getElementById('card-' + ref);
        if (!card) return;
        card.classList.toggle('expanded');
        if (card.classList.contains('expanded')) {
            const container = document.getElementById('events-all-' + ref);
            if (container && container.classList.contains('pane-text')) {
                loadMatterHistory(ref);
            }
            // System Events (activityLog) is deliberately stripped from
            // the bulk getRelations() list response to keep that payload
            // small (see backend V1.0.5) -- lazy-load it here on first
            // expand only, same pattern as the Events panes above.
            const relForActivity = allRelations.find(function(x) { return x.referenceNumber === ref; });
            if (relForActivity && !relForActivity._activityLoaded) {
                jsonp({ action: 'getRelationByRef', ref: ref }, function(data) {
                    if (data.success && data.relation) {
                        relForActivity.activityLog = data.relation.activityLog || '';
                        relForActivity._activityLoaded = true;
                        updateActivityLog(ref, relForActivity.activityLog);
                    }
                }, function(err) {
                    console.error('toggleCard: failed to lazy-load activity log for ' + ref, err);
                });
            }
        }
    }

    function togglePane(id) {
        const pane = document.getElementById(id);
        if (!pane) return;
        pane.classList.toggle('open');
    }

    // ── PARTY B LOOKUP (triage) ──────────────────────────────────────────
    // Same getUnitListData pattern as RelationsForm.html's Board-mode
    // resident search -- field names (residentName/unitNumber/email/
    // phone) confirmed against DisputesManager.html's own working
    // searchParty(), not assumed (see "assume nothing" working
    // principle in the Build Log).

    function loadResidentList() {
        var callbackName = 'rm_mgmt_' + Date.now();
        var url = CONFIG.MGMT_URL + '?action=getUnitListData&callback=' + callbackName;
        var s = document.createElement('script');
        var settled = false;
        function cleanup() { window[callbackName] = function() {}; try { document.head.removeChild(s); } catch (e) {} }
        var timer = setTimeout(function() {
            if (settled) return;
            settled = true; cleanup();
            console.warn('loadResidentList timed out');
        }, 30000);
        window[callbackName] = function(data) {
            if (settled) return;
            settled = true; clearTimeout(timer); cleanup();
            if (data.success && data.residents) {
                allResidents = data.residents.filter(function(r) { return r.stage === 'Stage 1' || r.stage === 1; });
            }
        };
        s.src = url;
        document.head.appendChild(s);
    }

    function searchTriagePartyB(ref) {
        var query = (document.getElementById('triage-partyBSearch-' + ref).value || '').trim().toLowerCase();
        var resultsEl = document.getElementById('triage-partyBResults-' + ref);
        if (!query) { resultsEl.style.display = 'none'; resultsEl.innerHTML = ''; return; }

        if (allResidents.length === 0) {
            resultsEl.innerHTML = '<div class="lookup-result-item" style="color:#9ca3af;cursor:default;">Resident list still loading — please try again in a moment.</div>';
            resultsEl.style.display = 'block';
            return;
        }

        var matches = allResidents.filter(function(r) {
            return (r.residentName || '').toLowerCase().indexOf(query) !== -1;
        }).slice(0, 8);

        if (matches.length === 0) {
            resultsEl.innerHTML = '<div class="lookup-result-item" style="color:#9ca3af;cursor:default;">No matching residents</div>';
            resultsEl.style.display = 'block';
            return;
        }

        resultsEl.innerHTML = matches.map(function(r, i) {
            return '<div class="lookup-result-item" onclick="selectTriagePartyB(\'' + ref + '\', ' + i + ')">' + escHtml(r.residentName) +
                '<span class="unit-tag">' + escHtml(r.unitNumber || '') + '</span></div>';
        }).join('');
        resultsEl.style.display = 'block';
        window['_triagePartyBMatches_' + ref] = matches;
    }

    function selectTriagePartyB(ref, i) {
        var r = window['_triagePartyBMatches_' + ref][i];
        triagePartyBSelected[ref] = {
            name:   r.residentName || '',
            unit:   r.unitNumber   || '',
            email:  r.email        || '',
            mobile: r.phone || r.mobile || ''
        };
        renderCard(ref);
    }

    // ── TRIAGE ────────────────────────────────────────────────────────────

    function selectTriageChoice(ref, choice) {
        triagePathChoice[ref] = choice;
        renderCard(ref);
    }

    function doTriage(ref) {
        const choice = triagePathChoice[ref];
        if (!choice) return;
        const userName = currentUserName();
        const fbId = 'fb-triage-' + ref;

        var payload = { action: 'triageMatter', ref: ref, userName: userName, matterType: choice };

        if (choice === 'Resident') {
            const partyB = triagePartyBSelected[ref];
            if (!partyB || !partyB.name) { feedback(fbId, 'Party B is required for a Resident-to-Resident dispute -- search and select the other resident before triaging.', false); return; }
            const issueDetail = val('triage-issueDetail-' + ref);
            if (!issueDetail) { feedback(fbId, 'Issue Detail is required for a Resident-to-Resident dispute.', false); return; }
            payload.issueDetail   = issueDetail;
            payload.partyBName    = partyB.name;
            payload.partyBUnit    = partyB.unit;
            payload.partyBEmail   = partyB.email;
            payload.partyBMobile  = partyB.mobile;
        }

        if (!confirm('Confirm triage as ' + (choice === 'Management' ? 'Resident-to-Management' : 'Resident-to-Resident') + '? This sends the first resident/party-facing notification and cannot be undone.')) return;

        feedback(fbId, 'Submitting…', null);
        jsonp(payload, function(data) {
            if (data.success) {
                delete triagePathChoice[ref];
                delete triagePartyBSelected[ref];
                refreshCard(ref);
            } else {
                feedback(fbId, '✗ ' + (data.error || 'Triage failed.'), false);
            }
        }, function(err) { feedback(fbId, '✗ ' + err, false); });
    }

    // ── ACTIONS ───────────────────────────────────────────────────────────

    function doProcessStatement(ref) {
        const ps = val('ps-' + ref);
        if (!ps) { feedback('fb-' + ref, 'Process statement is required.', false); return; }
        const userName = currentUserName();
        const fbId = 'fb-' + ref;
        const btnEl = getSendBtn(fbId);
        btnSending(fbId, btnEl);
        jsonp({ action: 'updateRelation', ref: ref, status: 'Under Review', processStatement: ps, userName: userName, andSend: 'true' },
            function(data) {
                if (data.success) { btnDone(fbId, btnEl, true, ''); refreshCard(ref, data.activityLog); }
                else { btnDone(fbId, btnEl, false, data.error || 'Update failed.'); }
            }, function(err) { btnDone(fbId, btnEl, false, err); });
    }

    function doResolveClose(ref) {
        const res = val('res-' + ref);
        if (!res) { feedback('fb-res-' + ref, 'Resolution summary is required.', false); return; }
        if (!confirm('Resolve and close this dispute, and notify all parties? This cannot be undone.')) return;
        const userName = currentUserName();
        const fbIdRes = 'fb-res-' + ref;
        const btnElRes = getSendBtn(fbIdRes);
        btnSending(fbIdRes, btnElRes);
        jsonp({ action: 'updateRelation', ref: ref, status: 'Closed - Resolved', resolutionSummary: res, earlyResolution: 'false', userName: userName, andSend: 'true' },
            function(data) {
                if (data.success) { btnDone(fbIdRes, btnElRes, true, ''); refreshCard(ref, data.activityLog); }
                else { btnDone(fbIdRes, btnElRes, false, data.error || 'Update failed.'); }
            }, function(err) { btnDone(fbIdRes, btnElRes, false, err); });
    }

    function toggleEarlyPanel(ref) {
        var panel = document.getElementById('earlypanel-' + ref);
        if (!panel) return;
        panel.classList.toggle('hidden');
    }

    function doEarlyResolutionClose(ref) {
        const res = val('earlyres-' + ref);
        if (!res) { feedback('fb-early-' + ref, 'Resolution summary is required.', false); return; }
        if (!confirm('Confirm Early Resolution and close this dispute, notifying all parties? This cannot be undone.')) return;
        const userName = currentUserName();
        const fbId = 'fb-early-' + ref;
        const btnEl = getSendBtn(fbId);
        console.log('doEarlyResolutionClose: submitting for ' + ref);
        btnSending(fbId, btnEl);
        jsonp({ action: 'updateRelation', ref: ref, status: 'Closed - Resolved', resolutionSummary: res, earlyResolution: 'true', userName: userName, andSend: 'true' },
            function(data) {
                console.log('doEarlyResolutionClose: updateRelation response', data);
                if (data.success) { btnDone(fbId, btnEl, true, ''); refreshCard(ref, data.activityLog); }
                else { btnDone(fbId, btnEl, false, data.error || 'Update failed.'); }
            }, function(err) {
                console.error('doEarlyResolutionClose: updateRelation error', err);
                btnDone(fbId, btnEl, false, err);
            });
    }

    function saveRelationsDraft(ref, type) {
        var fbId, fieldVal, payload;
        if (type === 'resolution') {
            fieldVal = val('res-' + ref);
            fbId     = 'fb-res-' + ref;
            if (!fieldVal) { feedback(fbId, 'Please enter a resolution summary before saving.', false); return; }
            payload  = { action: 'updateRelation', ref: ref, resolutionSummary: fieldVal, userName: currentUserName(), skipLog: 'true' };
        } else {
            fieldVal = val('closeun-' + ref);
            fbId     = 'fb-cu-' + ref;
            payload  = { action: 'updateRelation', ref: ref, closureNotes: fieldVal, userName: currentUserName(), skipLog: 'true' };
        }
        feedback(fbId, 'Saving…', null);
        jsonp(payload, function(data) {
            if (data.success) {
                var timeStr = new Date().toLocaleTimeString('en-AU', { hour: '2-digit', minute: '2-digit' });
                feedback(fbId, '✓ Draft saved — ' + timeStr, true);
                if (data.activityLog) updateActivityLog(ref, data.activityLog);
            } else { feedback(fbId, '✗ ' + (data.error || 'Save failed.'), false); }
        }, function(err) { feedback(fbId, '✗ ' + err, false); });
    }

    function doCloseUnresolved(ref) {
        const notes = val('closeun-' + ref);
        if (!confirm('Close this dispute as Unresolved?\n\nAll parties will be sent the standard advice on their options and notified. This cannot be undone.')) return;
        const userName = currentUserName();
        const fbId  = 'fb-cu-' + ref;
        const btnEl = getSendBtn(fbId);
        btnSending(fbId, btnEl);
        jsonp({ action: 'updateRelation', ref: ref, status: 'Closed - Unresolved', closureNotes: notes, userName: userName, andSend: 'true' },
            function(data) {
                if (data.success) { btnDone(fbId, btnEl, true, ''); refreshCard(ref, data.activityLog); }
                else { btnDone(fbId, btnEl, false, data.error || 'Update failed.'); }
            }, function(err) { btnDone(fbId, btnEl, false, err); });
    }

    function doStatusReview(ref, path) {
        relationsPathChoice[ref] = path;
        renderCard(ref);

        underReviewChoice[ref] = choice;
        renderCard(ref);

    // ── DISPUTE HISTORY -- load events from Events tab ─────────────────────
    const _eventCache = {};

    function loadMatterHistory(ref) {
        const panes = {
            all:    document.getElementById('events-all-'    + ref),
            partyA: document.getElementById('events-partyA-' + ref),
            partyB: document.getElementById('events-partyB-' + ref),
            board:  document.getElementById('events-board-'  + ref)
        };
        const relForLabel = allRelations.find(function(x) { return x.referenceNumber === ref; });
        const aLabel = relForLabel ? partyALabel(relForLabel) : 'Resident';
        // Tag actually written by EventEntryModal depends on which
        // checkbox set it showed, which depends on the matterType passed
        // to it (see openEventEntry) -- must match here or newly-added
        // events won't be found by this filter. 'Party A' for triaged
        // Resident-to-Resident disputes, 'Resident' otherwise (Management,
        // or untriaged pending triage).
        const residentTag = (relForLabel && relForLabel.matterType === 'Resident') ? 'Party A' : 'Resident';

        jsonp({ action: 'getEvents', matterRef: ref },
            function(data) {
                const events = (data.success && data.events) ? data.events : [];
                _eventCache[ref] = events;

                if (panes.all) {
                    panes.all.innerHTML = events.length
                        ? events.map(renderEventEntry).join('')
                        : '<div class="pane-text" style="color:rgba(255,255,255,0.4);">No events recorded yet.</div>';
                }
                const partyAEvents = events.filter(function(e) { return visMatch(e.visibility, residentTag); });
                if (panes.partyA) {
                    panes.partyA.innerHTML = partyAEvents.length
                        ? partyAEvents.map(renderEventEntry).join('')
                        : '<div class="pane-text" style="color:rgba(255,255,255,0.4);">No ' + aLabel + ' events recorded yet.</div>';
                }
                const partyBEvents = events.filter(function(e) { return visMatch(e.visibility, 'Party B'); });
                if (panes.partyB) {
                    panes.partyB.innerHTML = partyBEvents.length
                        ? partyBEvents.map(renderEventEntry).join('')
                        : '<div class="pane-text" style="color:rgba(255,255,255,0.4);">No Party B events recorded yet.</div>';
                }
                const boardEvents = events.filter(function(e) { return visMatch(e.visibility, 'Board'); });
                if (panes.board) {
                    panes.board.innerHTML = boardEvents.length
                        ? boardEvents.map(renderEventEntry).join('')
                        : '<div class="pane-text" style="color:rgba(255,255,255,0.4);">No board notes recorded yet.</div>';
                }
            },
            function(err) {
                Object.values(panes).forEach(function(p) {
                    if (p) p.innerHTML = '<div class="pane-text" style="color:rgba(255,255,255,0.4);">Error loading events: ' + escHtml(err) + '</div>';
                });
            });
    }

    function renderEventEntry(ev) {
        const isEmail = ['Email Received', 'Email Sent'].indexOf(ev.eventType) !== -1;
        let detail = '';
        if (isEmail) {
            if (ev.emailDate)    detail += '<div class="event-detail">Date: '    + escHtml(ev.emailDate)    + '</div>';
            if (ev.emailFrom)    detail += '<div class="event-detail">From: '    + escHtml(ev.emailFrom)    + '</div>';
            if (ev.emailTo)      detail += '<div class="event-detail">To: '      + escHtml(ev.emailTo)      + '</div>';
            if (ev.emailSubject) detail += '<div class="event-detail">Subject: ' + escHtml(ev.emailSubject) + '</div>';
        } else if (ev.reference) {
            detail += '<div class="event-detail">Ref: ' + escHtml(ev.reference) + '</div>';
        }
        if (ev.extendedNotes) detail += '<div class="event-detail event-notes">' + escHtml(ev.extendedNotes) + '</div>';
        var visLabel = (ev.visibility || '').split(',').map(function(v) { return v.trim(); }).join(' + ');

        return '<div class="activity-log-entry">' +
            '<div class="event-header">' +
                '<span class="event-timestamp">' + escHtml(ev.timestamp) + '</span>' +
                ' <span class="event-user">' + escHtml(ev.user) + '</span>' +
                ' &mdash; <span class="event-type">[' + escHtml(ev.eventType) + ']</span>' +
                ' <span class="event-visibility">' + escHtml(visLabel) + '</span>' +
            '</div>' +
            '<div class="event-summary">' + escHtml(ev.summary) + '</div>' +
            detail +
        '</div>';
    }

    function openEventEntry(ref) {
        const userName = currentUserName();
        const relation = allRelations.find(function(x) { return x.referenceNumber === ref; });
        // 'Relations-Resident' triggers EventEntryModal's Party A/Party B/
        // Board checkbox set (matches its existing 'Dispute' branch);
        // 'Relations' (unchanged) keeps the Resident/Board set for
        // Management disputes. See EventEntryModal.js's own version
        // history for the corresponding change this pairs with.
        const eemMatterType = (relation && relation.matterType === 'Resident') ? 'Relations-Resident' : 'Relations';
        EventEntryModal.open({
            matterRef:  ref,
            matterType: eemMatterType,
            backendUrl: CONFIG.BACKEND_URL,
            userName:   userName,
            onSuccess:  function(event) { handleNewEvent(ref, event); }
        });
    }

    function handleNewEvent(ref, event) {
        const html = renderEventEntry(event);
        if (!_eventCache[ref]) _eventCache[ref] = [];
        _eventCache[ref].unshift(event);

        function prependTo(containerId) {
            const container = document.getElementById(containerId);
            if (!container) return;
            const div = document.createElement('div');
            div.innerHTML = html;
            const emptyEl = container.querySelector('.pane-text');
            if (emptyEl && emptyEl.parentElement === container) container.innerHTML = '';
            container.insertBefore(div.firstChild, container.firstChild);
        }

        prependTo('events-all-' + ref);
        if (visMatch(event.visibility, 'Party A')) prependTo('events-partyA-' + ref);
        if (visMatch(event.visibility, 'Party B')) prependTo('events-partyB-' + ref);
        if (visMatch(event.visibility, 'Board'))   prependTo('events-board-' + ref);
    }

    // ── RELATIONS CATEGORIES (for print/reference; no intake form here) ──

    function loadRelationsCategories() {
        jsonp({ action: 'getRelationsCategories' }, function(data) {
            if (!data.success) console.warn('loadRelationsCategories: failed -- ' + (data.error || 'unknown'));
        }, function(err) { console.warn('loadRelationsCategories error: ' + err); });
    }

    // ── REFRESH / RE-RENDER ───────────────────────────────────────────────

    function refreshCard(ref, activityLog) {
        console.log('refreshCard: fetching latest for ' + ref);
        jsonp({ action: 'getRelationByRef', ref: ref }, function(data) {
            console.log('refreshCard: getRelationByRef response', data);
            if (!data.success || !data.relation) {
                console.error('refreshCard: getRelationByRef did not return a relation -- falling back to activity log update only', data);
                if (activityLog) updateActivityLog(ref, activityLog);
                return;
            }
            var r = data.relation;
            r._activityLoaded = true;  // getRelationByRef returns full activityLog, unlike the list endpoint
            for (var i = 0; i < allRelations.length; i++) {
                if (allRelations[i].referenceNumber === ref) { allRelations[i] = r; break; }
            }
            var card = document.getElementById('card-' + ref);
            if (!card) { console.error('refreshCard: no card element found for id card-' + ref); return; }
            var wasExpanded = card.classList.contains('expanded');
            var wrapper = document.createElement('div');
            wrapper.innerHTML = buildCard(r);
            var newCard = wrapper.firstChild;
            if (wasExpanded) newCard.classList.add('expanded');
            if (card.parentNode) {
                card.parentNode.replaceChild(newCard, card);
                console.log('refreshCard: card replaced, new status = ' + r.status);
            } else {
                console.error('refreshCard: card has no parentNode, could not replace');
            }
            updateSummary(allRelations);
        }, function(err) {
            console.error('refreshCard: getRelationByRef request failed', err);
            if (activityLog) updateActivityLog(ref, activityLog);
        });
    }

    function renderCard(ref) {
        var r = allRelations.find(function(x) { return x.referenceNumber === ref; });
        if (!r) return;
        var card = document.getElementById('card-' + ref);
        var wasExpanded = card && card.classList.contains('expanded');
        var wrapper = document.createElement('div');
        wrapper.innerHTML = buildCard(r);
        var newCard = wrapper.firstChild;
        if (wasExpanded) newCard.classList.add('expanded');
        if (card && card.parentNode) card.parentNode.replaceChild(newCard, card);
    }

    function renderLogEntries(entries) {
        return entries.map(function(e) {
            var isBoardLog = e.indexOf('[BOARD LOG]') !== -1;
            var isInbound  = e.indexOf('[INBOUND]')   !== -1;
            var isSystem   = e.indexOf('| SYSTEM |')  !== -1;
            var isComment  = !isSystem;

            var borderColor, pillBg, pillColor, pillLabel;
            if (isBoardLog) {
                borderColor = 'rgba(59,130,246,0.6)'; pillBg = 'rgba(59,130,246,0.3)'; pillColor = '#bfdbfe'; pillLabel = 'Board Log';
            } else if (isInbound) {
                borderColor = 'rgba(245,158,11,0.6)'; pillBg = 'rgba(245,158,11,0.3)'; pillColor = '#fde68a'; pillLabel = 'Inbound';
            } else if (isComment) {
                borderColor = 'rgba(168,85,247,0.6)'; pillBg = 'rgba(168,85,247,0.3)'; pillColor = '#e9d5ff'; pillLabel = 'Board Comment';
            } else {
                borderColor = 'rgba(255,255,255,0.15)'; pillBg = 'rgba(255,255,255,0.1)'; pillColor = 'rgba(255,255,255,0.6)'; pillLabel = 'System';
            }

            var pill = '<span style="display:inline-block;padding:1px 7px;border-radius:10px;font-size:0.68rem;font-weight:700;text-transform:uppercase;letter-spacing:0.05em;margin-right:6px;background:' + pillBg + ';color:' + pillColor + ';">' + pillLabel + '</span>';

            var headerMatch = e.match(/^(\d{4}-\d{2}-\d{2} \d{2}:\d{2})\s*\|\s*([^|]+)\|\s*([\s\S]*)$/);
            var metaLine = '';
            var bodyText = e;
            if (headerMatch) {
                var ts    = headerMatch[1].trim();
                var actor = headerMatch[2].trim();
                var body  = headerMatch[3].trim();
                var actorDisplay = actor === 'SYSTEM' ? '' : ' \u2014 ' + actor;
                metaLine = '<div style="font-size:0.75rem;color:rgba(255,255,255,0.5);margin-bottom:3px;">' + pill + ts + actorDisplay + '</div>';
                bodyText = body;
            }

            return '<div style="padding:6px 8px;border-bottom:1px solid rgba(255,255,255,0.06);border-left:3px solid ' + borderColor + ';margin-bottom:2px;background:rgba(255,255,255,0.03);">'
                + metaLine
                + '<div style="font-size:0.8rem;color:rgba(255,255,255,0.8);white-space:pre-wrap;">' + escHtml(bodyText) + '</div>'
                + '</div>';
        }).join('');
    }

    function updateActivityLog(ref, logText) {
        const pane = document.getElementById('pane-sysevents-' + ref);
        if (!pane) return;
        const body = pane.querySelector('.accordion-body');
        if (!body) return;
        const entries = logText.split('\n\n').map(function(e) { return e.trim(); }).filter(Boolean).reverse();
        body.innerHTML = entries.length
            ? renderLogEntries(entries)
            : '<div class="pane-text" style="color:rgba(255,255,255,0.4);">No system events recorded.</div>';
    }

    // ── UTILITY ───────────────────────────────────────────────────────────

            'Under Review':           'status-under-review',
            'Closed - Resolved':      'status-closed-resolved',

        }[status] || 'status-open';
    }

    function statusPillClass(status) {
        return {

            'Closed - Resolved':      'rel-pill-closed-resolved',
            'Closed - Unresolved':    'rel-pill-closed-unresolved'
        }[status] || 'rel-pill-open';

    function detailField(label, value, fullWidth) {
        return '<div class="detail-field' + (fullWidth ? ' full-width' : '') + '">' +
            '<div class="detail-label">' + escHtml(label) + '</div>' +
