<!--
=====================================================================
RelationsManager.html - RELATIONS MANAGER MODULE
=====================================================================
DOCUMENT INFORMATION:
  File Name:        RelationsManager.html
  System:           Lake Illawong Management Central System
  Component Type:   Admin Module
  Frontend Version: V1.0.0
  Status:           DEVELOPMENT
  Created:          Aug 2026

PURPOSE:
  Board-facing case management for the Relations Manager module -- the
  unified consolidation of ComplaintsManager (Resident-to-Management)
  and DisputesManager (Resident-to-Resident). Option B build: started
  from a copy of DisputesManager_V3_2_4.html (the more mature of the
  two source frontends), then deliberately modified. See
  Relations_Manager_Build_Log.md for the full decision record this
  build implements.

KEY STRUCTURAL CHANGES FROM DisputesManager.html:
  - The entire "Log Dispute" modal and resident-lookup machinery
    (searchParty, selectParty, enablePartyBManual, resetPartyBToLookup,
    openLogModal/closeLogModal/clearLogForm, submitDispute,
    loadResidentList) is REMOVED. Board direct-entry is superseded by
    the shared RelationsForm.html (per Build Log: "Board would navigate
    to the shared form rather than stay inside the Manager, trading
    'stay on one page' for 'one field set, zero duplication risk'") --
    not ported here. "+ Log Matter" links out to RelationsForm.html
    rather than opening an inline modal.
  - Acknowledge (silent, no notification) is REPLACED by Triage: a
    single richer action, available only on Open, that asks Management
    or Resident, captures Party B + Board-authored Issue Detail if
    Resident, and fires the full triage-completion notification bundle
    server-side. There is no separate "Acknowledge" click any more.
  - Status set: Open / Acknowledged / Under Review / Closed - Resolved
    / Closed - Unresolved. No Referred/Closed - Referred (Disputes'
    external-referral machinery never applied to Relations -- it was
    already removed from Disputes itself before this build started).
  - Early Resolution: manual checkbox on the Resolve action, honoured
    only within 72 hours of LoggedAt (computed client-side to show/
    hide the control; enforced again server-side as the source of
    truth). Resolved-only, matches the schema's EarlyResolution column.
  - Detail grid gains the Complaints-sourced fields (Description,
    Desired Outcome, Previous Actions, Location, People Involved),
    always shown when present, alongside the schema's MatterType-
    conditional Issue Detail (Resident-to-Resident only, populated at
    triage).
  - Card/pill CSS uses the new Relations schema documented in the
    Design System V2.4 addendum (.relations-card, .rel-pill-*) --
    teal accent retained from Disputes per Tony's explicit direction,
    new values only added where the merged 5-status set + 3-tier
    overdue treatment had no existing equivalent.
  - RoleTag: 'Relations-Manager' (Build Log: small, one-time UnitList
    change for Gary/Sue, renamed from 'Complaints-Manager').
  - SESSION_KEY: 'portalAdminVerified' -- unchanged, inherited
    deliberately (Build Log: AdminPortal.html and DisputesManager.html
    already share this key; RelationsManager.html/RelationsForm.html
    must both use it too, not invent a new one).

VERSION HISTORY:
  V1.0.0 (Aug 2026): Initial build.

=====================================================================
-->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Relations Manager - Lake Illawong</title>
<script src="VerificationModal_V1_0.js"></script>
<script src="EventEntryModal_V1_4.js"></script>
<style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        background: linear-gradient(135deg, #1e40af 0%, #1e3a8a 100%);
        min-height: 100vh;
        color: white;
    }

    .container { max-width: 1000px; margin: 0 auto; padding: 20px; }

    /* ── HEADER ─────────────────────────────────────────────── */
    .header { text-align: center; margin-bottom: 24px; }
    .header-content { display: flex; align-items: center; justify-content: center; gap: 20px; margin-bottom: 15px; }
    .logo-image { width: 90px; height: 90px; border-radius: 50%; object-fit: cover; flex-shrink: 0; }
    .header-text { display: flex; flex-direction: column; align-items: flex-start; justify-content: center; }
    .header-title { font-size: 2.2rem; font-weight: 700; color: white; margin: 0 0 5px 0; line-height: 1.1; text-shadow: 2px 2px 4px rgba(0,0,0,0.3); }
    .header-subtitle { font-size: 1rem; color: rgba(255,255,255,0.9); font-weight: 500; }
    .header-divider {
        height: 2px;
        background: linear-gradient(90deg, transparent 0%, rgba(255,255,255,0.3) 10%,
            rgba(255,255,255,0.8) 50%, rgba(255,255,255,0.3) 90%, transparent 100%);
        border-radius: 2px; margin-top: 15px;
    }

    /* ── BACK BUTTON ─────────────────────────────────────────── */
    .portal-back-btn {
        background: rgba(255,255,255,0.15); border: 1px solid rgba(255,255,255,0.3);
        color: white; padding: 8px 18px; border-radius: 2px;
        font-size: 0.88rem; font-weight: 600; cursor: pointer;
        display: block; margin: 0 auto 20px auto; transition: background 0.2s;
    }
    .portal-back-btn:hover { background: rgba(255,255,255,0.25); }

    /* ── SUMMARY STRIP ───────────────────────────────────────── */
    .summary-strip { display: flex; gap: 10px; margin-bottom: 16px; flex-wrap: wrap; }
    .summary-tile {
        background: rgba(255,255,255,0.1); border: 1px solid rgba(255,255,255,0.15);
        backdrop-filter: blur(10px); border-radius: 2px;
        padding: 12px 10px; flex: 1; min-width: 90px; text-align: center;
    }
    .tile-count { font-size: 1.8rem; font-weight: 700; color: white; line-height: 1; }
    .tile-count.overdue { color: #fca5a5; }
    .tile-label { font-size: 0.68rem; color: rgba(255,255,255,0.7); margin-top: 4px; text-transform: uppercase; letter-spacing: 0.4px; word-break: break-word; }

    /* ── FILTER / ACTION BAR ─────────────────────────────────── */
    .filter-bar {
        background: rgba(255,255,255,0.1); border: 1px solid rgba(255,255,255,0.15);
        backdrop-filter: blur(10px); border-radius: 2px;
        padding: 12px 16px; margin-bottom: 14px;
        display: flex; gap: 12px; flex-wrap: wrap; align-items: center;
    }
    .filter-bar label { font-size: 0.82rem; font-weight: 600; color: rgba(255,255,255,0.9); white-space: nowrap; }
    .filter-bar select {
        background: rgba(255,255,255,0.15); border: 1px solid rgba(255,255,255,0.25);
        border-radius: 2px; padding: 6px 10px; font-size: 0.85rem; color: white; cursor: pointer;
    }
    .filter-bar select option { background: #1e3a8a; color: white; }
    .filter-bar input[type="text"] {
        background: rgba(255,255,255,0.1); border: 1px solid rgba(255,255,255,0.25);
        border-radius: 2px; color: white; padding: 6px 10px; font-size: 0.85rem;
        min-height: 36px; width: 200px;
    }
    .filter-bar input[type="text"]::placeholder { color: rgba(255,255,255,0.45); }
    .filter-bar input[type="text"]:focus { outline: none; background: rgba(255,255,255,0.15); border-color: rgba(255,255,255,0.45); }

    .btn-refresh {
        background: rgba(255,255,255,0.15); border: 1px solid rgba(255,255,255,0.3);
        color: white; padding: 7px 16px; border-radius: 2px;
        font-size: 0.85rem; font-weight: 600; cursor: pointer; transition: background 0.2s;
    }
    .btn-refresh:hover { background: rgba(255,255,255,0.25); }

    .btn-log-matter {
        margin-left: auto; background: rgba(13,148,136,0.5); border: 1px solid rgba(13,148,136,0.8);
        color: white; padding: 7px 18px; border-radius: 2px;
        font-size: 0.88rem; font-weight: 700; cursor: pointer; transition: background 0.2s;
        text-decoration: none; display: inline-block;
    }
    .btn-log-matter:hover { background: rgba(13,148,136,0.75); }

    /* ── RELATIONS CARDS ─────────────────────────────────────── */
    /* Card/pill class names and colour values match the Relations
       Module Colour Schema addendum in Unified_Design_System_v2_4.txt */
    .relations-card {
        background: rgba(255,255,255,0.08); border: 1px solid rgba(255,255,255,0.15);
        border-left: 4px solid rgba(13,148,136,0.5); backdrop-filter: blur(10px);
        border-radius: 2px; margin-bottom: 10px; overflow: hidden;
    }
    .relations-card.status-open              { border-left: 4px solid #0d9488; }
    .relations-card.status-acknowledged      { border-left: 4px solid #10b981; background: rgba(16,185,129,0.35); backdrop-filter: none; }
    .relations-card.status-under-review      { border-left: 4px solid #f59e0b; background: rgba(245,158,11,0.12); backdrop-filter: none; }
    .relations-card.status-closed-resolved   { border-left: 4px solid #cbd5e1; background: rgba(203,213,225,0.4); backdrop-filter: none; }
    .relations-card.status-closed-unresolved { border-left: 4px solid #9ca3af; background: rgba(156,163,175,0.3); backdrop-filter: none; }
    .relations-card.overdue-triage           { border-left: 4px solid #ef4444; background: rgba(239,68,68,0.45); backdrop-filter: none; }
    .relations-card.overdue-process          { border-left: 4px solid #f59e0b; background: rgba(245,158,11,0.4); backdrop-filter: none; }
    .relations-card.overdue-review           { border-left: 4px solid #f97316; background: rgba(249,115,22,0.12); backdrop-filter: none; }

    .card-summary { padding: 13px 16px; display: flex; align-items: center; gap: 12px; cursor: pointer; user-select: none; flex-wrap: wrap; }
    .card-summary:hover { background: rgba(255,255,255,0.05); }
    .card-ref { font-family: monospace; font-size: 0.8rem; font-weight: 700; color: rgba(255,255,255,0.6); white-space: nowrap; }
    .card-parties { font-size: 0.92rem; font-weight: 600; color: white; flex: 1; min-width: 120px; }
    .card-matter-type {
        font-size: 0.68rem; font-weight: 700; text-transform: uppercase; letter-spacing: 0.4px;
        padding: 2px 8px; border-radius: 10px; white-space: nowrap;
    }
    .card-matter-type.mt-management { background: rgba(59,130,246,0.3); color: #bfdbfe; }
    .card-matter-type.mt-resident   { background: rgba(13,148,136,0.3); color: #99f6e4; }
    .card-matter-type.mt-untriaged  { background: rgba(255,255,255,0.12); color: rgba(255,255,255,0.6); }
    .card-dates { font-size: 0.78rem; color: rgba(255,255,255,0.45); white-space: nowrap; }
    .card-chevron { color: rgba(255,255,255,0.4); font-size: 0.85rem; transition: transform 0.2s; flex-shrink: 0; }
    .relations-card.expanded .card-chevron { transform: rotate(180deg); }

    /* STATUS PILLS -- teal palette, matches Design System addendum */
    .status-pill { display: inline-block; padding: 3px 10px; border-radius: 20px; font-size: 0.72rem; font-weight: 700; text-transform: uppercase; letter-spacing: 0.4px; white-space: nowrap; }
    .rel-pill-open              { background: rgba(20,184,166,0.35); color: #99f6e4; border: 1px solid rgba(45,212,191,0.6); }
    .rel-pill-acknowledged      { background: rgba(16,185,129,0.3);  color: #6ee7b7; border: 1px solid rgba(52,211,153,0.6); }
    .rel-pill-under-review      { background: rgba(234,179,8,0.3);   color: #fef08a; border: 1px solid rgba(234,179,8,0.6); }
    .rel-pill-closed-resolved   { background: rgba(148,163,184,0.25);color: #cbd5e1; border: 1px solid rgba(148,163,184,0.5); }
    .rel-pill-closed-unresolved { background: rgba(107,114,128,0.3); color: #d1d5db; border: 1px solid rgba(107,114,128,0.6); }

    .card-detail { display: none; padding: 0 16px 16px; }
    .relations-card.expanded .card-detail { display: block; }

    .detail-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px 20px; margin-bottom: 6px; }
    .detail-field.full-width { grid-column: 1 / -1; }
    .detail-label { font-size: 0.72rem; font-weight: 700; text-transform: uppercase; letter-spacing: 0.4px; color: rgba(255,255,255,0.5); margin-bottom: 3px; }
    .detail-value { font-size: 0.88rem; color: rgba(255,255,255,0.88); line-height: 1.5; white-space: pre-wrap; }
    .detail-section-title {
        font-size: 0.75rem; font-weight: 700; text-transform: uppercase; letter-spacing: 0.5px;
        color: rgba(255,255,255,0.45); margin: 16px 0 10px; padding-top: 14px;
        border-top: 1px solid rgba(255,255,255,0.1);
    }
    .party-block { background: rgba(13,148,136,0.12); border: 1px solid rgba(13,148,136,0.3); border-radius: 2px; padding: 10px 12px; margin-bottom: 8px; }
    .party-block .detail-label { color: #5eead4; }

    /* ── ACCORDION PANES ─────────────────────────────────────── */
    .accordion-pane { background: rgba(255,255,255,0.04); border: 1px solid rgba(255,255,255,0.1); border-radius: 2px; margin-top: 8px; overflow: hidden; }
    .accordion-pane-header { display: flex; align-items: center; justify-content: space-between; padding: 10px 14px; cursor: pointer; user-select: none; }
    .accordion-pane-header:hover { background: rgba(255,255,255,0.04); }
    .pane-title { font-size: 0.8rem; font-weight: 700; text-transform: uppercase; letter-spacing: 0.4px; color: rgba(255,255,255,0.7); }
    .pane-date { font-size: 0.75rem; color: rgba(255,255,255,0.4); margin-left: 8px; }
    .accordion-chevron { color: rgba(255,255,255,0.35); font-size: 0.8rem; transition: transform 0.2s; flex-shrink: 0; }
    .accordion-pane.open .accordion-chevron { transform: rotate(180deg); }
    .accordion-body { display: none; padding: 12px 14px; border-top: 1px solid rgba(255,255,255,0.08); }
    .accordion-pane.open .accordion-body { display: block; }
    .pane-text { font-size: 0.85rem; color: rgba(255,255,255,0.82); line-height: 1.6; white-space: pre-wrap; }
    .btn-save { background: rgba(255,255,255,0.15); border: 1px solid rgba(255,255,255,0.3); color: white; padding: 10px 24px; border-radius: 2px; font-size: 0.88rem; font-weight: 600; cursor: pointer; transition: background 0.2s; }
    .btn-save:hover    { background: rgba(255,255,255,0.25); }
    .btn-save:disabled { opacity: 0.5; cursor: not-allowed; }
    .activity-log-entry { padding: 8px 0; border-bottom: 1px solid rgba(255,255,255,0.06); }
    .activity-log-entry:last-child { border-bottom: none; }
    .event-header { font-size:0.78rem; color:rgba(255,255,255,0.55); margin-bottom:4px; }
    .event-timestamp { color:rgba(255,255,255,0.6); }
    .event-user { color:rgba(255,255,255,0.7); font-weight:600; }
    .event-type { color:#93c5fd; font-weight:600; }
    .event-visibility { font-size:0.72rem; background:rgba(255,255,255,0.1); border-radius:2px; padding:1px 5px; margin-left:4px; }
    .event-summary { font-size:0.85rem; color:white; margin-bottom:4px; }
    .event-detail { font-size:0.78rem; color:rgba(255,255,255,0.55); margin-top:2px; }
    .event-notes { font-style:italic; margin-top:4px; }

    /* ── ACTION PANEL ────────────────────────────────────────── */
    .action-panel { background: rgba(255,255,255,0.06); border: 1px solid rgba(255,255,255,0.12); border-radius: 2px; padding: 16px; margin-top: 4px; margin-bottom: 16px; }
    .action-title { font-size: 0.78rem; font-weight: 700; text-transform: uppercase; letter-spacing: 0.5px; color: rgba(255,255,255,0.5); margin-bottom: 12px; }
    .action-row { display: flex; gap: 10px; flex-wrap: wrap; margin-bottom: 10px; align-items: flex-start; }
    .action-field { display: flex; flex-direction: column; gap: 5px; flex: 1; min-width: 180px; }
    .action-field label { font-size: 0.78rem; font-weight: 600; color: rgba(255,255,255,0.7); }
    .action-field select, .action-field textarea, .action-field input[type=text] {
        background: rgba(255,255,255,0.1); border: 1px solid rgba(255,255,255,0.2);
        border-radius: 2px; padding: 8px 10px; font-size: 0.85rem; font-family: inherit; color: white; resize: vertical;
    }
    .action-field select option { background: #1e3a8a; }
    .action-field textarea { min-height: 80px; }
    .action-field textarea::placeholder, .action-field input::placeholder { color: rgba(255,255,255,0.5); }
    .action-field select:focus, .action-field textarea:focus, .action-field input:focus { outline: none; border-color: rgba(255,255,255,0.5); }

    .action-checkbox-row { display: flex; align-items: flex-start; gap: 8px; margin-bottom: 10px; }
    .action-checkbox-row input[type=checkbox] { margin-top: 3px; }
    .action-checkbox-row label { font-size: 0.85rem; color: rgba(255,255,255,0.85); line-height: 1.4; }
    .action-checkbox-row.disabled label { color: rgba(255,255,255,0.4); }

    .btn-action { background: rgba(13,148,136,0.35); border: 1px solid rgba(13,148,136,0.65); color: white; padding: 9px 20px; border-radius: 2px; font-size: 0.88rem; font-weight: 700; cursor: pointer; transition: background 0.2s; }
    .btn-action:hover    { background: rgba(13,148,136,0.6); }
    .btn-action:disabled { opacity: 0.5; cursor: not-allowed; }
    .btn-secondary-action { background: rgba(255,255,255,0.12); border: 1px solid rgba(255,255,255,0.25); color: rgba(255,255,255,0.85); padding: 9px 16px; border-radius: 2px; font-size: 0.85rem; font-weight: 600; cursor: pointer; transition: background 0.2s; }
    .btn-secondary-action:hover { background: rgba(255,255,255,0.22); color: white; }
    .btn-danger-action { background: rgba(249,115,22,0.3); border: 1px solid rgba(249,115,22,0.65); color: #fed7aa; padding: 9px 20px; border-radius: 2px; font-size: 0.88rem; font-weight: 700; cursor: pointer; transition: background 0.2s; }
    .btn-danger-action:hover    { background: rgba(249,115,22,0.55); color: white; }
    .btn-danger-action:disabled { opacity: 0.5; cursor: not-allowed; }

    .save-feedback { display: inline-block; margin-left: 10px; font-size: 0.82rem; font-weight: 600; }
    .save-feedback.success { color: #6ee7b7; }
    .save-feedback.error   { color: #fca5a5; }
    .action-note { font-size: 0.8rem; color: rgba(255,255,255,0.55); margin-top: 6px; line-height: 1.5; }
    .action-separator { border: none; border-top: 1px solid rgba(255,255,255,0.1); margin: 14px 0; }

    /* ── TRIAGE PANEL (replaces DisputesManager's Acknowledge) ─── */
    .triage-choice-row { display: flex; gap: 10px; margin-bottom: 14px; flex-wrap: wrap; }
    .triage-choice-btn {
        flex: 1; min-width: 220px; background: rgba(255,255,255,0.08); border: 1px solid rgba(255,255,255,0.2);
        border-radius: 4px; padding: 14px 16px; text-align: left; cursor: pointer; transition: all 0.15s; color: white;
    }
    .triage-choice-btn:hover { background: rgba(13,148,136,0.25); border-color: rgba(13,148,136,0.6); }
    .triage-choice-btn.selected { background: rgba(13,148,136,0.35); border-color: rgba(13,148,136,0.8); }
    .triage-choice-title { font-size: 0.92rem; font-weight: 700; margin-bottom: 4px; }
    .triage-choice-desc { font-size: 0.78rem; color: rgba(255,255,255,0.65); line-height: 1.4; }
    .description-reference-block {
        background: rgba(255,255,255,0.05); border: 1px solid rgba(255,255,255,0.15); border-radius: 4px;
        padding: 10px 12px; margin-bottom: 14px; font-size: 0.85rem; color: rgba(255,255,255,0.8); white-space: pre-wrap; line-height: 1.5;
    }
    .description-reference-label { font-size: 0.72rem; font-weight: 700; text-transform: uppercase; letter-spacing: 0.4px; color: rgba(255,255,255,0.45); margin-bottom: 6px; }

    /* ── PRINT BUTTONS ──────────────────────────────────────── */
    .btn-print { background: rgba(255,255,255,0.12); border: 1px solid rgba(255,255,255,0.25); color: rgba(255,255,255,0.85); padding: 7px 16px; border-radius: 2px; font-size: 0.85rem; font-weight: 600; cursor: pointer; transition: background 0.2s; }
    .btn-print:hover { background: rgba(255,255,255,0.22); color: white; }
    .btn-print-record { background: rgba(255,255,255,0.08); border: 1px solid rgba(255,255,255,0.18); color: rgba(255,255,255,0.7); padding: 6px 14px; border-radius: 2px; font-size: 0.82rem; font-weight: 600; cursor: pointer; transition: background 0.2s; margin-top: 8px; }
    .btn-print-record:hover { background: rgba(255,255,255,0.15); color: white; }

    /* ── NOTIFICATIONS PENDING BANNER ───────────────────────── */
    .notify-pending-banner { display: flex; align-items: flex-start; gap: 10px; background: rgba(251,191,36,0.12); border: 1px solid rgba(251,191,36,0.35); border-radius: 2px; padding: 10px 14px; margin-bottom: 14px; }
    .notify-pending-icon { font-size: 1rem; flex-shrink: 0; margin-top: 1px; color: #fbbf24; }
    .notify-pending-text { font-size: 0.82rem; color: rgba(255,255,255,0.8); line-height: 1.5; }
    .notify-pending-text strong { color: #fef08a; }

    /* ── STATES ──────────────────────────────────────────────── */
    .loading-state, .empty-state, .error-state { text-align: center; padding: 48px 20px; }
    .spinner { width: 36px; height: 36px; border: 3px solid rgba(255,255,255,0.2); border-top-color: white; border-radius: 50%; animation: spin 0.8s linear infinite; margin: 0 auto 14px; }
    @keyframes spin { to { transform: rotate(360deg); } }
    .state-text { color: rgba(255,255,255,0.7); font-size: 0.9rem; }
    .state-icon { font-size: 2.5rem; margin-bottom: 10px; }

    .hidden { display: none !important; }
    .denied-box { background: rgba(239,68,68,0.15); border: 1px solid rgba(239,68,68,0.4); border-radius: 2px; padding: 32px; text-align: center; margin: 40px auto; max-width: 480px; }
    .denied-box h2 { color: #fca5a5; font-size: 1.3rem; margin-bottom: 10px; }
    .denied-box p  { color: rgba(255,255,255,0.75); font-size: 0.9rem; margin-bottom: 6px; }
    .btn-reverify { margin-top: 18px; background: rgba(255,255,255,0.15); border: 1px solid rgba(255,255,255,0.3); color: white; padding: 10px 24px; border-radius: 2px; font-size: 0.88rem; font-weight: 600; cursor: pointer; }

    @media (max-width: 600px) {
        .header-content { flex-direction: column; gap: 15px; }
        .header-text    { align-items: center; text-align: center; }
        .header-title   { font-size: 1.8rem; }
        .logo-image     { width: 70px; height: 70px; }
        .detail-grid    { grid-template-columns: 1fr; }
        .triage-choice-row { flex-direction: column; }
    }
</style>
</head>
<body>
<div class="container">

    <!-- Header - system standard -->
    <div class="header">
        <div class="header-content">
            <div class="logo-container">
                <img src="logo.png" alt="Lake Illawong Logo" class="logo-image">
            </div>
            <div class="header-text">
                <h1 class="header-title">Relations Manager</h1>
                <p class="header-subtitle">Lake Illawong Retirement Village — Admin</p>
            </div>
        </div>
        <div class="header-divider"></div>
    </div>

    <!-- Back button -->
    <button class="portal-back-btn" onclick="window.location.href='AdminPortal.html'">
        &#8592; Back to Admin Portal
    </button>

    <!-- Access denied view -->
    <div id="deniedView" class="denied-box hidden">
        <h2>&#128683; Access Denied</h2>
        <p>You do not have permission to access Relations Manager.</p>
        <p>Signed in as: <strong id="deniedName"></strong></p>
        <p>Role: <strong id="deniedRoles"></strong></p>
        <button class="btn-reverify" onclick="reVerify()">Try Again</button>
    </div>

    <!-- Main content (hidden until auth) -->
    <div id="mainContent" class="hidden">

        <!-- Summary strip -->
        <div class="summary-strip" id="summaryStrip" style="display:none">
            <div class="summary-tile"><div class="tile-count" id="countOpen">—</div><div class="tile-label">Open</div></div>
            <div class="summary-tile"><div class="tile-count" id="countAcknowledged">—</div><div class="tile-label">Acknowledged</div></div>
            <div class="summary-tile"><div class="tile-count" id="countUnderReview">—</div><div class="tile-label">Under Review</div></div>
            <div class="summary-tile"><div class="tile-count" id="countResolved">—</div><div class="tile-label">Resolved</div></div>
            <div class="summary-tile"><div class="tile-count" id="countUnresolved">—</div><div class="tile-label">Unresolved</div></div>
            <div class="summary-tile"><div class="tile-count overdue" id="countOverdue">—</div><div class="tile-label">Overdue</div></div>
        </div>

        <!-- Filter bar -->
        <div class="filter-bar">
            <input type="text" id="filterSearch" placeholder="&#128269; Search name or unit&hellip;" oninput="applyFilters()" style="margin-right:10px;">
            <label for="filterStatus">Status:</label>
            <select id="filterStatus" onchange="applyFilters()">
                <option value="">All</option>
                <option value="Open">Open</option>
                <option value="Acknowledged">Acknowledged</option>
                <option value="Under Review">Under Review</option>
                <option value="Closed - Resolved">Closed - Resolved</option>
                <option value="Closed - Unresolved">Closed - Unresolved</option>
            </select>
            <label for="filterMatterType">Type:</label>
            <select id="filterMatterType" onchange="applyFilters()">
                <option value="">All</option>
                <option value="Management">Resident-to-Management</option>
                <option value="Resident">Resident-to-Resident</option>
                <option value="">Untriaged</option>
            </select>
            <label for="filterOverdue">Show:</label>
            <select id="filterOverdue" onchange="applyFilters()">
                <option value="">All matters</option>
                <option value="overdue">Overdue only</option>
            </select>
            <button class="btn-refresh" onclick="loadRelations()">&#8635; Refresh</button>
            <button class="btn-print" onclick="printRelationsRegister()">&#128438; Print Register</button>
            <a class="btn-log-matter" href="RelationsForm.html">+ Log Matter</a>
        </div>

        <!-- Relations list -->
        <div id="relationsList">
            <div class="loading-state">
                <div class="spinner"></div>
                <div class="state-text">Loading matters...</div>
            </div>
        </div>

    </div><!-- end mainContent -->
</div><!-- end container -->

<script>
    const CONFIG = {
        BACKEND_URL:   'https://script.google.com/macros/s/AKfycbyTuaQ90JhsVxgzD7olxO_MicP5JNlcTiQk2gQd7cwi0prHSBtx8TVl2GZQTTFT7jVN-A/exec',
        SESSION_KEY:   'portalAdminVerified',
        PORTAL_URL:    'AdminPortal.html',
        ALLOWED_ROLES: ['Relations-Manager', 'Developer'],
        REVIEW_DAYS:   28,
        EARLY_RESOLUTION_HOURS: 72,
        TRIAGE_REMINDER_HOURS:  24
    };

    let allRelations = [];

    // Tracks the Status Review decision (Resolved / Not Resolved) per
    // matter reference, local to this page load only -- same session-
    // state-only pattern DisputesManager used (disputePathChoice).
    let relationsPathChoice = {};

    // Tracks the in-progress Triage selection (Management / Resident)
    // per matter reference, local only, cleared once triage submits.
    let triagePathChoice = {};

    // ── AUTH ──────────────────────────────────────────────────────────────

    document.addEventListener('DOMContentLoaded', function () {
        const alreadyVerified = VerificationModal.init({
            moduleName: 'Relations Manager',
            moduleIcon: '🤝',
            sessionKey: CONFIG.SESSION_KEY,
            onSuccess:  handleVerificationSuccess
        });
        if (!alreadyVerified) { VerificationModal.show(); }
    });

    function handleVerificationSuccess(userData) {
        window._sessionUser = userData;
        const roles = userData.roleTags || [];
        const hasAccess = CONFIG.ALLOWED_ROLES.some(function(r) { return roles.includes(r); });
        if (!hasAccess) {
            document.getElementById('deniedName').textContent  = userData.name || 'Unknown';
            document.getElementById('deniedRoles').textContent = roles.join(', ') || 'None';
            document.getElementById('deniedView').classList.remove('hidden');
            return;
        }
        document.getElementById('mainContent').classList.remove('hidden');
        loadRelationsCategories();
        loadRelations();
    }

    function reVerify() {
        document.getElementById('deniedView').classList.add('hidden');
        VerificationModal.clearVerification();
        VerificationModal.show();
    }

    // ── JSONP HELPER ──────────────────────────────────────────────────────

    function jsonp(params, onSuccess, onError, timeoutMs) {
        const callbackName = 'rm_cb_' + Date.now() + '_' + Math.random().toString(36).slice(2);
        const qs = Object.keys(params).map(function(k) {
            return encodeURIComponent(k) + '=' + encodeURIComponent(params[k]);
        }).join('&');
        const url = CONFIG.BACKEND_URL + '?' + qs + '&callback=' + callbackName;

        let settled = false;
        const s = document.createElement('script');

        function cleanup() {
            window[callbackName] = function () {};
            try { document.head.removeChild(s); } catch (e) {}
        }

        const timer = setTimeout(function () {
            if (settled) return;
            settled = true;
            cleanup();
            if (onError) onError('Server did not respond. Please try again.');
        }, timeoutMs || 15000);

        window[callbackName] = function (data) {
            if (settled) return;
            settled = true;
            clearTimeout(timer); cleanup();
            if (onSuccess) onSuccess(data);
        };

        s.onerror = function () {
            if (settled) return;
            settled = true;
            clearTimeout(timer); cleanup();
            if (onError) onError('Could not reach the server.');
        };
        s.src = url;
        document.head.appendChild(s);
    }

    // ── LOAD RELATIONS ────────────────────────────────────────────────────

    function loadRelations() {
        const list = document.getElementById('relationsList');
        list.innerHTML = '<div class="loading-state"><div class="spinner"></div><div class="state-text">Loading matters...</div></div>';
        document.getElementById('summaryStrip').style.display = 'none';

        jsonp({ action: 'getRelations' }, function(data) {
            if (!data.success) { showPageError(data.error || 'Failed to load matters.'); return; }
            allRelations = data.relations || [];
            updateSummary(allRelations);
            document.getElementById('summaryStrip').style.display = 'flex';
            applyFilters();
        }, function(err) {
            showPageError(err);
        });
    }

    function showPageError(msg) {
        document.getElementById('relationsList').innerHTML =
            '<div class="error-state"><div class="state-icon">&#9888;</div><div class="state-text">' + escHtml(msg) + '</div></div>';
    }

    // ── SUMMARY STRIP ─────────────────────────────────────────────────────

    function updateSummary(relations) {
        var counts = { Open: 0, Acknowledged: 0, UnderReview: 0, Resolved: 0, Unresolved: 0, overdue: 0 };
        relations.forEach(function(r) {
            if (r.status === 'Open')                   counts.Open++;
            if (r.status === 'Acknowledged')           counts.Acknowledged++;
            if (r.status === 'Under Review')           counts.UnderReview++;
            if (r.status === 'Closed - Resolved')      counts.Resolved++;
            if (r.status === 'Closed - Unresolved')    counts.Unresolved++;
            if (isOverdue(r))                          counts.overdue++;
        });
        document.getElementById('countOpen').textContent         = counts.Open;
        document.getElementById('countAcknowledged').textContent = counts.Acknowledged;
        document.getElementById('countUnderReview').textContent  = counts.UnderReview;
        document.getElementById('countResolved').textContent     = counts.Resolved;
        document.getElementById('countUnresolved').textContent   = counts.Unresolved;
        document.getElementById('countOverdue').textContent      = counts.overdue;
    }

    // ── FILTER ────────────────────────────────────────────────────────────

    function applyFilters() {
        const statusF  = document.getElementById('filterStatus').value;
        const typeF    = document.getElementById('filterMatterType').value;
        const overdueF = document.getElementById('filterOverdue').value;
        const searchF  = (document.getElementById('filterSearch').value || '').trim().toLowerCase();
        // 'Untriaged' option shares value '' with 'All' in the markup above
        // -- distinguish by selectedIndex instead of value.
        const typeSel  = document.getElementById('filterMatterType');
        const untriagedOnly = typeSel.selectedIndex === 3;

        const filtered = allRelations.filter(function(r) {
            if (statusF && r.status !== statusF) return false;
            if (untriagedOnly) { if (r.matterType) return false; }
            else if (typeF && r.matterType !== typeF) return false;
            if (overdueF === 'overdue' && !isOverdue(r)) return false;
            if (searchF) {
                var partyA = (r.partyAName || '').toLowerCase();
                var partyB = (r.partyBName || '').toLowerCase();
                var unitA  = (r.partyAUnit || '').toLowerCase();
                var unitB  = (r.partyBUnit || '').toLowerCase();
                if (partyA.indexOf(searchF) === -1 && partyB.indexOf(searchF) === -1 &&
                    unitA.indexOf(searchF)  === -1 && unitB.indexOf(searchF)  === -1) return false;
            }
            return true;
        });

        renderList(filtered);
    }

    // ── OVERDUE (three-tier) ─────────────────────────────────────────────
    // Returns null if not overdue on any tier, else 'triage'|'process'|'review'.
    function overdueTier(r) {
        const TERMINAL = ['Closed - Resolved', 'Closed - Unresolved'];
        if (TERMINAL.indexOf(r.status) !== -1) return null;
        const now = new Date();

        if (r.status === 'Open') {
            if (!r.loggedAt) return null;
            const deadline = new Date(new Date(r.loggedAt).getTime() + CONFIG.TRIAGE_REMINDER_HOURS * 3600000);
            return now > deadline ? 'triage' : null;
        }
        if (r.status === 'Acknowledged' && !r.processStatementAt) {
            if (!r.loggedAt) return null;
            const deadline = new Date(new Date(r.loggedAt).getTime() + CONFIG.EARLY_RESOLUTION_HOURS * 3600000);
            if (now > deadline) return 'process';
        }
        if (r.reviewDue && now > new Date(r.reviewDue)) return 'review';
        return null;
    }

    function isOverdue(r) { return overdueTier(r) !== null; }

    // ── RENDER LIST ───────────────────────────────────────────────────────

    function renderList(relations) {
        const list = document.getElementById('relationsList');
        if (relations.length === 0) {
            list.innerHTML = '<div class="empty-state"><div class="state-icon">&#129309;</div><div class="state-text">No matters found.</div></div>';
            return;
        }
        list.innerHTML = relations.map(function(r) { return buildCard(r); }).join('');
    }

    function matterTypeLabel(r) {
        if (r.matterType === 'Management') return 'Resident-to-Management';
        if (r.matterType === 'Resident')   return 'Resident-to-Resident';
        return 'Untriaged';
    }
    function matterTypeClass(r) {
        if (r.matterType === 'Management') return 'mt-management';
        if (r.matterType === 'Resident')   return 'mt-resident';
        return 'mt-untriaged';
    }

    function buildCard(r) {
        const ref      = r.referenceNumber;
        const tier     = overdueTier(r);
        const statusCls = tier ? 'overdue-' + tier : statusCardClass(r.status);
        const pillCls   = statusPillClass(r.status);
        const loggedStr = r.loggedAt ? fmtDate(new Date(r.loggedAt)) : '—';
        const dueStr    = r.reviewDue ? fmtDate(new Date(r.reviewDue)) : '—';

        const partyLabel = [r.partyAName, r.partyAUnit ? '(' + r.partyAUnit + ')' : ''].filter(Boolean).join(' ') +
            (r.partyBName ? ' &mdash; ' + r.partyBName + (r.partyBUnit ? ' (' + r.partyBUnit + ')' : '') : '');

        return '<div class="relations-card ' + statusCls + '" id="card-' + escHtml(ref) + '">' +
            '<div class="card-summary" onclick="toggleCard(\'' + escHtml(ref) + '\')">' +
                '<div class="card-ref">' + escHtml(ref) + '</div>' +
                '<div class="card-parties">' + partyLabel + '</div>' +
                '<span class="card-matter-type ' + matterTypeClass(r) + '">' + matterTypeLabel(r) + '</span>' +
                (tier ? '<span class="overdue-badge">&#9888; Overdue</span>' : '') +
                '<span class="status-pill ' + pillCls + '">' + escHtml(r.status) + '</span>' +
                '<div class="card-dates">Logged ' + loggedStr + ' &bull; Due ' + dueStr + '</div>' +
                '<div class="card-chevron">&#9660;</div>' +
            '</div>' +
            '<div class="card-detail" id="detail-' + escHtml(ref) + '">' +
                buildCardDetail(r) +
            '</div>' +
        '</div>';
    }

    function buildCardDetail(r) {
        const ref = r.referenceNumber;
        const isResident = r.matterType === 'Resident';
        var html = '';

        // ── NOTIFICATIONS PENDING BANNER (Open, pre-triage) ──
        if (r.status === 'Open') {
            html += '<div class="notify-pending-banner">' +
                '<div class="notify-pending-icon">&#9432;</div>' +
                '<div class="notify-pending-text">' +
                '<strong>Awaiting triage</strong> — the Board alert has already been sent for this matter. ' +
                'No resident/party-facing notification fires until this matter is triaged below.' +
                '</div>' +
            '</div>';
        }

        // ── PARTY BLOCKS ──
        html += '<div class="detail-section-title">Parties</div>';
        html += '<div class="party-block">' +
            '<div class="detail-label">Party A</div>' +
            '<div class="detail-value">' + escHtml(r.partyAName || '—') + (r.partyAUnit ? ' &bull; ' + escHtml(r.partyAUnit) : '') + '</div>' +
            (r.partyAEmail ? '<div class="detail-value" style="font-size:0.82rem;color:rgba(255,255,255,0.6)">' + escHtml(r.partyAEmail) + (r.partyAMobile ? ' &bull; ' + escHtml(r.partyAMobile) : '') + '</div>' : '') +
        '</div>';

        if (isResident && r.partyBName) {
            html += '<div class="party-block">' +
                '<div class="detail-label">Party B</div>' +
                '<div class="detail-value">' + escHtml(r.partyBName) + (r.partyBUnit ? ' &bull; ' + escHtml(r.partyBUnit) : '') + '</div>' +
                (r.partyBEmail ? '<div class="detail-value" style="font-size:0.82rem;color:rgba(255,255,255,0.6)">' + escHtml(r.partyBEmail) + (r.partyBMobile ? ' &bull; ' + escHtml(r.partyBMobile) : '') + '</div>' : '') +
            '</div>';
        }

        // ── DETAILS GRID ──
        html += '<div class="detail-grid">';
        html += detailField('Logged', r.loggedAt ? fmtDateLong(new Date(r.loggedAt)) : '—');
        html += detailField('Logged By', r.loggedBy || '—');
        html += detailField('Matter Type', matterTypeLabel(r));
        if (r.triagedAt) html += detailField('Triaged', fmtDateLong(new Date(r.triagedAt)) + ' by ' + (r.triagedBy || '—'));
        html += detailField('Review Due', r.reviewDue ? fmtDateLong(new Date(r.reviewDue)) : '—');
        html += detailField('Status', r.status || '—');
        html += detailField('Category', r.category || '—');
        html += detailField('Submission Method', r.submissionMethod || '—');
        if (r.incidentDateTime) html += detailField('Incident Date/Time', fmtDateLong(new Date(r.incidentDateTime)));
        // Complaints-sourced fields -- always shown when present, regardless
        // of matter type (per Build Log: Description and the other new
        // fields display alongside Issue Detail, not instead of it).
        if (r.description)      html += detailField('Description (raw, internal only)', r.description, true);
        if (r.desiredOutcome)   html += detailField('Desired Outcome', r.desiredOutcome, true);
        if (r.previousActions)  html += detailField('Previous Actions', r.previousActions, true);
        if (r.location)         html += detailField('Location', r.location, true);
        if (r.peopleInvolved)   html += detailField('People Involved (informal)', r.peopleInvolved, true);
        // Issue Detail -- Resident-to-Resident only, populated at triage.
        if (isResident && r.issueDetail) html += detailField('Issue Detail (sent to both parties)', r.issueDetail, true);
        html += '</div>';

        // ── ACTION PANEL (Next Step -- first) ──
        html += buildActionPanel(r);

        // ── ACCORDION PANES (case record) ──
        html += buildAccordion(r);

        // ── FILTERED EVENT PANES (from Events tab) ──
        html += buildFilteredPane(r, 'all',    'Matter History', 'All board-recorded events');
        html += buildFilteredPane(r, 'partyA', 'Party A Events',  'Visibility: Party A, Shared, or All');
        if (isResident) html += buildFilteredPane(r, 'partyB', 'Party B Events', 'Visibility: Party B, Shared, or All');
        html += buildFilteredPane(r, 'board',  'Board Notes',     'Visibility: Board or All');

        // ── SYSTEM EVENTS (read-only, auto-generated) ──
        html += buildActivityLogPane(r);

        // ── ADD EVENT BUTTON ──
        html += '<div style="margin-top:12px;text-align:right;">' +
            '<button class="btn-save" onclick="openEventEntry(\'' + escHtml(ref) + '\')">+ Add Event</button>' +
        '</div>';

        return html;
    }

    function buildAccordion(r) {
        const ref = r.referenceNumber;
        var html  = '';

        if (r.processStatement) {
            html += accordionPane('pane-ps-' + ref, 'Process Statement',
                r.processStatementAt ? fmtDate(new Date(r.processStatementAt)) : '',
                '<div class="pane-text">' + escHtml(r.processStatement) + '</div>', false);
        }
        if (r.resolutionSummary) {
            html += accordionPane('pane-res-' + ref, 'Resolution Summary',
                r.resolvedAt ? fmtDate(new Date(r.resolvedAt)) : '',
                '<div class="pane-text">' + escHtml(r.resolutionSummary) + (r.earlyResolution ? '<br><br><em>Flagged as Early Resolution.</em>' : '') + '</div>', true);
        }
        if (r.closureNotes) {
            html += accordionPane('pane-cn-' + ref, 'Closure Notes',
                r.closedAt ? fmtDate(new Date(r.closedAt)) : '',
                '<div class="pane-text">' + escHtml(r.closureNotes) + '</div>', true);
        }

        return html;
    }

    function buildActivityLogPane(r) {
        const ref = r.referenceNumber;
        const logEntries = r.activityLog
            ? r.activityLog.split('\n\n').map(function(e) { return e.trim(); }).filter(Boolean).reverse()
            : [];
        const logHtml = logEntries.length
            ? renderLogEntries(logEntries)
            : '<div class="pane-text" style="color:rgba(255,255,255,0.4);">No system events recorded.</div>';
        return accordionPane('pane-sysevents-' + ref, 'System Events', 'Auto-generated only', logHtml, false);
    }

    function buildFilteredPane(r, filter, title, subtitle) {
        const ref     = r.referenceNumber;
        const paneId  = 'pane-' + filter + '-' + ref;
        const entryId = 'events-' + filter + '-' + ref;
        const isOpen  = filter === 'all';
        return '<div class="accordion-pane' + (isOpen ? ' open' : '') + '" id="' + paneId + '" style="margin-bottom:12px;">' +
            '<div class="accordion-pane-header" onclick="togglePane(\'' + paneId + '\')">' +
                '<span class="pane-title">' + escHtml(title) + '</span>' +
                '<span class="pane-date">' + escHtml(subtitle) + '</span>' +
                '<span class="accordion-chevron">&#9660;</span>' +
            '</div>' +
            '<div class="accordion-body">' +
                '<div id="' + entryId + '" class="pane-text" style="color:rgba(255,255,255,0.4);">Loading\u2026</div>' +
            '</div>' +
        '</div>';
    }

    function accordionPane(id, title, dateStr, bodyHtml, openByDefault) {
        return '<div class="accordion-pane' + (openByDefault ? ' open' : '') + '" id="' + id + '">' +
            '<div class="accordion-pane-header" onclick="togglePane(\'' + id + '\')">' +
                '<span class="pane-title">' + escHtml(title) + '</span>' +
                (dateStr ? '<span class="pane-date">' + escHtml(dateStr) + '</span>' : '') +
                '<span class="accordion-chevron">&#9660;</span>' +
            '</div>' +
            '<div class="accordion-body">' + bodyHtml + '</div>' +
        '</div>';
    }

    // ── ACTION PANEL ──────────────────────────────────────────────────────

    function buildCloseUnresolvedSection(r) {
        const ref = r.referenceNumber;
        return '<div class="action-title" style="color:#fed7aa;">&#9888; Close as Unresolved</div>' +
            '<div class="action-note" style="margin-bottom:8px;">Use this if the Board has not been able to resolve the matter internally. All parties will automatically be sent the standard advice on their options, with VicAssist suggested as a first step -- a suggestion, not a direction -- and the Board\'s offer to help with that application.</div>' +
            '<div class="action-row"><div class="action-field">' +
                '<label>Closure Notes <span style="color:rgba(255,255,255,0.4);font-weight:400;">(optional)</span></label>' +
                '<textarea id="closeun-' + ref + '" placeholder="Any context on what was tried and why it couldn\'t be resolved internally, including a withdrawal reason if applicable. Included in the closure notice sent to all parties.">' + escHtml(r.closureNotes || '') + '</textarea>' +
            '</div></div>' +
            '<div class="action-note" style="margin-bottom:8px;"><i>Use <strong>Save Draft</strong> to save your notes without notifying parties. When ready, click <strong>Close as Unresolved &amp; Notify</strong> to finalise.</i></div>' +
            '<button class="btn-save" onclick="saveRelationsDraft(\'' + ref + '\', \'closureNotes\')">Save Draft</button>' +
            '<button class="btn-danger-action" style="margin-left:8px;" onclick="doCloseUnresolved(\'' + ref + '\')">Close as Unresolved &amp; Notify</button>' +
            '<span id="fb-cu-' + ref + '" class="save-feedback"></span>';
    }

    function buildResolveSection(r, headerLabel) {
        const ref = r.referenceNumber;
        const hoursElapsed = r.loggedAt ? (Date.now() - new Date(r.loggedAt).getTime()) / 3600000 : 999;
        const earlyAvailable = hoursElapsed <= CONFIG.EARLY_RESOLUTION_HOURS;

        return '<div class="action-title" style="color:#6ee7b7;">&#10003; ' + headerLabel + '</div>' +
        '<div class="action-row"><div class="action-field">' +
            '<label>Resolution Summary <span style="color:#fca5a5">*</span></label>' +
            '<textarea id="res-' + ref + '" placeholder="Summarise how the matter was resolved and what was agreed.">' + escHtml(r.resolutionSummary || '') + '</textarea>' +
        '</div></div>' +
        '<div class="action-checkbox-row' + (earlyAvailable ? '' : ' disabled') + '">' +
            '<input type="checkbox" id="early-' + ref + '"' + (earlyAvailable ? '' : ' disabled') + '>' +
            '<label for="early-' + ref + '">Flag as Early Resolution' +
                (earlyAvailable
                    ? ' (still within 72 hours of lodgement)'
                    : ' — no longer available, the 72-hour window from lodgement has passed') +
            '</label>' +
        '</div>' +
        '<div class="action-note" style="margin-bottom:8px;"><i>Use <strong>Save Draft</strong> to save your text without notifying parties. When ready, click <strong>Resolve &amp; Close &amp; Notify</strong> to finalise.</i></div>' +
        '<button class="btn-save" onclick="saveRelationsDraft(\'' + ref + '\', \'resolution\')">Save Draft</button>' +
        '<button class="btn-action" style="margin-left:8px;" onclick="doResolveClose(\'' + ref + '\')">Resolve &amp; Close &amp; Notify</button>' +
        '<span id="fb-res-' + ref + '" class="save-feedback"></span>';
    }

    function buildTriageSection(r) {
        const ref = r.referenceNumber;
        const choice = triagePathChoice[ref];

        var html = '<div class="action-title">Triage This Matter</div>';
        html += '<div class="action-note" style="margin-bottom:12px;">Choose whether this is a matter between the resident and Management, or between two residents. This is a one-time decision -- it sets the matter type, moves status to Acknowledged, and sends the first resident/party-facing notification, all in one action.</div>';

        if (r.description) {
            html += '<div class="description-reference-block">' +
                '<div class="description-reference-label">Submitter\'s Description (raw, internal reference only)</div>' +
                escHtml(r.description) +
            '</div>';
        }

        html += '<div class="triage-choice-row">' +
            '<div class="triage-choice-btn' + (choice === 'Management' ? ' selected' : '') + '" onclick="selectTriageChoice(\'' + ref + '\', \'Management\')">' +
                '<div class="triage-choice-title">Resident-to-Management</div>' +
                '<div class="triage-choice-desc">The resident\'s issue is with the Board/Operator (was: Complaint).</div>' +
            '</div>' +
            '<div class="triage-choice-btn' + (choice === 'Resident' ? ' selected' : '') + '" onclick="selectTriageChoice(\'' + ref + '\', \'Resident\')">' +
                '<div class="triage-choice-title">Resident-to-Resident</div>' +
                '<div class="triage-choice-desc">The matter is between two residents; the Board mediates (was: Dispute).</div>' +
            '</div>' +
        '</div>';

        if (choice === 'Resident') {
            html += '<div class="action-row">' +
                '<div class="action-field"><label>Party B Name</label><input type="text" id="triage-partyBName-' + ref + '" placeholder="Full name"></div>' +
                '<div class="action-field"><label>Party B Unit</label><input type="text" id="triage-partyBUnit-' + ref + '" placeholder="e.g. Unit 14"></div>' +
            '</div>' +
            '<div class="action-row">' +
                '<div class="action-field"><label>Party B Email</label><input type="text" id="triage-partyBEmail-' + ref + '" placeholder="resident@email.com"></div>' +
                '<div class="action-field"><label>Party B Mobile</label><input type="text" id="triage-partyBMobile-' + ref + '" placeholder="04xx xxx xxx"></div>' +
            '</div>' +
            '<div class="action-row"><div class="action-field">' +
                '<label>Issue Detail — Board\'s tactful, blame-neutral summary <span style="color:#fca5a5">*</span></label>' +
                '<textarea id="triage-issueDetail-' + ref + '" placeholder="Write a neutral, factual, tactful summary of the matter, drawing on the Description above. This is sent verbatim to both parties -- do not attribute blame."></textarea>' +
            '</div></div>';
        }

        if (choice) {
            html += '<button class="btn-action" onclick="doTriage(\'' + ref + '\')">Confirm Triage &amp; Notify</button>' +
                '<span id="fb-triage-' + ref + '" class="save-feedback"></span>';
        }

        return html;
    }

    function buildActionPanel(r) {
        const ref    = r.referenceNumber;
        const status = r.status;
        const terminal = ['Closed - Resolved', 'Closed - Unresolved'];

        var html = '<div class="action-panel">';
        html += '<div class="action-title">Next Step</div>';

        if (status === 'Open') {
            html += buildTriageSection(r);
        }

        else if (status === 'Acknowledged') {
            const choice = relationsPathChoice[ref];

            if (!choice) {
                html += '<div class="action-title">Status Review</div>' +
                '<div class="action-note" style="margin-bottom:12px;">Review the current status of this matter. If already resolved, proceed directly to closure. If not yet resolved, open the Process Statement panel.</div>' +
                '<button class="btn-action" onclick="doStatusReview(\'' + ref + '\', \'resolved\')">&#10003; Resolved — Proceed to Closure</button>' +
                '<button class="btn-secondary-action" style="margin-left:8px;" onclick="doStatusReview(\'' + ref + '\', \'not_resolved\')">&#8594; Not Resolved — Open Process Statement</button>';
                html += '<hr class="action-separator">';
                html += '<button class="btn-print-record" onclick="showRelationsPrintDialog(\'' + ref + '\')">&#128438; Print Record</button>';
                return html + '</div>';
            }

            if (choice === 'not_resolved') {
                html += '<div class="action-title">Process Statement</div>' +
                '<div class="action-row"><div class="action-field full-width">' +
                    '<label>Process Statement — describe the process the Board will follow <span style="color:#fca5a5">*</span></label>' +
                    '<textarea id="ps-' + ref + '" placeholder="e.g. The Board will meet with both parties separately within 7 days and provide a written summary of the meeting to each party. Both parties will be given an opportunity to respond before any determination is made."></textarea>' +
                '</div></div>' +
                '<div class="action-note">Recorded and sent within <strong>72 hours</strong> of this matter being logged, if it remains unresolved by then.</div>' +
                '<div style="margin-top:10px;">' +
                    '<button class="btn-action" onclick="doProcessStatement(\'' + ref + '\')">Send Process Statement &amp; Notify</button>' +
                    '<span id="fb-' + ref + '" class="save-feedback"></span>' +
                '</div>' +
                '<div style="margin-top:10px;">' +
                    '<a href="#" style="color:#5eead4;font-size:0.82rem;font-weight:600;text-decoration:none;" onclick="relationsPathChoice[\'' + ref + '\']=null; renderCard(\'' + ref + '\'); return false;">&larr; Back to Status Review</a>' +
                '</div>';
                html += '<hr class="action-separator">';
                html += '<button class="btn-print-record" onclick="showRelationsPrintDialog(\'' + ref + '\')">&#128438; Print Record</button>';
                return html + '</div>';
            }

            // RESOLVED (quick path)
            html += buildResolveSection(r, 'Resolve & Close') +
            '<div style="margin-top:10px;">' +
                '<a href="#" style="color:#5eead4;font-size:0.82rem;font-weight:600;text-decoration:none;" onclick="relationsPathChoice[\'' + ref + '\']=null; renderCard(\'' + ref + '\'); return false;">&larr; Back to Status Review</a>' +
            '</div>';
            html += '<hr class="action-separator">';
            html += '<button class="btn-print-record" onclick="showRelationsPrintDialog(\'' + ref + '\')">&#128438; Print Record</button>';
            return html + '</div>';
        }

        else if (status === 'Under Review') {
            html += buildResolveSection(r, 'Resolve & Close') +
            '<hr class="action-separator">' +
            buildCloseUnresolvedSection(r);
        }

        else if (terminal.indexOf(status) !== -1) {
            html += '<div class="action-note">This matter is <strong>' + escHtml(status) + '</strong> and no further actions are available.</div>';
        }

        html += '<hr class="action-separator">';
        html += '<button class="btn-print-record" onclick="showRelationsPrintDialog(\'' + ref + '\')">&#128438; Print Record</button>';
        html += '</div>';
        return html;
    }

    // ── CARD / PANE TOGGLE ────────────────────────────────────────────────

    function toggleCard(ref) {
        const card = document.getElementById('card-' + ref);
        if (!card) return;
        card.classList.toggle('expanded');
        if (card.classList.contains('expanded')) {
            const container = document.getElementById('events-all-' + ref);
            if (container && container.classList.contains('pane-text')) {
                loadMatterHistory(ref);
            }
        }
    }

    function togglePane(id) {
        const pane = document.getElementById(id);
        if (!pane) return;
        pane.classList.toggle('open');
    }

    // ── TRIAGE ────────────────────────────────────────────────────────────

    function selectTriageChoice(ref, choice) {
        triagePathChoice[ref] = choice;
        renderCard(ref);
    }

    function doTriage(ref) {
        const choice = triagePathChoice[ref];
        if (!choice) return;
        const userName = currentUserName();
        const fbId = 'fb-triage-' + ref;

        var payload = { action: 'triageMatter', ref: ref, userName: userName, matterType: choice };

        if (choice === 'Resident') {
            const issueDetail = val('triage-issueDetail-' + ref);
            if (!issueDetail) { feedback(fbId, 'Issue Detail is required for a Resident-to-Resident matter.', false); return; }
            payload.issueDetail   = issueDetail;
            payload.partyBName    = val('triage-partyBName-'   + ref);
            payload.partyBUnit    = val('triage-partyBUnit-'   + ref);
            payload.partyBEmail   = val('triage-partyBEmail-'  + ref);
            payload.partyBMobile  = val('triage-partyBMobile-' + ref);
        }

        if (!confirm('Confirm triage as ' + (choice === 'Management' ? 'Resident-to-Management' : 'Resident-to-Resident') + '? This sends the first resident/party-facing notification and cannot be undone.')) return;

        feedback(fbId, 'Submitting…', null);
        jsonp(payload, function(data) {
            if (data.success) {
                delete triagePathChoice[ref];
                refreshCard(ref);
            } else {
                feedback(fbId, '✗ ' + (data.error || 'Triage failed.'), false);
            }
        }, function(err) { feedback(fbId, '✗ ' + err, false); });
    }

    // ── ACTIONS ───────────────────────────────────────────────────────────

    function doProcessStatement(ref) {
        const ps = val('ps-' + ref);
        if (!ps) { feedback('fb-' + ref, 'Process statement is required.', false); return; }
        const userName = currentUserName();
        const fbId = 'fb-' + ref;
        const btnEl = getSendBtn(fbId);
        btnSending(fbId, btnEl);
        jsonp({ action: 'updateRelation', ref: ref, status: 'Under Review', processStatement: ps, userName: userName, andSend: 'true' },
            function(data) {
                if (data.success) { btnDone(fbId, btnEl, true, ''); refreshCard(ref, data.activityLog); }
                else { btnDone(fbId, btnEl, false, data.error || 'Update failed.'); }
            }, function(err) { btnDone(fbId, btnEl, false, err); });
    }

    function doResolveClose(ref) {
        const res = val('res-' + ref);
        if (!res) { feedback('fb-res-' + ref, 'Resolution summary is required.', false); return; }
        if (!confirm('Resolve and close this matter, and notify all parties? This cannot be undone.')) return;
        const userName = currentUserName();
        const earlyChk = document.getElementById('early-' + ref);
        const earlyResolution = (earlyChk && !earlyChk.disabled && earlyChk.checked) ? 'true' : 'false';
        const fbIdRes = 'fb-res-' + ref;
        const btnElRes = getSendBtn(fbIdRes);
        btnSending(fbIdRes, btnElRes);
        jsonp({ action: 'updateRelation', ref: ref, status: 'Closed - Resolved', resolutionSummary: res, earlyResolution: earlyResolution, userName: userName, andSend: 'true' },
            function(data) {
                if (data.success) { btnDone(fbIdRes, btnElRes, true, ''); refreshCard(ref, data.activityLog); }
                else { btnDone(fbIdRes, btnElRes, false, data.error || 'Update failed.'); }
            }, function(err) { btnDone(fbIdRes, btnElRes, false, err); });
    }

    function saveRelationsDraft(ref, type) {
        var fbId, fieldVal, payload;
        if (type === 'resolution') {
            fieldVal = val('res-' + ref);
            fbId     = 'fb-res-' + ref;
            if (!fieldVal) { feedback(fbId, 'Please enter a resolution summary before saving.', false); return; }
            payload  = { action: 'updateRelation', ref: ref, resolutionSummary: fieldVal, userName: currentUserName(), skipLog: 'true' };
        } else {
            fieldVal = val('closeun-' + ref);
            fbId     = 'fb-cu-' + ref;
            payload  = { action: 'updateRelation', ref: ref, closureNotes: fieldVal, userName: currentUserName(), skipLog: 'true' };
        }
        feedback(fbId, 'Saving…', null);
        jsonp(payload, function(data) {
            if (data.success) {
                var timeStr = new Date().toLocaleTimeString('en-AU', { hour: '2-digit', minute: '2-digit' });
                feedback(fbId, '✓ Draft saved — ' + timeStr, true);
                if (data.activityLog) updateActivityLog(ref, data.activityLog);
            } else { feedback(fbId, '✗ ' + (data.error || 'Save failed.'), false); }
        }, function(err) { feedback(fbId, '✗ ' + err, false); });
    }

    function doCloseUnresolved(ref) {
        const notes = val('closeun-' + ref);
        if (!confirm('Close this matter as Unresolved?\n\nAll parties will be sent the standard advice on their options and notified. This cannot be undone.')) return;
        const userName = currentUserName();
        const fbId  = 'fb-cu-' + ref;
        const btnEl = getSendBtn(fbId);
        btnSending(fbId, btnEl);
        jsonp({ action: 'updateRelation', ref: ref, status: 'Closed - Unresolved', closureNotes: notes, userName: userName, andSend: 'true' },
            function(data) {
                if (data.success) { btnDone(fbId, btnEl, true, ''); refreshCard(ref, data.activityLog); }
                else { btnDone(fbId, btnEl, false, data.error || 'Update failed.'); }
            }, function(err) { btnDone(fbId, btnEl, false, err); });
    }

    function doStatusReview(ref, path) {
        relationsPathChoice[ref] = path;
        renderCard(ref);
    }

    // ── MATTER HISTORY -- load events from Events tab ─────────────────────
    const _eventCache = {};

    function loadMatterHistory(ref) {
        const panes = {
            all:    document.getElementById('events-all-'    + ref),
            partyA: document.getElementById('events-partyA-' + ref),
            partyB: document.getElementById('events-partyB-' + ref),
            board:  document.getElementById('events-board-'  + ref)
        };

        jsonp({ action: 'getEvents', matterRef: ref },
            function(data) {
                const events = (data.success && data.events) ? data.events : [];
                _eventCache[ref] = events;

                if (panes.all) {
                    panes.all.innerHTML = events.length
                        ? events.map(renderEventEntry).join('')
                        : '<div class="pane-text" style="color:rgba(255,255,255,0.4);">No events recorded yet.</div>';
                }
                const partyAEvents = events.filter(function(e) { return visMatch(e.visibility, 'Party A'); });
                if (panes.partyA) {
                    panes.partyA.innerHTML = partyAEvents.length
                        ? partyAEvents.map(renderEventEntry).join('')
                        : '<div class="pane-text" style="color:rgba(255,255,255,0.4);">No Party A events recorded yet.</div>';
                }
                const partyBEvents = events.filter(function(e) { return visMatch(e.visibility, 'Party B'); });
                if (panes.partyB) {
                    panes.partyB.innerHTML = partyBEvents.length
                        ? partyBEvents.map(renderEventEntry).join('')
                        : '<div class="pane-text" style="color:rgba(255,255,255,0.4);">No Party B events recorded yet.</div>';
                }
                const boardEvents = events.filter(function(e) { return visMatch(e.visibility, 'Board'); });
                if (panes.board) {
                    panes.board.innerHTML = boardEvents.length
                        ? boardEvents.map(renderEventEntry).join('')
                        : '<div class="pane-text" style="color:rgba(255,255,255,0.4);">No board notes recorded yet.</div>';
                }
            },
            function(err) {
                Object.values(panes).forEach(function(p) {
                    if (p) p.innerHTML = '<div class="pane-text" style="color:rgba(255,255,255,0.4);">Error loading events: ' + escHtml(err) + '</div>';
                });
            });
    }

    function renderEventEntry(ev) {
        const isEmail = ['Email Received', 'Email Sent'].indexOf(ev.eventType) !== -1;
        let detail = '';
        if (isEmail) {
            if (ev.emailDate)    detail += '<div class="event-detail">Date: '    + escHtml(ev.emailDate)    + '</div>';
            if (ev.emailFrom)    detail += '<div class="event-detail">From: '    + escHtml(ev.emailFrom)    + '</div>';
            if (ev.emailTo)      detail += '<div class="event-detail">To: '      + escHtml(ev.emailTo)      + '</div>';
            if (ev.emailSubject) detail += '<div class="event-detail">Subject: ' + escHtml(ev.emailSubject) + '</div>';
        } else if (ev.reference) {
            detail += '<div class="event-detail">Ref: ' + escHtml(ev.reference) + '</div>';
        }
        if (ev.extendedNotes) detail += '<div class="event-detail event-notes">' + escHtml(ev.extendedNotes) + '</div>';
        var visLabel = (ev.visibility || '').split(',').map(function(v) { return v.trim(); }).join(' + ');

        return '<div class="activity-log-entry">' +
            '<div class="event-header">' +
                '<span class="event-timestamp">' + escHtml(ev.timestamp) + '</span>' +
                ' <span class="event-user">' + escHtml(ev.user) + '</span>' +
                ' &mdash; <span class="event-type">[' + escHtml(ev.eventType) + ']</span>' +
                ' <span class="event-visibility">' + escHtml(visLabel) + '</span>' +
            '</div>' +
            '<div class="event-summary">' + escHtml(ev.summary) + '</div>' +
            detail +
        '</div>';
    }

    function openEventEntry(ref) {
        const userName = currentUserName();
        EventEntryModal.open({
            matterRef:  ref,
            matterType: 'Relations',
            backendUrl: CONFIG.BACKEND_URL,
            userName:   userName,
            onSuccess:  function(event) { handleNewEvent(ref, event); }
        });
    }

    function handleNewEvent(ref, event) {
        const html = renderEventEntry(event);
        if (!_eventCache[ref]) _eventCache[ref] = [];
        _eventCache[ref].unshift(event);

        function prependTo(containerId) {
            const container = document.getElementById(containerId);
            if (!container) return;
            const div = document.createElement('div');
            div.innerHTML = html;
            const emptyEl = container.querySelector('.pane-text');
            if (emptyEl && emptyEl.parentElement === container) container.innerHTML = '';
            container.insertBefore(div.firstChild, container.firstChild);
        }

        prependTo('events-all-' + ref);
        if (visMatch(event.visibility, 'Party A')) prependTo('events-partyA-' + ref);
        if (visMatch(event.visibility, 'Party B')) prependTo('events-partyB-' + ref);
        if (visMatch(event.visibility, 'Board'))   prependTo('events-board-' + ref);
    }

    // ── RELATIONS CATEGORIES (for print/reference; no intake form here) ──

    function loadRelationsCategories() {
        jsonp({ action: 'getRelationsCategories' }, function(data) {
            if (!data.success) console.warn('loadRelationsCategories: failed -- ' + (data.error || 'unknown'));
        }, function(err) { console.warn('loadRelationsCategories error: ' + err); });
    }

    // ── REFRESH / RE-RENDER ───────────────────────────────────────────────

    function refreshCard(ref, activityLog) {
        jsonp({ action: 'getRelationByRef', ref: ref }, function(data) {
            if (!data.success || !data.relation) return;
            var r = data.relation;
            for (var i = 0; i < allRelations.length; i++) {
                if (allRelations[i].referenceNumber === ref) { allRelations[i] = r; break; }
            }
            var card = document.getElementById('card-' + ref);
            var wasExpanded = card && card.classList.contains('expanded');
            var wrapper = document.createElement('div');
            wrapper.innerHTML = buildCard(r);
            var newCard = wrapper.firstChild;
            if (wasExpanded) newCard.classList.add('expanded');
            if (card && card.parentNode) card.parentNode.replaceChild(newCard, card);
            updateSummary(allRelations);
        }, function() {
            if (activityLog) updateActivityLog(ref, activityLog);
        });
    }

    function renderCard(ref) {
        var r = allRelations.find(function(x) { return x.referenceNumber === ref; });
        if (!r) return;
        var card = document.getElementById('card-' + ref);
        var wasExpanded = card && card.classList.contains('expanded');
        var wrapper = document.createElement('div');
        wrapper.innerHTML = buildCard(r);
        var newCard = wrapper.firstChild;
        if (wasExpanded) newCard.classList.add('expanded');
        if (card && card.parentNode) card.parentNode.replaceChild(newCard, card);
    }

    function renderLogEntries(entries) {
        return entries.map(function(e) {
            var isBoardLog = e.indexOf('[BOARD LOG]') !== -1;
            var isInbound  = e.indexOf('[INBOUND]')   !== -1;
            var isSystem   = e.indexOf('| SYSTEM |')  !== -1;
            var isComment  = !isSystem;

            var borderColor, pillBg, pillColor, pillLabel;
            if (isBoardLog) {
                borderColor = 'rgba(59,130,246,0.6)'; pillBg = 'rgba(59,130,246,0.3)'; pillColor = '#bfdbfe'; pillLabel = 'Board Log';
            } else if (isInbound) {
                borderColor = 'rgba(245,158,11,0.6)'; pillBg = 'rgba(245,158,11,0.3)'; pillColor = '#fde68a'; pillLabel = 'Inbound';
            } else if (isComment) {
                borderColor = 'rgba(168,85,247,0.6)'; pillBg = 'rgba(168,85,247,0.3)'; pillColor = '#e9d5ff'; pillLabel = 'Board Comment';
            } else {
                borderColor = 'rgba(255,255,255,0.15)'; pillBg = 'rgba(255,255,255,0.1)'; pillColor = 'rgba(255,255,255,0.6)'; pillLabel = 'System';
            }

            var pill = '<span style="display:inline-block;padding:1px 7px;border-radius:10px;font-size:0.68rem;font-weight:700;text-transform:uppercase;letter-spacing:0.05em;margin-right:6px;background:' + pillBg + ';color:' + pillColor + ';">' + pillLabel + '</span>';

            var headerMatch = e.match(/^(\d{4}-\d{2}-\d{2} \d{2}:\d{2})\s*\|\s*([^|]+)\|\s*([\s\S]*)$/);
            var metaLine = '';
            var bodyText = e;
            if (headerMatch) {
                var ts    = headerMatch[1].trim();
                var actor = headerMatch[2].trim();
                var body  = headerMatch[3].trim();
                var actorDisplay = actor === 'SYSTEM' ? '' : ' \u2014 ' + actor;
                metaLine = '<div style="font-size:0.75rem;color:rgba(255,255,255,0.5);margin-bottom:3px;">' + pill + ts + actorDisplay + '</div>';
                bodyText = body;
            }

            return '<div style="padding:6px 8px;border-bottom:1px solid rgba(255,255,255,0.06);border-left:3px solid ' + borderColor + ';margin-bottom:2px;background:rgba(255,255,255,0.03);">'
                + metaLine
                + '<div style="font-size:0.8rem;color:rgba(255,255,255,0.8);white-space:pre-wrap;">' + escHtml(bodyText) + '</div>'
                + '</div>';
        }).join('');
    }

    function updateActivityLog(ref, logText) {
        const pane = document.getElementById('pane-sysevents-' + ref);
        if (!pane) return;
        const body = pane.querySelector('.accordion-body');
        if (!body) return;
        const entries = logText.split('\n\n').map(function(e) { return e.trim(); }).filter(Boolean).reverse();
        body.innerHTML = entries.length
            ? renderLogEntries(entries)
            : '<div class="pane-text" style="color:rgba(255,255,255,0.4);">No system events recorded.</div>';
    }

    // ── UTILITY ───────────────────────────────────────────────────────────

    function statusCardClass(status) {
        return {
            'Open':                   'status-open',
            'Acknowledged':           'status-acknowledged',
            'Under Review':           'status-under-review',
            'Closed - Resolved':      'status-closed-resolved',
            'Closed - Unresolved':    'status-closed-unresolved'
        }[status] || 'status-open';
    }

    function statusPillClass(status) {
        return {
            'Open':                   'rel-pill-open',
            'Acknowledged':           'rel-pill-acknowledged',
            'Under Review':           'rel-pill-under-review',
            'Closed - Resolved':      'rel-pill-closed-resolved',
            'Closed - Unresolved':    'rel-pill-closed-unresolved'
        }[status] || 'rel-pill-open';
    }

    function detailField(label, value, fullWidth) {
        return '<div class="detail-field' + (fullWidth ? ' full-width' : '') + '">' +
            '<div class="detail-label">' + escHtml(label) + '</div>' +
            '<div class="detail-value">' + escHtml(value) + '</div>' +
        '</div>';
    }

    function fmtDate(d) {
        if (!d || isNaN(d)) return '—';
        return d.toLocaleDateString('en-AU', { day: 'numeric', month: 'short', year: 'numeric' });
    }
    function fmtDateLong(d) {
        if (!d || isNaN(d)) return '—';
        return d.toLocaleDateString('en-AU', { weekday: 'long', day: 'numeric', month: 'long', year: 'numeric' });
    }
    function val(id) { var el = document.getElementById(id); return el ? el.value.trim() : ''; }
    function escHtml(str) {
        if (str === null || str === undefined) return '';
        return String(str).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
    }
    function visMatch(visibility, tag) {
        if (!visibility) return false;
        return visibility.split(',').map(function(v) { return v.trim(); }).indexOf(tag) !== -1;
    }
    function feedback(id, msg, ok) {
        var el = document.getElementById(id);
        if (!el) return;
        el.textContent  = msg;
        el.className    = 'save-feedback' + (ok === true ? ' success' : ok === false ? ' error' : '');
        if (ok !== null && msg) setTimeout(function() { if (el.textContent === msg) el.textContent = ''; }, 5000);
    }
    function btnSending(fbId, btnEl, sendingText) {
        if (btnEl) { btnEl._origText = btnEl.textContent; btnEl.textContent = (sendingText || 'Sending…'); btnEl.disabled = true; }
        feedback(fbId, '', null);
    }
    function btnDone(fbId, btnEl, ok, msg, doneText) {
        if (btnEl) { btnEl.textContent = btnEl._origText || btnEl.textContent; btnEl.disabled = false; }
        var now = new Date();
        var timeStr = now.toLocaleTimeString('en-AU', { hour: '2-digit', minute: '2-digit' });
        var fullMsg = ok ? '✓ ' + (doneText || 'Sent') + ' — ' + timeStr : '✗ ' + msg;
        feedback(fbId, fullMsg, ok);
    }
    function getSendBtn(fbId) {
        var el = document.getElementById(fbId);
        if (!el) return null;
        var prev = el.previousElementSibling;
        return (prev && prev.tagName === 'BUTTON') ? prev : null;
    }
    function currentUserName() {
        return (window._sessionUser && window._sessionUser.name) ? window._sessionUser.name : 'Admin';
    }

    // ── PRINT FUNCTIONS ───────────────────────────────────────────────────

    function printRelationsStyles() {
        return `
            * { margin: 0; padding: 0; box-sizing: border-box; }
            body { font-family: Arial, sans-serif; font-size: 11pt; color: #111; background: white; }
            .print-header { border-bottom: 3px solid #0d9488; padding-bottom: 12px; margin-bottom: 20px; }
            .print-village { font-size: 9pt; font-weight: 700; text-transform: uppercase; letter-spacing: 1px; color: #0d9488; margin-bottom: 4px; }
            .print-title   { font-size: 16pt; font-weight: 700; color: #111; margin-bottom: 4px; }
            .print-ref     { font-size: 10pt; color: #444; }
            .print-confidential { font-size: 8pt; font-weight: 700; text-transform: uppercase; letter-spacing: 1px; color: #dc2626; float: right; margin-top: 6px; }
            .status-badge  { display: inline-block; padding: 3px 10px; border-radius: 3px; font-size: 9pt; font-weight: 700; text-transform: uppercase; letter-spacing: 0.5px; margin-left: 10px; }
            .rel-badge-open              { background: #ccfbf1; color: #0f766e; }
            .rel-badge-acknowledged      { background: #bbf7d0; color: #047857; }
            .rel-badge-under-review      { background: #fef3c7; color: #b45309; }
            .rel-badge-closed-resolved   { background: #f1f5f9; color: #374151; }
            .rel-badge-closed-unresolved { background: #f3f4f6; color: #374151; }
            .section-title { font-size: 8pt; font-weight: 700; text-transform: uppercase; letter-spacing: 0.5px; color: #6b7280; border-bottom: 1px solid #e5e7eb; padding-bottom: 4px; margin: 16px 0 10px; }
            .field-grid    { display: grid; grid-template-columns: 1fr 1fr; gap: 8px 24px; margin-bottom: 8px; }
            .field-full    { grid-column: 1 / -1; }
            .field-label   { font-size: 8pt; font-weight: 700; color: #6b7280; text-transform: uppercase; letter-spacing: 0.3px; margin-bottom: 2px; }
            .field-value   { font-size: 10pt; color: #111; line-height: 1.5; white-space: pre-wrap; }
            .field-empty   { color: #9ca3af; font-style: italic; }
            .party-block   { background: #f0fdfa; border: 1px solid #99f6e4; border-left: 4px solid #0d9488; padding: 10px 12px; border-radius: 3px; margin-bottom: 10px; }
            .party-block .field-label { color: #0f766e; }
            .content-block { background: #f8f9fa; border: 1px solid #e9ecef; border-left: 4px solid #0d9488; padding: 10px 12px; border-radius: 3px; margin-bottom: 10px; }
            .activity-log-print { margin: 8px 0 16px 0; padding: 10px; background: #f8fafc; border-left: 3px solid #0d9488; }
            .activity-log-entry-print { font-size: 8pt; font-family: monospace; padding: 3px 0; border-bottom: 1px solid #e5e7eb; color: #374151; white-space: pre-wrap; }
            .activity-log-entry-print:last-child { border-bottom: none; }
