<!--
=====================================================================
RelationsManager.html - RELATIONS MANAGER MODULE
=====================================================================
DOCUMENT INFORMATION:
  File Name:        RelationsManager.html
  System:           Lake Illawong Management Central System
  Component Type:   Admin Module
  Frontend Version: V1.0.13
  Status:           DEVELOPMENT
  Created:          Aug 2026

PURPOSE:
  Board-facing case management for the Relations Manager module -- the
  unified consolidation of ComplaintsManager (Resident-to-Management)
  and DisputesManager (Resident-to-Resident). Option B build: started
  from a copy of DisputesManager_V3_2_4.html (the more mature of the
  two source frontends), then deliberately modified. See
  Relations_Manager_Build_Log.md for the full decision record this
  build implements.

KEY STRUCTURAL CHANGES FROM DisputesManager.html:
  - The entire "Log Dispute" modal and resident-lookup machinery
    (searchParty, selectParty, enablePartyBManual, resetPartyBToLookup,
    openLogModal/closeLogModal/clearLogForm, submitDispute,
    loadResidentList) is REMOVED. Board direct-entry is superseded by
    the shared RelationsForm.html (per Build Log: "Board would navigate
    to the shared form rather than stay inside the Manager, trading
    'stay on one page' for 'one field set, zero duplication risk'") --
    not ported here. "+ Log Dispute" links out to RelationsForm.html
    rather than opening an inline modal.
  - Acknowledge (silent, no notification) is REPLACED by Triage: a
    single richer action, available only on Open, that asks Management
    or Resident, captures Party B + Board-authored Issue Detail if
    Resident, and fires the full triage-completion notification bundle
    server-side. There is no separate "Acknowledge" click any more.
  - Status set: Open / Acknowledged / Under Review / Closed - Resolved
    / Closed - Unresolved. No Referred/Closed - Referred (Disputes'
    external-referral machinery never applied to Relations -- it was
    already removed from Disputes itself before this build started).
  - Early Resolution: standalone action (not nested inside the Resolve
    flow -- see V1.0.2), honoured only within 72 hours of LoggedAt
    (computed client-side to show/lock the control; enforced again
    server-side as the source of truth). Resolved-only, matches the
    schema's EarlyResolution column.
  - Detail grid gains the Complaints-sourced fields (Description,
    Desired Outcome, Previous Actions, Location, People Involved),
    always shown when present, alongside the schema's MatterType-
    conditional Issue Detail (Resident-to-Resident only, populated at
    triage).
  - Card/pill CSS uses the new Relations schema documented in the
    Design System V2.4 addendum (.relations-card, .rel-pill-*) --
    teal accent retained from Disputes per Tony's explicit direction,
    new values only added where the merged 5-status set + 3-tier
    overdue treatment had no existing equivalent.
  - RoleTag: 'Relations-Manager' (Build Log: small, one-time UnitList
    change for Gary/Sue, renamed from 'Complaints-Manager').
  - SESSION_KEY: 'portalAdminVerified' -- unchanged, inherited
    deliberately (Build Log: AdminPortal.html and DisputesManager.html
    already share this key; RelationsManager.html/RelationsForm.html
    must both use it too, not invent a new one).

VERSION HISTORY:
  V1.0.13 (Aug 2026): FIX for the same outage as backend V1.0.5 --
    toggleCard() now lazy-loads activityLog via getRelationByRef() on
    first card expand only (mirroring the existing Events-pane lazy-
    load pattern already in this function), since the bulk
    getRelations() list response no longer includes it. New
    `_activityLoaded` flag (per-record, client-side only) tracks
    whether the full value has been fetched yet; refreshCard() (which
    already does a full getRelationByRef() fetch after any action)
    also sets this flag so its result isn't needlessly re-fetched.
    buildActivityLogPane() shows a "Loading..." placeholder instead of
    a false "No system events recorded" before the fetch completes.
    showRelationsPrintDialog()'s "Print Full Record" path also fetches
    fresh first if the card was never expanded, so a Full Record print
    can't silently omit System Events just because nobody happened to
    open that card first -- Party A/Party B copies don't include
    System Events at all (confirmed against the print code, unaffected
    either way) so they proceed immediately, unchanged.
  V1.0.12 (Aug 2026): "MATTER" purged from every user-visible spot --
    Tony's actual, narrower ask after stepping back from the full
    Relations->Disputes rename: fix the word wherever it's genuinely
    seen (Board or resident), leave internal-only references alone.
    First pass was incomplete (only caught the capitalised "Matter"
    pattern, missing a large set of lowercase "matter" occurrences in
    confirm() dialogs, alert() messages, placeholders, and action
    notes) -- caught on review, redone properly as a full word-boundary
    sweep (matter/Matter/matters/Matters/MATTER -> dispute equivalents,
    same safe technique already proven on the backend: \bmatter\b skips
    camelCase identifiers like matterType/matterRef/submitMatter/
    triageMatter automatically, confirmed and applied consistently this
    time rather than cherry-picked). Notable outcomes: "Matter History"
    pane renamed to "All Events" (Tony's point -- it's a consolidated
    view of the other panes, not really "the matter" as a single
    thing); "Matter Type" -> "Dispute Type" (detail grid + print
    record); "+ Log Matter" -> "+ Log Dispute"; CSS classes
    .btn-log-matter/.card-matter-type renamed to .btn-log-dispute/
    .card-dispute-type, consistently across definition and every usage
    (verified, not assumed). One follow-up fix while reviewing the
    result: the Resident-to-Resident triage choice card's "(was:
    Dispute)" annotation became circular now that "dispute" is the
    live term too -- dropped; the Management card's "(was: Complaint)"
    stays, since "Complaint" is untouched by this sweep and still
    useful context. Internal identifiers, comments, and historical
    changelog entries left alone throughout, per the established
    scoping (only what's actually seen changes).
  V1.0.11 (Aug 2026): JSONP timeouts increased 15s -> 30s (main jsonp()
    default and loadResidentList()'s own timeout) -- Tony reported list-
    load failures on opening the Manager (needing 2-3 refreshes) and a
    submission that timed out client-side while actually succeeding
    server-side (confirmed via retry showing "already registered").
    Checked against the actual precedent first, not assumed safe:
    recalled the ReportsHub/ZoneRepReports investigation, where
    increasing the timeout (even to 120s) did NOT fix a similar-
    sounding symptom -- that root cause was Apps Script's ContentService
    failing on oversized payloads, not slowness. Confirmed this isn't
    the same mechanism here (Tony has 8 records in the list; ReportsHub
    was hundreds with richer fields), so a genuine cold-start-latency
    explanation is plausible and a timeout increase is a reasonable,
    evidence-informed response here, unlike there. Not fully diagnosed
    (Tony deferred checking the Apps Script Executions log unless it
    recurs) -- noted as a watch item, not closed as solved.
    Separately: the "Resident list still loading" message on the Party
    B search is NOT a timeout issue and this change doesn't address it
    -- it fires whenever a search happens before loadResidentList()'s
    background call has finished populating allResidents, regardless of
    how long the timeout is. Left as-is; the existing message already
    handles it gracefully (clear text, works on retry).
  V1.0.10 (Aug 2026): Under Review pane restructured to choice-then-
    reveal, matching the pattern already used on Acknowledged's Status
    Review screen. Previously showed "Resolve & Close" (Resolution
    Summary textarea) and "Close as Unresolved" (Closure Notes
    textarea) simultaneously -- Tony's point: pick one first, then only
    the relevant form appears. New underReviewChoice state (per ref,
    same pattern as relationsPathChoice) and selectUnderReviewChoice().
    Early Resolution stays visible on the initial no-choice view only
    (matching its Acknowledged-pane positioning) -- once a closure path
    is chosen, only that section shows, with a "Back to Closure" link
    matching the existing "Back to Status Review" pattern.
    Also investigated, not code changes: (1) Tony raised a valid
    concern about a repeated "bug disappears once logging is added"
    pattern -- checked for an actual race condition (backend
    updateRelation() flushes before returning; jsonp() helper's unique
    per-call callback names rule out self-collision) and found none;
    the last retest's matching, complete console log is positive
    evidence the code executes correctly, pointing to stale caching
    rather than a timing bug. Offered a visible version indicator as a
    permanent fix for the ambiguity -- Tony has his own established
    verification process (checks Netlify publish status after each
    GitHub commit) and doesn't need it. (2) Tony reported intermittent
    "Unable to reach server" errors where the operation had actually
    succeeded server-side (confirmed by retry showing "already
    registered") -- consistent with the 15-second jsonp() timeout being
    shorter than occasional Apps Script cold-start response times.
    Described by Tony as a longstanding pattern predating this build,
    not something introduced here -- flagged rather than changed
    unprompted; offered to increase the timeout if wanted.
  V1.0.9 (Aug 2026): Diagnostic console logging added to
    doEarlyResolutionClose() and refreshCard() -- Tony reports Early
    Resolution on a Resident-to-Resident dispute writes correctly and
    fires notifications (confirmed via manual page reload showing the
    correct Closed - Resolved status) but the pane doesn't update in
    place, staying on the same view until a manual refresh. Code review
    found no obvious cause -- doEarlyResolutionClose() is structurally
    identical to the working doResolveClose()/doCloseUnresolved(), same
    refreshCard() call, same success handling. Per "assume nothing",
    added logging rather than guess a fix. Also fixed a real gap found
    in the same review regardless of what the actual cause turns out to
    be: refreshCard()'s inner getRelationByRef callback had a silent
    `if (!data.success || !data.relation) return;` -- no error surfaced
    anywhere if that call ever failed, which would produce exactly this
    symptom (nothing visibly happens). Now falls back to updating the
    Activity Log with the data already in hand from the original
    updateRelation response, and logs an error either way instead of
    failing silently.
  V1.0.8 (Aug 2026): EventEntryModal coordination fix -- resolves the
    "Resident/Party B Events panes don't show newly-added events"
    finding documented above, confirmed live by Tony testing (Add Event
    on a triaged Resident-to-Resident dispute showed only Dispute/
    Resident/Board panes, no Party A/Party B options at all). Paired
    with EventEntryModal.js V1.4.1 (new 'Relations-Resident' recognised
    value, additive) and RelationsManager.js (no changes needed --
    addEvent already just persists whatever matterType/visibility it's
    given). Changes here: openEventEntry() now passes 'Relations-
    Resident' for triaged Resident-to-Resident disputes (matching
    EventEntryModal's Party A/Party B/Board checkbox set) and 'Relations'
    unchanged for Management disputes; the Resident/Party A Events pane
    filter (loadMatterHistory and the print-output equivalent) now
    checks 'Party A' vs 'Resident' depending on r.matterType, matching
    whichever tag EventEntryModal actually wrote. Also corrected two
    pane subtitles ("Visibility: Party A, Shared, or All") that were
    already stale before this fix -- "Shared" hasn't existed as a
    distinct option since EventEntryModal V1.3 replaced it with
    checkbox multi-select; reworded to "Includes events tagged X",
    found and fixed in the same pass while already touching this code.
  V1.0.7 (Aug 2026): Party B entry at triage overhauled -- three
    related fixes from Tony's testing, addressed together since they're
    the same underlying gap:
    (1) Party B is now a type-ahead resident search (same
    getUnitListData pattern already proven in RelationsForm.html's
    Board-mode search and DisputesManager.html's original searchParty)
    instead of four manual free-text fields -- selecting a result
    auto-fills name/unit/email/mobile, no re-typing.
    (2) Triage could previously submit for a Resident-to-Resident
    dispute with Party B completely blank. Now enforced two ways: the
    "Confirm Triage & Notify" button is disabled until a genuine
    selection exists (triagePartyBSelected[ref] populated via the
    lookup, not just any typed text), and doTriage() itself still
    validates server-request-side as a backstop, consistent with the
    defense-in-depth pattern already used elsewhere (e.g. Early
    Resolution's 72-hour gate).
    (3) Required asterisk added to the Party B search label, matching
    the existing convention (Issue Detail, Process Statement, etc.).
    New globals: allResidents (loaded once via loadResidentList() after
    auth success), triagePartyBSelected (keyed by ref, holds the
    normalised name/unit/email/mobile once chosen). New CSS
    (.lookup-results/.lookup-result-item/.unit-tag/.prefilled-note)
    ported from RelationsForm.html's own definitions, didn't exist in
    this file before since it had no resident search until now.
  V1.0.6 (Aug 2026): Early Resolution positioning corrected. V1.0.3's
    "prominent button" fix restyled it correctly but moved it into the
    same button row as "Resolved -- Proceed to Closure", losing the
    original positioning. Restored to its own titled section, sitting
    between "Next Step" and "Status Review" (matching what the Under
    Review branch already did correctly) -- exactly where it was before
    the styling change. Raised by Tony.
  V1.0.5 (Aug 2026): Party label made conditional on dispute type,
    correcting V1.0.3's universal rename. Tony's pushback: "Resident"/
    "Other Resident" wrongly implies one party is more central than the
    other for a Resident-to-Resident dispute -- both are equally
    residents, and neutral, symmetric labels are the correct call there.
    "Resident" only made sense for Management disputes, which genuinely
    have one party and no ambiguity. New partyALabel() helper: 'Party A'
    for Resident-to-Resident disputes, 'Resident' for Management
    (untriaged defaults to 'Resident', the safer generic term pending
    triage). Applied throughout -- detail grid, Events pane titles
    (incl. the empty-state text in loadMatterHistory(), which needed an
    allRelations lookup since that function only has the ref), triage-
    time Party B field labels (reverted to plain "Party B" -- always
    Resident-to-Resident context there, no ambiguity to resolve), print
    dialog button labels, print output section titles/printTitle/
    banner, and the register table headers (kept as fixed "Party A"/
    "Party B" columns there, since the register mixes dispute types in
    one list and per-row conditional headers aren't meaningfully
    possible in a single HTML table header row).
  V1.0.4 (Aug 2026): "+ Log Dispute" button and its .btn-log-dispute CSS
    restored -- reasoned reversal of V1.0.3's removal, not a revert of
    that decision's logic. Removed at V1.0.3 on the grounds it was
    redundant now that AdminPortal.html has its own "Log a Dispute"
    card, and out of caution given an unexplained re-verification
    prompt seen while it existed. Tony clarified the actual goal was
    one-stop-shop convenience -- being able to log a dispute without
    leaving the Manager -- not eliminating a duplicate path, and
    separately confirmed via testing the AdminPortal card path that
    the shared portalAdminVerified session genuinely works with no
    re-prompt on either route. With the re-prompt concern resolved as
    unrelated to the shared-session design (see Build Log), safe to
    restore. Link unchanged: plain href to RelationsForm.html, no
    query param, same as before removal.
  V1.0.3 (Aug 2026): Four fixes from Tony's first end-to-end test round.
    (1) Early Resolution restyled from a small checkbox nested inside
    the "Resolve & Close" panel to a standalone, prominently-styled
    button (matching "Resolved -- Proceed to Closure") in the same
    button row on Acknowledged, and above the Resolve section on Under
    Review -- clicking it opens the lightweight confirm panel directly,
    no detour through the standard flow. Still locked (disabled, not
    hidden) once 72 hours from LoggedAt has passed. (2) Redundant "+
    Log Dispute" button and its now-dead .btn-log-dispute CSS removed --
    superseded by AdminPortal.html's own "Log a Dispute" card (V2.2.9).
    (3) "Party A"/"Party B" display labels renamed to "Resident"/
    "Other Resident" throughout (detail grid, Events pane titles, print
    dialog/output, register table) -- display text only; internal
    visibility-tag matching (visMatch against 'Party A'/'Party B',
    matching what EventEntryModal actually writes) left unchanged,
    pending the EventEntryModal.js coordination noted below. (4) Board
    triage-completion email now includes Description (Management
    disputes) or Issue Detail (Resident disputes) content, not just
    metadata -- RC and Zone Rep notifications deliberately left
    minimal, per the locked privacy decision, pending Tony confirming
    whether that should also change.
    KNOWN ISSUE, FIXED V1.0.8: the Resident/Party B Events panes
    filtered on visMatch(e.visibility, 'Party A'/'Party B') -- but
    EventEntryModal.js only ever wrote that tag scheme when matterType
    === 'Dispute' exactly, and this file passed matterType: 'Relations'
    unconditionally, so EventEntryModal fell into its else-branch (tags
    'Resident'/'Board') for every Relations dispute regardless of type.
    See V1.0.8 below for the fix.
  V1.0.2 (Aug 2026): Early Resolution corrected to a standalone action.
    Was nested inside the "Resolve & Close" panel, only reachable after
    first clicking "Resolved -- Proceed to Closure" on the Status
    Review screen -- contradicted the locked design ("Ticking it opens
    a lightweight Resolved panel", i.e. the checkbox itself is the
    entry point). Caught by Tony testing directly. Now rendered via a
    new buildEarlyResolutionSection(), shown immediately on the
    Acknowledged pane before any Status Review choice, and on Under
    Review above the standard Resolve & Close section. Ticking it
    reveals its own lightweight panel (short Resolution Summary + one
    confirm button, doEarlyResolutionClose()) -- no detour through the
    standard flow. Still locked (disabled, not hidden) once 72 hours
    from LoggedAt has passed, reason stated on the control itself. The
    standard Resolve & Close path (doResolveClose()) no longer carries
    its own early-resolution checkbox.
  V1.0.1 (Aug 2026): "+ Log Dispute" link's ?portal=admin query param
    dropped -- vestigial after RelationsForm.html V1.0.1's mode-
    detection correction, which reads roleTags rather than the URL.
    Found and fixed in passing while adding the AdminPortal.html
    Relations Manager card.
  V1.0.0 (Aug 2026): Initial build.

<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Relations Manager - Lake Illawong</title>
<script src="VerificationModal_V1_0.js"></script>
<script src="EventEntryModal_V1_4.js"></script>
<style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        background: linear-gradient(135deg, #1e40af 0%, #1e3a8a 100%);
        min-height: 100vh;
        color: white;
    }

    .container { max-width: 1000px; margin: 0 auto; padding: 20px; }

    /* ── HEADER ─────────────────────────────────────────────── */
    .header { text-align: center; margin-bottom: 24px; }
    .header-content { display: flex; align-items: center; justify-content: center; gap: 20px; margin-bottom: 15px; }
    .logo-image { width: 90px; height: 90px; border-radius: 50%; object-fit: cover; flex-shrink: 0; }
    .header-text { display: flex; flex-direction: column; align-items: flex-start; justify-content: center; }
    .header-title { font-size: 2.2rem; font-weight: 700; color: white; margin: 0 0 5px 0; line-height: 1.1; text-shadow: 2px 2px 4px rgba(0,0,0,0.3); }
    .header-subtitle { font-size: 1rem; color: rgba(255,255,255,0.9); font-weight: 500; }
    .header-divider {
        height: 2px;
        background: linear-gradient(90deg, transparent 0%, rgba(255,255,255,0.3) 10%,
            rgba(255,255,255,0.8) 50%, rgba(255,255,255,0.3) 90%, transparent 100%);
        border-radius: 2px; margin-top: 15px;
    }

    /* ── BACK BUTTON ─────────────────────────────────────────── */
    .portal-back-btn {
        background: rgba(255,255,255,0.15); border: 1px solid rgba(255,255,255,0.3);
        color: white; padding: 8px 18px; border-radius: 2px;
        font-size: 0.88rem; font-weight: 600; cursor: pointer;
        display: block; margin: 0 auto 20px auto; transition: background 0.2s;
    }
    .portal-back-btn:hover { background: rgba(255,255,255,0.25); }

    /* ── SUMMARY STRIP ───────────────────────────────────────── */
    .summary-strip { display: flex; gap: 10px; margin-bottom: 16px; flex-wrap: wrap; }
    .summary-tile {
        background: rgba(255,255,255,0.1); border: 1px solid rgba(255,255,255,0.15);
        backdrop-filter: blur(10px); border-radius: 2px;
        padding: 12px 10px; flex: 1; min-width: 90px; text-align: center;
    }
    .tile-count { font-size: 1.8rem; font-weight: 700; color: white; line-height: 1; }
    .tile-count.overdue { color: #fca5a5; }
    .tile-label { font-size: 0.68rem; color: rgba(255,255,255,0.7); margin-top: 4px; text-transform: uppercase; letter-spacing: 0.4px; word-break: break-word; }

    /* ── FILTER / ACTION BAR ─────────────────────────────────── */
    .filter-bar {
        background: rgba(255,255,255,0.1); border: 1px solid rgba(255,255,255,0.15);
        backdrop-filter: blur(10px); border-radius: 2px;
        padding: 12px 16px; margin-bottom: 14px;
        display: flex; gap: 12px; flex-wrap: wrap; align-items: center;
    }
    .filter-bar label { font-size: 0.82rem; font-weight: 600; color: rgba(255,255,255,0.9); white-space: nowrap; }
    .filter-bar select {
        background: rgba(255,255,255,0.15); border: 1px solid rgba(255,255,255,0.25);
        border-radius: 2px; padding: 6px 10px; font-size: 0.85rem; color: white; cursor: pointer;
    }
    .filter-bar select option { background: #1e3a8a; color: white; }
    .filter-bar input[type="text"] {
        background: rgba(255,255,255,0.1); border: 1px solid rgba(255,255,255,0.25);
        border-radius: 2px; color: white; padding: 6px 10px; font-size: 0.85rem;
        min-height: 36px; width: 200px;
    }
    .filter-bar input[type="text"]::placeholder { color: rgba(255,255,255,0.45); }
    .filter-bar input[type="text"]:focus { outline: none; background: rgba(255,255,255,0.15); border-color: rgba(255,255,255,0.45); }

    .btn-refresh {
        background: rgba(255,255,255,0.15); border: 1px solid rgba(255,255,255,0.3);
        color: white; padding: 7px 16px; border-radius: 2px;
        font-size: 0.85rem; font-weight: 600; cursor: pointer; transition: background 0.2s;
    }
    .btn-refresh:hover { background: rgba(255,255,255,0.25); }

    .btn-log-dispute {
        margin-left: auto; background: rgba(13,148,136,0.5); border: 1px solid rgba(13,148,136,0.8);
        color: white; padding: 7px 18px; border-radius: 2px;
        font-size: 0.88rem; font-weight: 700; cursor: pointer; transition: background 0.2s;
        text-decoration: none; display: inline-block;
    }
    .btn-log-dispute:hover { background: rgba(13,148,136,0.75); }


    /* ── RELATIONS CARDS ─────────────────────────────────────── */
    /* Card/pill class names and colour values match the Relations
       Module Colour Schema addendum in Unified_Design_System_v2_4.txt */
    .relations-card {
        background: rgba(255,255,255,0.08); border: 1px solid rgba(255,255,255,0.15);
        border-left: 4px solid rgba(13,148,136,0.5); backdrop-filter: blur(10px);
        border-radius: 2px; margin-bottom: 10px; overflow: hidden;
    }
    .relations-card.status-open              { border-left: 4px solid #0d9488; }
    .relations-card.status-acknowledged      { border-left: 4px solid #10b981; background: rgba(16,185,129,0.35); backdrop-filter: none; }
    .relations-card.status-under-review      { border-left: 4px solid #f59e0b; background: rgba(245,158,11,0.12); backdrop-filter: none; }
    .relations-card.status-closed-resolved   { border-left: 4px solid #cbd5e1; background: rgba(203,213,225,0.4); backdrop-filter: none; }
    .relations-card.status-closed-unresolved { border-left: 4px solid #9ca3af; background: rgba(156,163,175,0.3); backdrop-filter: none; }
    .relations-card.overdue-triage           { border-left: 4px solid #ef4444; background: rgba(239,68,68,0.45); backdrop-filter: none; }
    .relations-card.overdue-process          { border-left: 4px solid #f59e0b; background: rgba(245,158,11,0.4); backdrop-filter: none; }
    .relations-card.overdue-review           { border-left: 4px solid #f97316; background: rgba(249,115,22,0.12); backdrop-filter: none; }

    .card-summary { padding: 13px 16px; display: flex; align-items: center; gap: 12px; cursor: pointer; user-select: none; flex-wrap: wrap; }
    .card-summary:hover { background: rgba(255,255,255,0.05); }
    .card-ref { font-family: monospace; font-size: 0.8rem; font-weight: 700; color: rgba(255,255,255,0.6); white-space: nowrap; }
    .card-parties { font-size: 0.92rem; font-weight: 600; color: white; flex: 1; min-width: 120px; }
    .card-dispute-type {
        font-size: 0.68rem; font-weight: 700; text-transform: uppercase; letter-spacing: 0.4px;
        padding: 2px 8px; border-radius: 10px; white-space: nowrap;
    }
    .card-dispute-type.mt-management { background: rgba(59,130,246,0.3); color: #bfdbfe; }
    .card-dispute-type.mt-resident   { background: rgba(13,148,136,0.3); color: #99f6e4; }
    .card-dispute-type.mt-untriaged  { background: rgba(255,255,255,0.12); color: rgba(255,255,255,0.6); }
    .card-dates { font-size: 0.78rem; color: rgba(255,255,255,0.45); white-space: nowrap; }
    .card-chevron { color: rgba(255,255,255,0.4); font-size: 0.85rem; transition: transform 0.2s; flex-shrink: 0; }
    .relations-card.expanded .card-chevron { transform: rotate(180deg); }

    /* STATUS PILLS -- teal palette, matches Design System addendum */
    .status-pill { display: inline-block; padding: 3px 10px; border-radius: 20px; font-size: 0.72rem; font-weight: 700; text-transform: uppercase; letter-spacing: 0.4px; white-space: nowrap; }
    .rel-pill-open              { background: rgba(20,184,166,0.35); color: #99f6e4; border: 1px solid rgba(45,212,191,0.6); }

    .card-detail { display: none; padding: 0 16px 16px; }

    .detail-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px 20px; margin-bottom: 6px; }

    .detail-label { font-size: 0.72rem; font-weight: 700; text-transform: uppercase; letter-spacing: 0.4px; color: rgba(255,255,255,0.5); margin-bottom: 3px; }

        font-size: 0.75rem; font-weight: 700; text-transform: uppercase; letter-spacing: 0.5px;

    /* ── ACCORDION PANES ─────────────────────────────────────── */
    .accordion-pane { background: rgba(255,255,255,0.04); border: 1px solid rgba(255,255,255,0.1); border-radius: 2px; margin-top: 8px; overflow: hidden; }
    .accordion-pane-header { display: flex; align-items: center; justify-content: space-between; padding: 10px 14px; cursor: pointer; user-select: none; }
    .accordion-pane-header:hover { background: rgba(255,255,255,0.04); }
    .pane-title { font-size: 0.8rem; font-weight: 700; text-transform: uppercase; letter-spacing: 0.4px; color: rgba(255,255,255,0.7); }
    .pane-date { font-size: 0.75rem; color: rgba(255,255,255,0.4); margin-left: 8px; }
    .accordion-chevron { color: rgba(255,255,255,0.35); font-size: 0.8rem; transition: transform 0.2s; flex-shrink: 0; }
    .accordion-pane.open .accordion-chevron { transform: rotate(180deg); }
    .accordion-body { display: none; padding: 12px 14px; border-top: 1px solid rgba(255,255,255,0.08); }
    .accordion-pane.open .accordion-body { display: block; }
    .pane-text { font-size: 0.85rem; color: rgba(255,255,255,0.82); line-height: 1.6; white-space: pre-wrap; }
    .btn-save { background: rgba(255,255,255,0.15); border: 1px solid rgba(255,255,255,0.3); color: white; padding: 10px 24px; border-radius: 2px; font-size: 0.88rem; font-weight: 600; cursor: pointer; transition: background 0.2s; }
    .btn-save:hover    { background: rgba(255,255,255,0.25); }
    .btn-save:disabled { opacity: 0.5; cursor: not-allowed; }
    .activity-log-entry { padding: 8px 0; border-bottom: 1px solid rgba(255,255,255,0.06); }
    .activity-log-entry:last-child { border-bottom: none; }
    .event-header { font-size:0.78rem; color:rgba(255,255,255,0.55); margin-bottom:4px; }
    .event-timestamp { color:rgba(255,255,255,0.6); }
    .event-user { color:rgba(255,255,255,0.7); font-weight:600; }
    .event-type { color:#93c5fd; font-weight:600; }
    .event-visibility { font-size:0.72rem; background:rgba(255,255,255,0.1); border-radius:2px; padding:1px 5px; margin-left:4px; }
    .event-summary { font-size:0.85rem; color:white; margin-bottom:4px; }
    .event-detail { font-size:0.78rem; color:rgba(255,255,255,0.55); margin-top:2px; }

    /* ── ACTION PANEL ────────────────────────────────────────── */
    .action-panel { background: rgba(255,255,255,0.06); border: 1px solid rgba(255,255,255,0.12); border-radius: 2px; padding: 16px; margin-top: 4px; margin-bottom: 16px; }
    .action-title { font-size: 0.78rem; font-weight: 700; text-transform: uppercase; letter-spacing: 0.5px; color: rgba(255,255,255,0.5); margin-bottom: 12px; }
    .action-row { display: flex; gap: 10px; flex-wrap: wrap; margin-bottom: 10px; align-items: flex-start; }
    .action-field { display: flex; flex-direction: column; gap: 5px; flex: 1; min-width: 180px; }
    .action-field label { font-size: 0.78rem; font-weight: 600; color: rgba(255,255,255,0.7); }
    .action-field select, .action-field textarea, .action-field input[type=text] {
        background: rgba(255,255,255,0.1); border: 1px solid rgba(255,255,255,0.2);
        border-radius: 2px; padding: 8px 10px; font-size: 0.85rem; font-family: inherit; color: white; resize: vertical;
    }
    .action-field select option { background: #1e3a8a; }
    .action-field textarea { min-height: 80px; }
    .action-field textarea::placeholder, .action-field input::placeholder { color: rgba(255,255,255,0.5); }
    .action-field select:focus, .action-field textarea:focus, .action-field input:focus { outline: none; border-color: rgba(255,255,255,0.5); }

    .action-checkbox-row { display: flex; align-items: flex-start; gap: 8px; margin-bottom: 10px; }
    .action-checkbox-row input[type=checkbox] { margin-top: 3px; }
    .action-checkbox-row label { font-size: 0.85rem; color: rgba(255,255,255,0.85); line-height: 1.4; }

    .btn-action { background: rgba(13,148,136,0.35); border: 1px solid rgba(13,148,136,0.65); color: white; padding: 9px 20px; border-radius: 2px; font-size: 0.88rem; font-weight: 700; cursor: pointer; transition: background 0.2s; }

    .btn-action:disabled { opacity: 0.5; cursor: not-allowed; }
    .btn-secondary-action { background: rgba(255,255,255,0.12); border: 1px solid rgba(255,255,255,0.25); color: rgba(255,255,255,0.85); padding: 9px 16px; border-radius: 2px; font-size: 0.85rem; font-weight: 600; cursor: pointer; transition: background 0.2s; }
    .btn-secondary-action:hover { background: rgba(255,255,255,0.22); color: white; }
    .btn-danger-action { background: rgba(249,115,22,0.3); border: 1px solid rgba(249,115,22,0.65); color: #fed7aa; padding: 9px 20px; border-radius: 2px; font-size: 0.88rem; font-weight: 700; cursor: pointer; transition: background 0.2s; }

    .save-feedback { display: inline-block; margin-left: 10px; font-size: 0.82rem; font-weight: 600; }
    .save-feedback.success { color: #6ee7b7; }
    .save-feedback.error   { color: #fca5a5; }
    .action-note { font-size: 0.8rem; color: rgba(255,255,255,0.55); margin-top: 6px; line-height: 1.5; }
    .action-separator { border: none; border-top: 1px solid rgba(255,255,255,0.1); margin: 14px 0; }

    /* ── TRIAGE PANEL (replaces DisputesManager's Acknowledge) ─── */
    .triage-choice-row { display: flex; gap: 10px; margin-bottom: 14px; flex-wrap: wrap; }
    .triage-choice-btn {
        flex: 1; min-width: 220px; background: rgba(255,255,255,0.08); border: 1px solid rgba(255,255,255,0.2);
        border-radius: 4px; padding: 14px 16px; text-align: left; cursor: pointer; transition: all 0.15s; color: white;
    }
    .triage-choice-btn:hover { background: rgba(13,148,136,0.25); border-color: rgba(13,148,136,0.6); }
    .triage-choice-btn.selected { background: rgba(13,148,136,0.35); border-color: rgba(13,148,136,0.8); }
    .triage-choice-title { font-size: 0.92rem; font-weight: 700; margin-bottom: 4px; }
    .triage-choice-desc { font-size: 0.78rem; color: rgba(255,255,255,0.65); line-height: 1.4; }
    .description-reference-block {
        background: rgba(255,255,255,0.05); border: 1px solid rgba(255,255,255,0.15); border-radius: 4px;
        padding: 10px 12px; margin-bottom: 14px; font-size: 0.85rem; color: rgba(255,255,255,0.8); white-space: pre-wrap; line-height: 1.5;

    /* ── PARTY B LOOKUP (triage) — same pattern as RelationsForm.html's
       resident search ───────────────────────────────────────────── */
    .lookup-results {
        display: none; margin-top: 4px; border-radius: 4px; overflow: hidden;

    .lookup-result-item { padding: 10px 14px; color: #1e293b; font-size: 0.9rem; cursor: pointer; border-bottom: 1px solid #f1f5f9; transition: background 0.15s; }
    .lookup-result-item:last-child { border-bottom: none; }
    .lookup-result-item:hover { background: #f0fdfa; }
    .lookup-result-item .unit-tag { color: #6b7280; font-size: 0.8rem; margin-left: 8px; }
    .prefilled-note { font-size: 0.8rem; color: #5eead4; margin-top: 4px; }

    /* ── PRINT BUTTONS ──────────────────────────────────────── */
    .btn-print { background: rgba(255,255,255,0.12); border: 1px solid rgba(255,255,255,0.25); color: rgba(255,255,255,0.85); padding: 7px 16px; border-radius: 2px; font-size: 0.85rem; font-weight: 600; cursor: pointer; transition: background 0.2s; }
    .btn-print:hover { background: rgba(255,255,255,0.22); color: white; }
    .btn-print-record { background: rgba(255,255,255,0.08); border: 1px solid rgba(255,255,255,0.18); color: rgba(255,255,255,0.7); padding: 6px 14px; border-radius: 2px; font-size: 0.82rem; font-weight: 600; cursor: pointer; transition: background 0.2s; margin-top: 8px; }
    .btn-print-record:hover { background: rgba(255,255,255,0.15); color: white; }

    /* ── NOTIFICATIONS PENDING BANNER ───────────────────────── */
    .notify-pending-banner { display: flex; align-items: flex-start; gap: 10px; background: rgba(251,191,36,0.12); border: 1px solid rgba(251,191,36,0.35); border-radius: 2px; padding: 10px 14px; margin-bottom: 14px; }
    .notify-pending-icon { font-size: 1rem; flex-shrink: 0; margin-top: 1px; color: #fbbf24; }
    .notify-pending-text { font-size: 0.82rem; color: rgba(255,255,255,0.8); line-height: 1.5; }
    .notify-pending-text strong { color: #fef08a; }

    /* ── STATES ──────────────────────────────────────────────── */
    .loading-state, .empty-state, .error-state { text-align: center; padding: 48px 20px; }
    .spinner { width: 36px; height: 36px; border: 3px solid rgba(255,255,255,0.2); border-top-color: white; border-radius: 50%; animation: spin 0.8s linear infinite; margin: 0 auto 14px; }
    @keyframes spin { to { transform: rotate(360deg); } }
    .state-text { color: rgba(255,255,255,0.7); font-size: 0.9rem; }
    .state-icon { font-size: 2.5rem; margin-bottom: 10px; }

    .hidden { display: none !important; }
    .denied-box { background: rgba(239,68,68,0.15); border: 1px solid rgba(239,68,68,0.4); border-radius: 2px; padding: 32px; text-align: center; margin: 40px auto; max-width: 480px; }
    .denied-box h2 { color: #fca5a5; font-size: 1.3rem; margin-bottom: 10px; }
    .denied-box p  { color: rgba(255,255,255,0.75); font-size: 0.9rem; margin-bottom: 6px; }
    .btn-reverify { margin-top: 18px; background: rgba(255,255,255,0.15); border: 1px solid rgba(255,255,255,0.3); color: white; padding: 10px 24px; border-radius: 2px; font-size: 0.88rem; font-weight: 600; cursor: pointer; }

    @media (max-width: 600px) {
        .header-content { flex-direction: column; gap: 15px; }
        .header-text    { align-items: center; text-align: center; }
        .header-title   { font-size: 1.8rem; }
        .logo-image     { width: 70px; height: 70px; }
        .detail-grid    { grid-template-columns: 1fr; }
        .triage-choice-row { flex-direction: column; }
    }
</style>
